---
# Frey target inventory.
#
# Default is FreyHub's own address, which is the only address that never
# changes: join the FreyHub Wi-Fi network and the Pi is always 10.20.0.1.
# The uplink's address is whatever DHCP hands out on whatever public network
# the van is parked next to, so it is not a reliable default.
#
# Override when you are reaching the Pi over the uplink instead:
#   ansible-playbook ... -e frey_host=<uplink-address>
all:
  children:
    frey_gateways:
      hosts:
        frey:
          ansible_host: "{{ frey_host | default('10.20.0.1') }}"
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_rsa_ansible
          ansible_python_interpreter: /usr/bin/python3
      vars:
        is_pi5: true

  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    ansible_become: true
    ansible_become_method: sudo
    ansible_python_interpreter: /usr/bin/python3
