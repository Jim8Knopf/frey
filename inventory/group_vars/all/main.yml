---
# Frey active configuration.
# Legacy service stack configuration is archived in:
# archive/legacy-stack/group_vars/all/main.yml

frey:
  node_name: frey
  timezone: Pacific/Auckland
  base_dir: /opt/frey
  # The DNS zone the gateway answers for. dnsmasq resolves this name and
  # everything beneath it, at any depth, to the Pi.
  local_domain: frey

  # ---------------------------------------------------------------------------
  # THE CANONICAL SERVICE DOMAIN
  #
  # Services live at <name>.hub.frey, not <name>.frey. That extra label is not
  # decoration - single sign-on does not work without it.
  #
  # Authelia's session cookie has to be scoped to a domain covering every
  # protected service, and Authelia requires that domain to "include at least
  # one domain segment i.e. period". Browsers agree: under the Public Suffix
  # List's default rule an unknown TLD is itself a public suffix, so `frey` is
  # a bare public suffix and Set-Cookie for Domain=frey is refused. That makes
  # sonarr.frey and auth.frey siblings with no shareable parent, and forward
  # auth would log in successfully and then redirect-loop forever.
  #
  # hub.frey has a period, is not a public suffix, and covers every service.
  # "hub" is FreyHub, the name the network already has.
  #
  # Nothing breaks. Every <name>.frey still resolves, is still in the
  # certificate, and 308-redirects to its hub.frey equivalent, so existing
  # bookmarks keep landing in the right place. See docs/IDENTITY.md.
  # ---------------------------------------------------------------------------
  service_domain: "hub.{{ frey.local_domain }}"

  service_address: "{{ network_gateway.downstream.address }}"
  proxy_network: frey_proxy

  # Where frey_pki publishes the root certificate and the script that installs
  # it into a container's trust store. Declared here rather than only in
  # roles/frey_pki/defaults/ because the service modules mount these paths, and
  # a role's defaults are only in scope while that role itself is running.
  pki_public_dir: "{{ frey.base_dir }}/pki-public"

  # ---------------------------------------------------------------------------
  # WHERE SYSCTLS GO, AND WHY IT IS NOT /etc/sysctl.conf
  #
  # Here because four tasks in three roles - rpi_nvme, security_baseline and
  # network_gateway - must write to the same file.
  #
  # ansible.posix.sysctl defaults to sysctl_file=/etc/sysctl.conf, and on
  # Debian 13 **systemd-sysctl does not read that file at all**. Debian used to
  # ship /etc/sysctl.d/99-sysctl.conf as a symlink to it; trixie dropped the
  # symlink, and systemd has no built-in fallback to it. Confirm on the host:
  #
  #   systemd-analyze cat-config sysctl.d | grep /etc/sysctl.conf   # no match
  #
  # The failure is invisible from the repo side and survives every check we
  # have. `reload: true` runs `sysctl -p`, which applies the values *live*, so
  # the deploy genuinely works, the module reports `ok`, a second run reports
  # `0 changed`, and the running kernel agrees - until the next reboot silently
  # reverts every one of them to its default. Measured on 2026-10-31 after a
  # reboot: vm.swappiness 60 (set to 10), vm.vfs_cache_pressure 100 (set to
  # 50), net.ipv4.conf.all.rp_filter 0 (set to 2), and - the one that cost
  # something - kernel.hung_task_panic 0 and kernel.panic 0, so the NVMe wedge
  # self-reboot was inert at precisely the moment it was needed, because a
  # wedge happens long after the deploy that armed it.
  #
  # 99- sorts after Debian's own 98-rpi.conf, so these win.
  #
  # The keys previously written to /etc/sysctl.conf are left where they are.
  # Nothing reads that file, so they are inert rather than conflicting, and
  # editing it would mean three roles reaching into a file none of them owns.
  # If you are reading it on the Pi and wondering why its values are not the
  # live ones: that is why. The live source is the file named here.
  sysctl_file: /etc/sysctl.d/99-frey.conf

  # ---------------------------------------------------------------------------
  # TRUSTED DEVICES - THE WAY BACK IN
  #
  # The van has no Ethernet port and no console. SSH over FreyHub is the ONLY
  # way to reach the Pi, so a security mechanism that blocks it does not
  # degrade the system, it bricks it until someone drives home.
  #
  # That has already happened once. OpenSSH 9.8+ ships PerSourcePenalties on
  # by default: a source address that opens many short-lived connections -
  # exactly what a burst of `ansible-playbook` runs looks like - is penalised
  # up to 600s, during which sshd completes the TCP handshake and then closes
  # without sending a banner. Every further attempt, a bare port probe
  # included, renews the penalty. There is no log line naming a cause.
  #
  # Devices listed here are therefore exempted from every rate limit, penalty
  # and ban, at every layer that could impose one (see roles/security_baseline
  # and docs/SSH_ACCESS.md). This is a deliberate, documented hole, and it is
  # load-bearing: it is cheaper to trust the admin laptop than to lose the Pi.
  #
  # Each entry is pinned to a fixed DHCP address by `mac`, so the whitelist
  # keeps pointing at the same machine across reconnects and reboots, and
  # `<name>.frey` resolves to it. Addresses MUST sit outside the DHCP pool
  # (network_gateway.downstream.dhcp_range_start/end) so nothing else is ever
  # handed the same one.
  #
  # To trust another machine: get its MAC (`ip link show <iface>`), add it
  # here with a free address below .50, and re-run with --tags network,security.
  # ---------------------------------------------------------------------------
  trusted_devices:
    - name: thinkpad
      mac: "b4:b5:b6:a7:57:c9"
      address: 10.20.0.10
      comment: "Admin laptop - the machine Ansible is driven from"

  dns:
    # Resolves frey and any *.frey name to the Pi. New Traefik-backed services
    # only need proxy labels; DNS does not need per-service edits.
    wildcard_services: true
    records:
      - name: "@"
      - name: gateway
      - name: proxy

  modules:
    enabled:
      - network_gateway
      - rpi_nvme
      - service_proxy
      - security_baseline
      # PKI runs BEFORE identity, and before anything that serves HTTPS: it
      # issues the certificate Traefik presents. Authelia refuses plain-HTTP
      # redirect URIs for public OIDC clients, so without this there is no SSO.
      - frey_pki
      # Identity runs BEFORE the media modules, so that the forward-auth
      # middleware exists by the time their routers reference it. A router
      # pointing at a middleware Traefik does not know about is dropped
      # entirely, and the service 404s with a perfectly healthy container.
      - identity
      # Acquisition runs BEFORE library: it generates the shared *arr API
      # keys that the library module needs to wire Seerr to Sonarr/Radarr,
      # so a single run comes up fully connected.
      - media_acquisition
      - media_library
      # Monitoring runs LAST, and the order is load-bearing in two ways.
      #
      # It reads the Grafana OIDC client secret that `identity` generates, so
      # single sign-on for the dashboards only works if identity has run.
      #
      # It also derives what to probe from identity_services, so every service
      # the other modules deploy is already being watched by the time this
      # runs - a service added to the auth matrix starts being monitored with
      # no second edit anywhere.
      - monitoring
      # A window onto the compose stacks. Deliberately last and entirely
      # optional - nothing depends on it, and the monitoring module is what
      # tells you the stack is healthy. Dockge just makes it easier to SEE.
      - dockge
      - wifi_portal
      - dashy

    available:
      network_gateway:
        role: network_gateway
        tags:
          - network
          - gateway
      rpi_nvme:
        role: rpi_nvme
        tags:
          - system
          - nvme
      service_proxy:
        role: service_proxy
        tags:
          - services
          - proxy
          - docker
      security_baseline:
        role: security_baseline
        tags:
          - security
      frey_pki:
        role: frey_pki
        tags:
          - pki
          - tls
      identity:
        role: identity
        tags:
          - identity
          - sso
      media_library:
        role: media_library
        tags:
          - media
          - media_library
      media_acquisition:
        role: media_acquisition
        tags:
          - media
          - media_acquisition
      monitoring:
        role: monitoring
        tags:
          - monitoring
          - metrics
      dockge:
        role: dockge
        tags:
          - dockge
          - services
      dashy:
        role: dashy
        tags:
          - dashy
      wifi_portal:
        role: wifi_portal
        tags:
          - wifi_portal

# ==============================================================================
# DOCKGE - the compose-stack viewer
#
# Pinned like every other image: an unattended pull on a campground Wi-Fi can
# hand you a broken container with no internet left to fix it.
#
# IMPORTANT: Dockge can edit compose files, and the Frey stacks are generated
# by Ansible - every one of them says so at the top. Anything changed in the UI
# lasts until the next deploy and no longer. The role mounts those files
# READ-ONLY for that reason (dockge.stacks_writable in
# roles/dockge/defaults/main.yml). Use it to look, read logs and restart a
# container; make lasting changes in the role.
# ==============================================================================

# Image tags are centralized in inventory/group_vars/all/images.yml.

# ==============================================================================
# MEDIA - SHARED CONFIGURATION
#
# Only choices that BOTH media modules must agree on live here. Everything
# else belongs in roles/media_library/defaults/main.yml or
# roles/media_acquisition/defaults/main.yml.
#
# The two modules are deliberately separate:
#   media_library     - Jellyfin, Audiobookshelf, Seerr. Serves the van with
#                       no uplink at all. This is the half that matters when
#                       parked off-grid.
#   media_acquisition - the *arrs and qBittorrent. Useless without internet,
#                       so it can be disabled or power-gated on its own.
# ==============================================================================
media:
  # ---------------------------------------------------------------------------
  # STORAGE: ONE TREE, NOT TWO
  #
  # Downloads and the library share a single parent that is mounted into every
  # container at the SAME path (/data). That is what makes an *arr import a
  # hardlink instead of a copy: one set of bytes on disk, visible to both the
  # torrent client and the library.
  #
  # The old stack mounted /downloads and /movies and /tv separately, so every
  # import was a full file copy - double the disk, and a lot of pointless
  # writes on an NVMe that also holds the databases.
  # ---------------------------------------------------------------------------
  data_dir: "{{ frey.base_dir }}/data"
  appdata_dir: "{{ frey.base_dir }}/appdata"

  # Single uid/gid shared by every media container, so hardlinks and
  # permissions work across the whole stack.
  user:
    name: media
    uid: 63342
    gid: 63342
  # 002 so group members can write each other's files (umask, not a mode).
  umask: "002"

  languages:
    # Primary drives Jellyfin metadata, *arr language profiles and Bazarr.
    primary: en
    secondary: de
    metadata_country: NZ

  # ---------------------------------------------------------------------------
  # INTERNAL CONTAINER NETWORK
  #
  # MUST NOT overlap FreyHub's 10.20.0.0/24. The archived media role used
  # 10.20.0.0/24 for exactly this network, which would have blackholed the
  # access point - the one service that must never break.
  # ---------------------------------------------------------------------------
  network:
    name: frey_media
    subnet: 172.28.0.0/16

  # ---------------------------------------------------------------------------
  # CLIENT TARGETS -> QUALITY PROFILES
  #
  # The Pi 5 has NO hardware video encoder (it was physically removed; only
  # HEVC decode remains), so every transcode is software and competes with
  # the gateway for CPU. The only sane strategy is to never transcode: grab
  # releases the clients can direct-play.
  #
  # Phones, tablets and laptop browsers are the targets here. Browsers are
  # the fussiest - they transcode HEVC and anything that is not stereo-
  # friendly - so profiles prefer H.264 + AAC at 1080p and reject 2160p,
  # HDR-only and AV1 releases.
  # ---------------------------------------------------------------------------
  clients:
    direct_play_codecs:
      - h264
    max_resolution: 1080p
    reject_hdr_only: true
    reject_av1: true


network_gateway:
  # -----------------------------------------------------------------
  # RADIO ASSIGNMENT
  #
  # FreyHub is the critical always-on service: it is how the van reaches
  # Immich, the media stack and SSH, with or without internet. It therefore
  # lives on wlan0, the built-in Broadcom radio - soldered down, and the
  # best-proven AP driver on a Pi.
  #
  # The uplink is opportunistic and expendable, so it lives on wlan1, the
  # USB adapter. If that adapter resets or browns out you lose internet,
  # never FreyHub.
  #
  # Swapping these two `interface:` lines swaps the roles. Nothing else
  # in the role hardcodes a radio.
  # -----------------------------------------------------------------
  upstream:
    enabled: true
    interface: wlan1
    # Join open networks nobody declared - the campground/cafe case.
    # `networks` below can only cover SSIDs known in advance, because
    # NetworkManager never auto-connects to a profile that does not exist.
    # NetworkManager handles declared networks; open selection runs when down.
    # Full knobs in roles/network_gateway/defaults/main.yml.
    autojoin_open:
      enabled: true
      # Try even very weak open networks and retry failed associations soon.
      min_signal: 0
      failure_backoff_seconds: 120
      # Slow or filtered internet can fail connectivity checks: stay joined.
      unusable_grace_seconds: 0
      ssid_denylist: []
    route_metric: 100
    country: NZ
    # Known networks, declared in the vault so a rebuild reproduces them.
    # NetworkManager joins whichever is in range; none in range is fine.
    networks: "{{ vault_uplink_networks | default([]) }}"

  downstream:
    enabled: true
    mode: ap
    interface: wlan0
    connection_name: frey-hub-ap
    address: 10.20.0.1
    prefix: 24
    netmask: 255.255.255.0
    network_cidr: 10.20.0.0/24
    dhcp_range_start: 10.20.0.50
    dhcp_range_end: 10.20.0.150
    dhcp_lease_time: 12h
    domain: "{{ frey.local_domain }}"
    ap:
      ssid: FreyHub
      password: "{{ vault_freyhub_ap_password | default('') }}"
      country: NZ
      # 2.4 GHz channel 6: non-DFS, widest client support, and it carries
      # through a van body better than 5 GHz. Once the AP has proven stable,
      # switching to band 'a' channel 36 (also non-DFS in NZ) roughly
      # trebles throughput for media streaming at shorter range.
      band: bg
      channel: 6
      hidden: false

  safety:
    allow_reconfigure_control_interface: false
    rollback:
      enabled: true
      timeout_seconds: 600

rpi_nvme:
  # Boot order is deliberately SD-FIRST for now, so recovering from a bad
  # NVMe boot is just "leave the card in". 0xf461 reads right-to-left:
  #   1 = SD card, 6 = NVMe, 4 = USB, f = restart
  #
  # CONSEQUENCE: while the SD card is inserted the Pi always runs FROM the
  # card, so the NVMe clone sits idle until you physically remove it.
  # Change to 0xf416 to prefer NVMe while keeping the card as a fallback.
  migrate:
    boot_order: "0xf461"

  # Confirmed running from NVMe (nvme0n1p2) since 2026-10-26, SD card removed.
  # Enforced so a later rebuild refuses to deploy service data onto an SD card
  # instead of quietly filling it.
  require_nvme_root: true

  packages:
    - nvme-cli
    - smartmontools

  sysctl:
    vm.swappiness: "10"
    vm.vfs_cache_pressure: "50"

  journald:
    # Raspberry Pi OS defaults the journal to RAM (volatile), which loses every
    # log line on reboot. On NVMe there is no card to spare, and the logs from
    # before an unclean power loss are the whole point of having them.
    storage: persistent
    system_max_use: 256M
    max_file_sec: 7day

service_proxy:
  bind_address: "{{ frey.service_address }}"
  docker:
    data_root: "{{ frey.base_dir }}/docker"
    log_max_size: 10m
    log_max_file: "3"
    users:
      - "{{ ansible_user | default('ansible') }}"
  traefik:
    image: "traefik:{{ traefik_version }}"
    container_name: frey-traefik
    network: "{{ frey.proxy_network }}"
    dynamic_config_dir: "{{ frey.base_dir }}/proxy/traefik/dynamic"
    dashboard_enabled: false
    exposed_by_default: false
    http_port: 80
    https_port: 443

    # ------------------------------------------------------------------------
    # Traefik's own Prometheus metrics, counted at the one point every request
    # already passes through - so "is it slow or is it broken" is answered for
    # every service at once, with nothing needed from the services.
    #
    # Declared HERE as well as in roles/service_proxy/defaults/ for the reason
    # the frey.pki_public_dir comment above gives: a role's defaults are only
    # in scope while that role is running, and the monitoring module has to
    # read these to build its scrape config. Relying on service_proxy's
    # defaults happens to work today only because site.yml includes every
    # enabled module in order.
    #
    # The entrypoint is container-internal and published nowhere; Prometheus
    # reaches it over the shared proxy network.
    #
    # Enabling monitoring is what turns this on, so there is no second switch
    # to forget - but Traefik only learns about it when service_proxy runs, so
    # the first deploy needs `--tags proxy,monitoring` (or a full run).
    # ------------------------------------------------------------------------
    metrics:
      enabled: "{{ 'monitoring' in (frey.modules.enabled | default([])) }}"
      port: 8082
      add_router_labels: true

security_baseline:
  packages:
    - ufw
    - fail2ban
  firewall:
    enabled: true
    downstream_interface: "{{ network_gateway.downstream.interface }}"
    upstream_interface: "{{ network_gateway.upstream.interface }}"
    allow_ssh_from_control_interface: true
    downstream_tcp_ports:
      - 22
      - 53
      - 80
      - 443
    downstream_udp_ports:
      - 53
      - 67
    allow_gateway_routing: true
  # SSH rate limits, and the whitelist that exempts the admin laptop from
  # them. The device list itself is frey.trusted_devices above; these are the
  # layers that honour it. Rationale: docs/SSH_ACCESS.md
  #
  # Spelled out in full rather than relying on the role's defaults to fill
  # the gaps. Nested keys only merge with roles/security_baseline/defaults
  # because of `hash_behaviour = merge` in ansible.cfg, and that setting is
  # deprecated in ansible-core. If it ever stops applying, this block would
  # shadow the defaults wholesale - and a half-rendered sshd drop-in is the
  # one failure that cannot be fixed remotely.
  ssh:
    manage_config: true
    config_file: /etc/ssh/sshd_config.d/10-frey-ssh-access.conf
    legacy_config_files:
      - /etc/ssh/sshd_config.d/10-frey-resilience.conf
    login_grace_time: 30
    max_startups: "30:60:200"
    per_source_max_startups: 60
    per_source_net_block_size: "32:128"
    trusted_max_auth_tries: 20
  trusted:
    enabled: true
    networks:
      - "{{ network_gateway.downstream.network_cidr }}"
    include_loopback: true
    # Trusted machines that are not pinned devices go here.
    addresses: []
  fail2ban:
    enabled: true
  sysctl:
    net.ipv4.tcp_syncookies: "1"
    net.ipv4.conf.all.rp_filter: "2"
    net.ipv4.conf.default.rp_filter: "2"
    net.ipv4.conf.all.accept_redirects: "0"
    net.ipv4.conf.default.accept_redirects: "0"
    net.ipv4.conf.all.send_redirects: "0"
    net.ipv4.icmp_echo_ignore_broadcasts: "1"
