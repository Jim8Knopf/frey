---
# Frey active configuration.
# Legacy service stack configuration is archived in:
# archive/legacy-stack/group_vars/all/main.yml

frey:
  node_name: frey
  timezone: Australia/Brisbane
  base_dir: /opt/frey
  local_domain: frey
  service_address: "{{ network_gateway.downstream.address }}"
  proxy_network: frey_proxy

  dns:
    # Resolves frey and any *.frey name to the Pi. New Traefik-backed services
    # only need proxy labels; DNS does not need per-service edits.
    wildcard_services: true
    records:
      - name: "@"
      - name: gateway
      - name: proxy

  modules:
    enabled:
      - network_gateway
      - rpi_nvme
      - service_proxy
      - security_baseline
      # Acquisition runs BEFORE library: it generates the shared *arr API
      # keys that the library module needs to wire Seerr to Sonarr/Radarr,
      # so a single run comes up fully connected.
      - media_acquisition
      - media_library

    available:
      network_gateway:
        role: network_gateway
        tags:
          - network
          - gateway
      rpi_nvme:
        role: rpi_nvme
        tags:
          - system
          - nvme
      service_proxy:
        role: service_proxy
        tags:
          - services
          - proxy
          - docker
      security_baseline:
        role: security_baseline
        tags:
          - security
      media_library:
        role: media_library
        tags:
          - media
          - media_library
      media_acquisition:
        role: media_acquisition
        tags:
          - media
          - media_acquisition

# ==============================================================================
# MEDIA - SHARED CONFIGURATION
#
# Only choices that BOTH media modules must agree on live here. Everything
# else belongs in roles/media_library/defaults/main.yml or
# roles/media_acquisition/defaults/main.yml.
#
# The two modules are deliberately separate:
#   media_library     - Jellyfin, Audiobookshelf, Seerr. Serves the van with
#                       no uplink at all. This is the half that matters when
#                       parked off-grid.
#   media_acquisition - the *arrs and qBittorrent. Useless without internet,
#                       so it can be disabled or power-gated on its own.
# ==============================================================================
media:
  # ---------------------------------------------------------------------------
  # STORAGE: ONE TREE, NOT TWO
  #
  # Downloads and the library share a single parent that is mounted into every
  # container at the SAME path (/data). That is what makes an *arr import a
  # hardlink instead of a copy: one set of bytes on disk, visible to both the
  # torrent client and the library.
  #
  # The old stack mounted /downloads and /movies and /tv separately, so every
  # import was a full file copy - double the disk, and a lot of pointless
  # writes on an NVMe that also holds the databases.
  # ---------------------------------------------------------------------------
  data_dir: "{{ frey.base_dir }}/data"
  appdata_dir: "{{ frey.base_dir }}/appdata"

  # Single uid/gid shared by every media container, so hardlinks and
  # permissions work across the whole stack.
  user:
    name: media
    uid: 63342
    gid: 63342
  # 002 so group members can write each other's files (umask, not a mode).
  umask: "002"

  languages:
    # Primary drives Jellyfin metadata, *arr language profiles and Bazarr.
    primary: de
    secondary: en
    metadata_country: DE

  # ---------------------------------------------------------------------------
  # INTERNAL CONTAINER NETWORK
  #
  # MUST NOT overlap FreyHub's 10.20.0.0/24. The archived media role used
  # 10.20.0.0/24 for exactly this network, which would have blackholed the
  # access point - the one service that must never break.
  # ---------------------------------------------------------------------------
  network:
    name: frey_media
    subnet: 172.28.0.0/16

  # ---------------------------------------------------------------------------
  # CLIENT TARGETS -> QUALITY PROFILES
  #
  # The Pi 5 has NO hardware video encoder (it was physically removed; only
  # HEVC decode remains), so every transcode is software and competes with
  # the gateway for CPU. The only sane strategy is to never transcode: grab
  # releases the clients can direct-play.
  #
  # Phones, tablets and laptop browsers are the targets here. Browsers are
  # the fussiest - they transcode HEVC and anything that is not stereo-
  # friendly - so profiles prefer H.264 + AAC at 1080p and reject 2160p,
  # HDR-only and AV1 releases.
  # ---------------------------------------------------------------------------
  clients:
    direct_play_codecs:
      - h264
    max_resolution: 1080p
    reject_hdr_only: true
    reject_av1: true


network_gateway:
  # -----------------------------------------------------------------
  # RADIO ASSIGNMENT
  #
  # FreyHub is the critical always-on service: it is how the van reaches
  # Immich, the media stack and SSH, with or without internet. It therefore
  # lives on wlan0, the built-in Broadcom radio - soldered down, and the
  # best-proven AP driver on a Pi.
  #
  # The uplink is opportunistic and expendable, so it lives on wlan1, the
  # USB adapter. If that adapter resets or browns out you lose internet,
  # never FreyHub.
  #
  # Swapping these two `interface:` lines swaps the roles. Nothing else
  # in the role hardcodes a radio.
  # -----------------------------------------------------------------
  upstream:
    enabled: true
    interface: wlan1
    route_metric: 100
    country: NZ
    # Known networks, declared in the vault so a rebuild reproduces them.
    # NetworkManager joins whichever is in range; none in range is fine.
    networks: "{{ vault_uplink_networks | default([]) }}"

  downstream:
    enabled: true
    mode: ap
    interface: wlan0
    connection_name: frey-hub-ap
    address: 10.20.0.1
    prefix: 24
    netmask: 255.255.255.0
    network_cidr: 10.20.0.0/24
    dhcp_range_start: 10.20.0.50
    dhcp_range_end: 10.20.0.150
    dhcp_lease_time: 12h
    domain: "{{ frey.local_domain }}"
    ap:
      ssid: FreyHub
      password: "{{ vault_freyhub_ap_password | default('') }}"
      country: NZ
      # 2.4 GHz channel 6: non-DFS, widest client support, and it carries
      # through a van body better than 5 GHz. Once the AP has proven stable,
      # switching to band 'a' channel 36 (also non-DFS in NZ) roughly
      # trebles throughput for media streaming at shorter range.
      band: bg
      channel: 6
      hidden: false

  safety:
    allow_reconfigure_control_interface: false
    rollback:
      enabled: true
      timeout_seconds: 600

rpi_nvme:
  # Boot order is deliberately SD-FIRST for now, so recovering from a bad
  # NVMe boot is just "leave the card in". 0xf461 reads right-to-left:
  #   1 = SD card, 6 = NVMe, 4 = USB, f = restart
  #
  # CONSEQUENCE: while the SD card is inserted the Pi always runs FROM the
  # card, so the NVMe clone sits idle until you physically remove it.
  # Change to 0xf416 to prefer NVMe while keeping the card as a fallback.
  migrate:
    boot_order: "0xf461"

  # Confirmed running from NVMe (nvme0n1p2) since 2026-10-26, SD card removed.
  # Enforced so a later rebuild refuses to deploy service data onto an SD card
  # instead of quietly filling it.
  require_nvme_root: true

  packages:
    - nvme-cli
    - smartmontools

  sysctl:
    vm.swappiness: "10"
    vm.vfs_cache_pressure: "50"

  journald:
    system_max_use: 256M
    max_file_sec: 7day

service_proxy:
  bind_address: "{{ frey.service_address }}"
  docker:
    data_root: "{{ frey.base_dir }}/docker"
    log_max_size: 10m
    log_max_file: "3"
    users:
      - "{{ ansible_user | default('ansible') }}"
  traefik:
    image: traefik:v3
    container_name: frey-traefik
    network: "{{ frey.proxy_network }}"
    dynamic_config_dir: "{{ frey.base_dir }}/proxy/traefik/dynamic"
    dashboard_enabled: false
    exposed_by_default: false
    http_port: 80
    https_port: 443

security_baseline:
  packages:
    - ufw
    - fail2ban
  firewall:
    enabled: true
    downstream_interface: "{{ network_gateway.downstream.interface }}"
    upstream_interface: "{{ network_gateway.upstream.interface }}"
    allow_ssh_from_control_interface: true
    downstream_tcp_ports:
      - 22
      - 53
      - 80
      - 443
    downstream_udp_ports:
      - 53
      - 67
    allow_gateway_routing: true
  fail2ban:
    enabled: true
  sysctl:
    net.ipv4.tcp_syncookies: "1"
    net.ipv4.conf.all.rp_filter: "2"
    net.ipv4.conf.default.rp_filter: "2"
    net.ipv4.conf.all.accept_redirects: "0"
    net.ipv4.conf.default.accept_redirects: "0"
    net.ipv4.conf.all.send_redirects: "0"
    net.ipv4.icmp_echo_ignore_broadcasts: "1"
