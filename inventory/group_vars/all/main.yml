---
# Shared settings and ordered modules. Module settings live in adjacent files.
frey:
  node_name: frey
  timezone: Pacific/Auckland
  base_dir: /opt/frey
  local_domain: frey
  # SSO cookies need a two-label parent domain.
  service_domain: hub.{{ frey.local_domain }}
  service_address: '{{ network_gateway.downstream.address }}'
  proxy_network: frey_proxy
  # Pin both ends; only Traefik may supply trusted identity headers.
  navidrome_network:
    name: frey_navidrome_proxy
    subnet: 172.31.250.0/29
    traefik_ip: 172.31.250.2
    navidrome_ip: 172.31.250.3
  pki_public_dir: '{{ frey.base_dir }}/pki-public'
  # Debian 13 reads sysctl.d at boot, not /etc/sysctl.conf.
  sysctl_file: /etc/sysctl.d/99-frey.conf
  # Fixed leases outside the DHCP pool; exempt from SSH bans. See docs/SSH_ACCESS.md.
  trusted_devices:
    - name: thinkpad
      mac: b4:b5:b6:a7:57:c9
      address: 10.20.0.10
      comment: Admin laptop - the machine Ansible is driven from
  dns:
    wildcard_services: true
    records:
      - name: '@'
      - name: gateway
      - name: proxy
  modules:
    # proxy → PKI → identity; acquisition → library; monitoring last.
    enabled:
      - network_gateway
      - rpi_nvme
      - service_proxy
      - security_baseline
      - frey_pki
      - identity
      - media_acquisition
      - media_library
      - wifi_portal
      - dashy
      - monitoring
    available:
      network_gateway:
        role: network_gateway
        tags:
          - network
          - gateway
      rpi_nvme:
        role: rpi_nvme
        tags:
          - system
          - nvme
      service_proxy:
        role: service_proxy
        tags:
          - services
          - proxy
          - docker
      security_baseline:
        role: security_baseline
        tags:
          - security
      frey_pki:
        role: frey_pki
        tags:
          - pki
          - tls
      identity:
        role: identity
        tags:
          - identity
          - sso
      media_library:
        role: media_library
        tags:
          - media
          - media_library
      media_acquisition:
        role: media_acquisition
        tags:
          - media
          - media_acquisition
      monitoring:
        role: monitoring
        tags:
          - monitoring
          - metrics
          - dockge
      dashy:
        role: dashy
        tags:
          - dashy
      wifi_portal:
        role: wifi_portal
        tags:
          - wifi_portal
