---
# Shared storage, permissions, network and playback policy.
media:
  # One /data mount per container keeps imports on the same filesystem for hardlinks.
  data_dir: "{{ frey.base_dir }}/data"
  appdata_dir: "{{ frey.base_dir }}/appdata"

  # Single uid/gid shared by every media container, so hardlinks and
  # permissions work across the whole stack.
  user:
    name: media
    uid: 63342
    gid: 63342
  # 002 so group members can write each other's files (umask, not a mode).
  umask: "002"

  languages:
    # Primary drives Jellyfin metadata, *arr language profiles and Bazarr.
    # *_arr_name is the same language spelled the way Sonarr and Radarr spell
    # it - a custom format matches on the app's own language name, and the ids
    # behind those names are resolved at run time by
    # media_acquisition/tasks/configure/languages.yml, so none is pinned here.
    primary: en
    primary_arr_name: English
    secondary: de
    secondary_arr_name: German
    metadata_country: NZ

  network:
    name: frey_media
    subnet: 172.28.0.0/16
    resolver_address: 172.28.255.53

  # Pi 5 has no hardware video encoder; prefer formats clients can direct-play.
  clients:
    direct_play_codecs:
      - h264
    max_resolution: 1080p
    reject_hdr_only: true
    reject_av1: true


# Image versions live in inventory/group_vars/all/images.yml.

# Add the audiobook-oriented public sources below to Prowlarr. Set false to
# leave the indexer list to whatever you add by hand in the UI.
media_audiobook_public_indexer: true

# SPOKEN LANGUAGE: which languages is media.languages above - English
# primary, German secondary. This is the one knob about how strict that is.
#
# false  prefer English, then German, and grab something in another language
#        if that is all the indexers have. It is replaced automatically when
#        an English release shows up, so off-grid you get a copy now instead
#        of an empty folder and a better copy in three weeks.
# true   English or German only. Anything else is rejected outright and the
#        episode stays missing for as long as it takes.
media_language_require_one: false

# Confirmed working languages for audiobook authors. Unknown authors are looked
# up conservatively; English is the fallback when a language is unavailable or
# is neither German nor English. Keys are matched ignoring case/punctuation.
media_readmeabook_author_languages:
  "J. R. R. Tolkien": en
  "Torsten Weitze": de
  "Marc-Uwe Kling": de
  "Andreas Brandhorst": de

media_indexers:

  # --- Film and television ----------------------------------------------------
  - name: The Pirate Bay
    definition: thepiratebay
  - name: YTS
    definition: yts
    base_url: https://web.yts.gg/
  - name: LimeTorrents
    definition: limetorrents

  # --- General, and the bulk of the audiobook catalogue -----------------------
  # 1337x indexes audiobooks (3030) and ebooks (7020) as well as film and TV,
  # and is the single biggest win for finding audiobooks. It sits behind
  # Cloudflare and answers 403 without a solver, which is what Byparr is for.
  - name: 1337x
    definition: 1337x
    cloudflare: true

  # --- Audiobooks -------------------------------------------------------------
  # Knaben is a meta-search across other public sources, so it finds things no
  # single tracker lists.
  - name: Knaben
    definition: Knaben
    audiobooks: true
  # The Internet Archive is where LibriVox publishes, so this is the
  # public-domain audiobook catalogue - tens of thousands of readings, legal,
  # and the only source here that never breaks or gets challenged.
  - name: Internet Archive
    definition: internetarchive
    audiobooks: true

# ==============================================================================
# QBITTORRENT CONCURRENCY AND CONNECTION BUDGET
#
# These are tuned for the link a van actually has, not for a home connection.
#
# Measured on the uplink at Hobbiton Tours Free Wifi, 2026-11-09: 2.4 GHz at
# -72 dBm, negotiated 13 Mbit/s MCS 1, which delivered 72 KB/s host-side and
# RTT to the VPN endpoint swinging between 315 ms and 1940 ms. That jitter is
# the tell - it is a queue filling up, not distance.
#
# On a link like that, concurrency is actively harmful. Fifteen simultaneous
# downloads shared 72 KB/s fifteen ways, so nothing finished, while the
# per-torrent handshake and announce traffic ate a visible slice of the
# bandwidth it was competing for. Four at a time over the same link finishes
# four torrents in the time fifteen finished none.
#
# The connection caps exist for the same reason. qBittorrent's defaults - 500
# global connections, 100 per torrent - are a sensible home-fibre figure and a
# denial of service against a 0.6 Mbit/s radio: every one of those sockets
# wants a handshake, and on a 300 ms+ path with packet loss most of them time
# out and are retried. Raise all of these on a venue with real bandwidth; the
# numbers below are the floor that keeps a bad link usable.
# ==============================================================================
media_qbittorrent_max_active_downloads: 4
media_qbittorrent_max_active_torrents: 8
media_qbittorrent_max_connections: 100
media_qbittorrent_max_connections_per_torrent: 30
media_qbittorrent_max_uploads: 8
media_qbittorrent_max_uploads_per_torrent: 3

media_enable:

  # --- Library ---------------------------------------------------------------
  jellyfin: true
  navidrome: true
  audiobookshelf: true
  seerr: true
  audiobookrequest: true
  readmeabook: true
  maintainerr: true
  # Jellystat costs an extra PostgreSQL container (~0.5 GB). Set false to get
  # that back; the database container follows this flag automatically.
  jellystat: true

  # --- Acquisition -----------------------------------------------------------
  prowlarr: true
  jackett: true
  sonarr: true
  radarr: true
  # Lidarr's upstream metadata server has been unreliable through 2026, so
  # adding artists and imports break periodically. Not a configuration fault.
  lidarr: true
  chaptarr: true
  bazarr: true
  qbittorrent: true
  # Byparr drives a real browser engine to solve Cloudflare challenges. It is
  # the heaviest container here; turn it off if your indexers do not need it.
  byparr: true
  recyclarr: true
  cleanuparr: true
  unpackerr: true

media_vpn:
  enabled: true

  # Your provider's name as Gluetun spells it: mullvad, protonvpn, nordvpn,
  # airvpn, ivpn, surfshark, windscribe, privateinternetaccess, custom, ...
  # Full list: https://github.com/qdm12/gluetun-wiki
  provider: custom

  # wireguard or openvpn
  type: wireguard

  # Where to exit. Leave empty to let the provider choose.
  #
  # THIS IS THE LARGEST SINGLE LEVER ON DOWNLOAD SPEED, and it has already
  # cost us once. Measured 2026-11-09, parked in New Zealand: the configured
  # endpoint answered at 315 ms base RTT, so it is most of a planet away --
  # Australia would be ~30 ms and the US west coast ~150 ms. On the venue's
  # weak uplink that cost a factor of six (72 KB/s host, 11.6 KB/s tunnelled);
  # on a clean 5 GHz link an hour later the same exit cost ~40% (1.2 MB/s
  # against 735 KB/s). Distance and a bad link multiply rather than add: every
  # lost packet costs a 315 ms recovery, so the window never opens. BitTorrent
  # feels it more than a single download does, because per-connection
  # throughput is bounded by window/RTT and that is paid once per peer.
  #
  # With `provider: custom` this list does nothing: the endpoint is pinned by
  # `credentials.wireguard_endpoint` below, so moving closer means pointing
  # that at a nearer server, not editing this.
  server_countries: []

  # ---------------------------------------------------------------------------
  # INBOUND PORT
  #
  # Gluetun's killswitch drops everything arriving on the tunnel unless a port
  # is explicitly opened, so qBittorrent reports `firewalled` and can only
  # reach peers that are themselves connectable.
  #
  # Do not reach for this on the strength of `firewalled` alone. Measured
  # 2026-11-09, that status sat alongside zero connected seeds and zero DHT
  # nodes on a weak uplink, and both recovered by themselves on a good one --
  # 363 DHT nodes and `connected` within minutes, nothing here changed. Fix
  # the link first and only set this if it persists afterwards.
  #
  # Set this to the port your provider forwards to you and qBittorrent starts
  # accepting incoming peers: the port is opened on the tunnel AND becomes
  # qBittorrent's listen port, because a forwarded port only helps if the
  # application is actually listening on that exact number.
  #
  # Leave empty if your provider does not offer port forwarding - many do not,
  # and nothing here breaks without it. You simply stay connectable-peers-only.
  # Note that Gluetun cannot negotiate this for a `custom` provider; it has an
  # automatic path for PIA and ProtonVPN only, so for anything else the port
  # comes from the provider's control panel and is pasted here.
  # ---------------------------------------------------------------------------
  forwarded_port: ""

  credentials:
    wireguard_private_key: "{{ vault_generous_wireguard_private_key | default('') }}"
    wireguard_addresses: "{{ vault_generous_wireguard_addresses | default('') }}"
    wireguard_public_key: "{{ vault_generous_wireguard_public_key | default('') }}"
    wireguard_endpoint: "{{ vault_generous_wireguard_endpoint | default('') }}"
    wireguard_port: "{{ vault_generous_wireguard_port | default(51820) }}"
    wireguard_preshared_key: "{{ vault_vpn_wireguard_preshared_key | default('') }}"
    openvpn_user: "{{ vault_vpn_openvpn_user | default('') }}"
    openvpn_password: "{{ vault_vpn_openvpn_password | default('') }}"

  # Subnets allowed to reach qBittorrent's web UI through the tunnel
  # container. Without these Gluetun's killswitch blocks Traefik and the
  # *arrs too, and the UI becomes unreachable along with the leaks.
  # Defaults cover the Docker networks and the FreyHub LAN.
  allowed_subnets:
    - "{{ media.network.subnet }}"
    - "{{ network_gateway.downstream.network_cidr }}"
