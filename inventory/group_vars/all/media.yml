---
# ==============================================================================
#
#   FREY MEDIA - SERVICE SETTINGS
#
#   On/off switches and the VPN toggle, all in one place so
#   you never have to go hunting through the roles for them.
#
#   Everything structural - volumes, networks, Traefik labels, API wiring -
#   stays in roles/media_acquisition/ and roles/media_library/. You should not
#   need to touch those to run the stack day to day.
#
# ------------------------------------------------------------------------------
#   UPDATING IMAGES
#
#   1. See what is out of date:
#          scripts/media-check-updates.sh
#   2. Edit media_versions in inventory/group_vars/all/images.yml.
#   3. Apply, while you still have a connection:
#          ansible-playbook -i inventory/hosts.yml playbooks/site.yml \
#            --tags media --vault-password-file .vault_pass
#
#   Images are pinned on purpose. The old stack used `latest` everywhere,
#   which means an unattended pull on a campground Wi-Fi can hand you a broken
#   stack with no internet left to fix it with.
#
#   To re-pull the same pinned tags (linuxserver rebuilds them for base-image
#   security fixes without changing the version):
#       ansible-playbook ... --tags media_update -e media_update=true
#
# ==============================================================================


# Image versions live in inventory/group_vars/all/images.yml.

# Add Knaben as a public audiobook search source in Prowlarr. Its sync profile
# permits interactive searches only in other *arr apps, not RSS or auto grabs.
media_audiobook_public_indexer: true

# SPOKEN LANGUAGE: which languages is set in group_vars/all/main.yml
# (media.languages - English primary, German secondary). This is the one knob
# about how strict that is.
#
# false  prefer English, then German, and grab something in another language
#        if that is all the indexers have. It is replaced automatically when
#        an English release shows up, so off-grid you get a copy now instead
#        of an empty folder and a better copy in three weeks.
# true   English or German only. Anything else is rejected outright and the
#        episode stays missing for as long as it takes.
media_language_require_one: false

# Permit 15 concurrent downloads and reserve three more active-torrent slots
# for the existing upload limit. qBittorrent's global limit applies to both.
media_qbittorrent_max_active_downloads: 15
media_qbittorrent_max_active_torrents: 18



# ==============================================================================
# WHICH SERVICES RUN
#
# Turning one off stops and removes its container on the next deploy; its data
# under /opt/frey/appdata is left alone, so turning it back on resumes.
# ==============================================================================
media_enable:

  # --- Library ---------------------------------------------------------------
  jellyfin: true
  audiobookshelf: true
  seerr: true
  audiobookrequest: true
  maintainerr: true
  # Jellystat costs an extra PostgreSQL container (~0.5 GB). Set false to get
  # that back; the database container follows this flag automatically.
  jellystat: true

  # --- Acquisition -----------------------------------------------------------
  prowlarr: true
  sonarr: true
  radarr: true
  # Lidarr's upstream metadata server has been unreliable through 2026, so
  # adding artists and imports break periodically. Not a configuration fault.
  lidarr: true
  chaptarr: true
  bazarr: true
  qbittorrent: true
  # Byparr drives a real browser engine to solve Cloudflare challenges. It is
  # the heaviest container here; turn it off if your indexers do not need it.
  byparr: true
  recyclarr: true
  cleanuparr: true
  unpackerr: true


# ==============================================================================
# VPN
#
#   Flip enabled to true, fill in the credentials, and re-deploy:
#
#       ansible-playbook -i inventory/hosts.yml playbooks/site.yml \
#         --tags media_acquisition --vault-password-file .vault_pass
#
#   WHAT CHANGES WHEN YOU DO
#
#   qBittorrent stops having its own network connection and routes entirely
#   through the Gluetun container (`network_mode: service:gluetun`). If the
#   tunnel drops, Gluetun's firewall blocks everything - so torrent traffic
#   cannot leak to the campground's network, it simply stops. That killswitch
#   is the point of doing it this way rather than pointing qBittorrent at a
#   proxy.
#
#   Ansible re-points the *arrs at the tunnel automatically; nothing else here
#   needs changing. The qBittorrent web UI stays at qbittorrent.frey.
#
#   WHERE THE CREDENTIALS GO
#
#   In the vault, never here:
#       ansible-vault edit inventory/group_vars/all/secrets.yml \
#         --vault-password-file .vault_pass
#
#   WireGuard (preferred - faster, and the only option on some providers):
#       vault_vpn_wireguard_private_key: "..."
#       vault_vpn_wireguard_addresses: "10.2.0.2/32"
#       vault_vpn_wireguard_preshared_key: ""      # optional
#
#   OpenVPN:
#       vault_vpn_openvpn_user: "..."
#       vault_vpn_openvpn_password: "..."
#
#   A deploy with enabled: true and no credentials fails immediately with an
#   explanatory message rather than silently starting an open tunnel.
# ==============================================================================
media_vpn:
  enabled: false

  # Your provider's name as Gluetun spells it: mullvad, protonvpn, nordvpn,
  # airvpn, ivpn, surfshark, windscribe, privateinternetaccess, custom, ...
  # Full list: https://github.com/qdm12/gluetun-wiki
  provider: mullvad

  # wireguard or openvpn
  type: wireguard

  # Where to exit. Leave empty to let the provider choose.
  # Keep this in mind for a van: an exit far from where you are parked makes
  # every download slower.
  server_countries: []

  credentials:
    wireguard_private_key: "{{ vault_vpn_wireguard_private_key | default('') }}"
    wireguard_addresses: "{{ vault_vpn_wireguard_addresses | default('') }}"
    wireguard_preshared_key: "{{ vault_vpn_wireguard_preshared_key | default('') }}"
    openvpn_user: "{{ vault_vpn_openvpn_user | default('') }}"
    openvpn_password: "{{ vault_vpn_openvpn_password | default('') }}"

  # Subnets allowed to reach qBittorrent's web UI through the tunnel
  # container. Without these Gluetun's killswitch blocks Traefik and the
  # *arrs too, and the UI becomes unreachable along with the leaks.
  # Defaults cover the Docker networks and the FreyHub LAN.
  allowed_subnets:
    - "{{ media.network.subnet }}"
    - "{{ network_gateway.downstream.network_cidr }}"
    - 172.16.0.0/12
