---

# Image versions live in inventory/group_vars/all/images.yml.

monitoring_enable:
  metrics: true
  alerting: true
  logs: true
  grafana: true
  dockge: true

  # Individual collectors, for when one of them misbehaves.
  node_exporter: true
  cadvisor: true
  blackbox: true
  # Host scripts that produce the metrics nothing off-the-shelf provides:
  # Pi throttling and PMIC power, NVMe SMART, AP clients, DHCP leases, DNS
  # answers, NAT rules, container state. This is also where future van sensors
  # plug in - see THE SENSOR SEAM at the bottom of this file.
  host_collectors: true
  log_repair: true

monitoring_hosts:
  grafana: grafana
  dockge: dockge
  prometheus: prometheus
  alertmanager: alertmanager

monitoring_retention:
  metrics_time: 365d
  # Hard ceiling for the Prometheus TSDB. Reached first, oldest data is
  # dropped early - which is the correct failure, rather than a full disk.
  metrics_size: 20GB

  logs_time: 336h        # 14 days
  logs_size_mb: 10240    # 10 GB, enforced by the role's own janitor

  # How often metrics are collected. 15s is the useful floor for catching a
  # brown-out or a thermal spike; anything faster mostly stores noise.
  scrape_interval: 15s
  # The host scripts are shelling out to vcgencmd, nvme-cli and nmcli, so they
  # run on their own slower clock.
  host_collector_interval: 30s

monitoring_alerting:
  ntfy:
    server: https://ntfy.sh
    topic: "{{ vault_ntfy_topic | default('') }}"
    # Only needed for a private or self-hosted instance that requires auth.
    token: "{{ vault_ntfy_token | default('') }}"
    # Seconds. Short, because a captive portal will happily accept a
    # connection and then never answer, and a blocked relay delivers nothing.
    timeout: 10

  priority:
    critical: 5
    warning: 2
    resolved: 2

  # A recovery notice is only worth sending for something that buzzed you.
  # Getting a "resolved" for a warning you never heard about is pure noise.
  send_resolved:
    critical: true
    warning: false
  # OFFLINE BEHAVIOUR
  offline:
    # Hold undelivered alerts and send them when an uplink appears.
    queue: true
    # Lead the flush with "while you were offline: ..." - including alerts
    # that resolved themselves, which are invisible otherwise.
    reconnect_report: true
    # Send at most this many individual notifications per flush; the rest are
    # summarised in one message. ntfy.sh's free tier allows 250 messages a
    # day, and a crash loop that ran for two days offline could otherwise
    # burn the lot in one go.
    max_flush_messages: 15
    # Drop anything older than this instead of delivering it. A week-old
    # warning is history, not news.
    max_age_hours: 72
    # How often to retry a held queue.
    retry_interval_seconds: 60

  muted: []

  watchdog:
    enabled: true
    # Tell me if the Watchdog alert has not arrived for this long.
    stale_after_minutes: 10
    # How often the host-side checker runs.
    host_check_interval: 5min
    # Start a required container that is not running, rather than only
    # reporting it. The report needs an uplink the van often does not have;
    # starting the container does not. Set false to go back to reporting only.
    restart_stopped: true
    # Do not repeat the same "monitoring is broken" message more often
    # than this.
    repeat_hours: 6
    extra_required:
      - "{{ service_proxy.traefik.container_name }}"

monitoring_thresholds:

  # --- Disk ------------------------------------------------------------------
  disk:
    # Percent FREE remaining.
    low_percent: 15
    critical_percent: 5
    for_warning: 30m
    for_critical: 5m
    # The proactive one: shout if the current trend says the filesystem runs
    # out within this many days. A 4 TB disk filling steadily gives you weeks
    # of warning, and this is what turns that into a notification instead of
    # something you notice at 2%.
    predict_full_days: 7
    predict_window: 6h

  # --- Memory ----------------------------------------------------------------
  memory:
    # Percent AVAILABLE remaining.
    low_percent: 10
    critical_percent: 5
    for_warning: 15m
    for_critical: 5m

  # --- CPU and load ----------------------------------------------------------
  cpu:
    # 15-minute load average per core. Sustained 2.0 means everything on the
    # Pi is waiting for everything else.
    load_per_core_warning: 2.0
    for_warning: 20m

  temperature:
    soc_warning: 75
    soc_critical: 82
    for_warning: 10m
    for_critical: 2m
    nvme_warning: 70
    nvme_critical: 80

  power:
    undervoltage_for: 1m
    throttling_for: 5m

    rail_5v_warning: 4.95
    rail_5v_critical: 4.80
    rail_5v_for: 2m

    # How far back to look for unclean shutdowns. The NVMe counter only ever
    # increases, so this is what turns it into "it happened again" rather than
    # "it has ever happened".
    unsafe_shutdown_window: 2h

  # --- NVMe health -----------------------------------------------------------
  #
  # percentage_used is the drive's own wear estimate: 100 means it has used
  # its rated endurance. At 0% today, these are early-warning numbers rather
  # than anything imminent - which is the point of setting them now.
  nvme:
    wear_warning_percent: 80
    wear_critical_percent: 90
    # Any media error, ever, is worth knowing about on a drive holding the
    # only copy of anything.
    media_errors: 0

  # --- Services --------------------------------------------------------------
  #
  # A probe goes through Traefik over HTTPS exactly as a browser would, so it
  # catches the failure container metrics cannot see: a perfectly healthy
  # container behind a router Traefik dropped, which answers 404.
  services:
    # `core` is the half of the van that must work with no internet: playback
    # and the login page. `extra` is everything whose absence is an
    # inconvenience, and it gets a warning rather than a buzz.
    core_for: 5m
    extra_for: 15m
    # Certificates. frey_pki renews at 30 days remaining, so a warning at 14
    # means renewal itself has stopped working.
    cert_expiry_warning_days: 14
    cert_expiry_critical_days: 3

  # --- Containers ------------------------------------------------------------
  containers:
    # A container that restarted this many times in the window is looping,
    # not recovering.
    restarts_in_window: 3
    restart_window: 15m
    stopped_for: 5m
    # Fraction of its own memory limit.
    memory_high_ratio: 0.9
    memory_for: 15m
    # Cores one container may use before it is worth naming. Above 1.0 so a
    # single busy core is not an alert by itself - the Pi has four and can
    # spare one - and 20m rules out the burst an *arr makes on an RSS refresh
    # or an import, leaving only the ones that are stuck.
    cpu_cores_warning: 1.5
    cpu_for: 20m
    # Jellyfin is exempt because saturating its cap is its correct behaviour:
    # the Pi 5 has no hardware encoder, so a software transcode is supposed to
    # use every core it is allowed. An alert that fires on normal operation
    # teaches you to ignore the alert, which costs more than it reports.
    cpu_exempt: ['jellyfin']

  # --- Gateway and network ---------------------------------------------------
  #
  # FreyHub is the critical always-on service, so its alerts are short-fused.
  # The uplink is the opposite: it is expected to come and go, and treating
  # that as a fault would mean a notification every time the van moves.
  gateway:
    ap_down_for: 2m
    dns_failing_for: 3m
    nat_missing_for: 5m
    # Only worth mentioning after half an hour, and it is a warning: no
    # uplink is a normal state in a van. You will usually receive this as
    # part of the reconnect report, which is exactly right - it tells you
    # how long you were actually offline.
    uplink_down_for: 30m
    captive_portal_for: 10m
    # Uplink transitions in an hour before it counts as flapping. A radio
    # that reassociates constantly is worse than one that is simply down.
    flapping_changes: 10
    # Clients are associated to the AP but none of them got a DHCP lease,
    # which means FreyHub looks connected and does nothing.
    dhcp_broken_for: 10m

  # --- Monitoring itself -----------------------------------------------------
  monitoring:
    target_down_for: 10m
    # Alerts have been waiting for an uplink this long. Informational - they
    # are queued, not lost - but it confirms the queue is working.
    queue_backlog_for: 2h
    # Alertmanager could not deliver this many notifications in an hour.
    notification_failures: 3
    logs_stalled_for: 30m
    # frey-log-repair runs every 15 minutes (monitoring.log_repair.interval in
    # the role defaults). Three missed runs rather than one, so a boot or a
    # long NVMe stall does not cry wolf.
    log_repair_stale_seconds: 2700

monitoring_probe_core:
  - jellyfin
  - audiobookshelf
  - auth
  - users
  - grafana

# Extra things to probe that are not services in identity.yml - the gateway
# itself, and anything you reach by address rather than name.
#
#   monitoring_probe_extra_targets:
#     - { name: traefik_https, url: "https://10.20.0.1/", tier: core }
monitoring_probe_extra_targets: []

monitoring_logs:
  # Every container Docker knows about, with its frey.module label attached,
  # so you can filter by module in Grafana rather than by remembering names.
  all_containers: true
  # The system journal: systemd units, the kernel, NetworkManager, dnsmasq.
  # This is where an AP radio reset or a USB Wi-Fi adapter brown-out shows up,
  # so it is the half you actually want when the network misbehaves.
  journal: true
  journal_max_age: 12h

  drop_patterns:
    - '(?i)\blevel=(trace|debug)\b'
    - '(?i)^\s*(TRACE|DEBUG)\b'
    # Traefik logs every single request at INFO if access logs are on; the
    # same information is already in its Prometheus metrics, counted.
    - '"ClientAddr":'
    - 'Error while reading product_name'

monitoring_host_collectors:
  # Shipped with the role. Each is a script in roles/monitoring/templates/
  # that writes one .prom file.
  - pi          # SoC temperature, throttling and under-voltage, PMIC power
  - nvme        # SMART wear, temperature, media errors, bytes written
  - gateway     # uplink state, AP clients, DHCP leases, DNS, NAT
  - docker      # container running state and restart counts
  - indexers    # *arr indexer health - see monitoring_indexer_apps below

monitoring_indexer_apps:
  - {name: prowlarr, port: 9696, api_version: v1}
  - {name: sonarr, port: 8989, api_version: v3}
  - {name: radarr, port: 7878, api_version: v3}
