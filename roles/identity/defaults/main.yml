---
# ==============================================================================
# IDENTITY - LLDAP + AUTHELIA
#
# One directory of people, one login page, two ways for a service to use it.
#
#   LLDAP     the user directory. Tiny LDAP server with a web UI, so adding a
#             person to the van is a form, not a playbook run.
#   AUTHELIA  the login page. OIDC provider for apps that can log in against
#             it themselves, and a forward-auth endpoint Traefik can ask about
#             apps that cannot.
#
# WHAT GOES WHERE
#
#   inventory/group_vars/all/identity.yml   who exists, which groups, and the
#                                           auth mode per service. Edit this.
#   this file                               app-specific OIDC facts: redirect
#                                           URIs, scopes, whether the client is
#                                           public. Edit only when adding a new
#                                           kind of app.
#
# WHY NOT AUTHENTIK, WHICH THE OLD STACK USED
#
# Authentik's only infrastructure-as-code path is blueprints, and blueprints
# are what failed. archive/legacy-stack/roles/infrastructure/tasks/main.yml
# ran to 947 lines, much of it machinery to force blueprints to re-apply -
# including SQL against Authentik's own Postgres to find and delete rows in
# the blueprintinstance table - plus five Django ORM scripts under
# authentik-ensure/ for the things blueprints could not express at all.
# Jellyfin LDAP never worked; see archive/legacy-stack/LDAP_SSO_ISSUES.md.
#
# Authelia's entire state is this one YAML file. There is no API to call, no
# database to reconcile and nothing to re-apply: render the file, validate it,
# restart. LLDAP's users and groups come from JSON files through its own
# idempotent bootstrap script. Both are things --check --diff can show you
# before they happen, which was never true of the old stack.
# ==============================================================================

identity:
  stack_dir: "{{ frey.base_dir }}/stacks/identity"
  appdata_dir: "{{ frey.base_dir }}/appdata/identity"

  # The uid both containers end up running as, and the owner of the secret
  # files. Pinned rather than left to the images' defaults: the secrets are
  # mode 0400, so an image that quietly changed which user it drops to would
  # turn that into an unreadable-secret crash loop.
  #
  # They get there by different routes, which the compose file explains:
  # Authelia is started directly as this uid, while LLDAP must start as root
  # and drop to it itself.
  user:
    name: frey_identity
    uid: 3100
    gid: 3100

  # LLDAP's built-in administrator. Used by the bootstrap script and to get
  # into the directory UI the very first time; after that use your own account,
  # which identity_users puts in the lldap_admin group.
  lldap_admin_user: admin

  # Small on purpose. Neither of these should ever be the reason the Pi is
  # short of memory, and a runaway auth service must not be able to starve
  # Jellyfin or the access point.
  lldap_mem_limit: 256m
  authelia_mem_limit: 512m

  # Private network for the Authelia/LLDAP conversation. LDAP binds carry
  # passwords in cleartext, so that traffic stays on a Docker network of its
  # own rather than crossing the shared proxy network with every other service.
  network:
    name: identity_internal
    subnet: 172.29.0.0/24

  # Set in inventory/group_vars/all/identity.yml, because frey_pki needs these
  # names too and role defaults are only in scope while their own role runs.
  hosts:
    auth: "{{ identity_hosts.auth }}"
    directory: "{{ identity_hosts.directory }}"

  # Full URLs, derived once so nothing else has to remember the scheme. HTTPS
  # is not negotiable: Authelia marks its session cookie Secure, and a cookie
  # set over HTTPS is never sent back over HTTP - a forward-auth service on
  # plain HTTP would redirect to the portal forever.
  urls:
    auth: "https://{{ identity_hosts.auth }}.{{ frey.service_domain }}"
    directory: "https://{{ identity_hosts.directory }}.{{ frey.service_domain }}"

  # Single-label base DN, matching the local domain. LLDAP is happy with one
  # component and it keeps every DN in this file readable.
  base_dn: dc=frey

  ldap:
    # The account Authelia binds with to look users up. A normal LLDAP user in
    # the built-in lldap_strict_readonly group - deliberately NOT the admin
    # account, so a leaked bind password cannot edit the directory.
    #
    # The old stack's equivalent is the one thing that broke it: Authentik
    # service accounts only support token auth, never a password bind, so the
    # LDAP bind failed with "Invalid Credentials" and was never fixed.
    bind_user: authelia
    port: 3890

  web:
    # LLDAP's own UI port, reached through Traefik rather than published.
    port: 17170

  authelia:
    port: 9091
    log_level: info
    theme: dark

    session:
      # Short enough that a forgotten unlocked laptop is not a standing
      # invitation, long enough not to be irritating on a tablet.
      expiration: 12h
      inactivity: 2h
      remember_me: 1M

    # one_factor: username and password only.
    # two_factor: additionally TOTP, WebAuthn or Duo.
    #
    # one_factor is the default because FreyHub is a private WPA2 network in a
    # van, and because a second factor you cannot complete - phone flat, no
    # internet, authenticator app on the device you are locked out of - is a
    # worse failure than the one it prevents. TOTP is still enrollable per
    # person, and flipping a service to two_factor is one word in identity.yml.
    default_policy: one_factor

  # ----------------------------------------------------------------------------
  # OIDC CLIENT CATALOG
  #
  # App-specific facts that are properties of the app, not choices you make:
  # where it wants to be redirected back to, which scopes it needs, whether it
  # can keep a secret. identity.yml decides WHICH of these are switched on and
  # WHO may use them; this decides HOW each one is spoken to.
  #
  # The old stack listed eight to ten redirect URIs per app - http and https,
  # DNS name, two different LAN addresses, mobile scheme - because there was no
  # single stable base URL. There is one now: https://<service>.hub.frey, served
  # by Traefik with the Frey certificate. One URI per real callback, no
  # guessing, and nothing to re-add when an address changes.
  # ----------------------------------------------------------------------------
  oidc_catalog:

    hermes:
      client_name: Hermes Agent
      public: false
      token_endpoint_auth_method: client_secret_basic
      require_pkce: true
      pkce_challenge_method: S256
      scopes: [openid, profile, email, offline_access]
      redirect_uris:
        - "https://hermes.{{ frey.service_domain }}/auth/callback"
      claims_policy: ""

    readmeabook:
      client_name: ReadMeABook
      public: false
      token_endpoint_auth_method: client_secret_basic
      require_pkce: true
      pkce_challenge_method: S256
      scopes: [openid, profile, email, groups, offline_access]
      redirect_uris:
        - "https://readmeabook.{{ frey.service_domain }}/api/auth/oidc/callback"
      claims_policy: frey_groups

    silverbullet:
      client_name: SilverBullet
      public: false
      token_endpoint_auth_method: client_secret_basic
      require_pkce: true
      pkce_challenge_method: S256
      scopes: [openid, profile, email, offline_access]
      redirect_uris:
        - "https://silverbullet.{{ frey.service_domain }}/.auth/central/oidc/callback"
      claims_policy: ""

    dashy:
      client_name: Dashy
      public: true
      token_endpoint_auth_method: none
      require_pkce: true
      pkce_challenge_method: S256
      scopes: [openid, profile, email, groups, offline_access]
      redirect_uris:
        - "https://dashy.{{ frey.service_domain }}"
        - "https://dashy.{{ frey.service_domain }}/"
      claims_policy: frey_groups

    cleanuparr:
      client_name: Cleanuparr
      public: false
      token_endpoint_auth_method: client_secret_post
      # Cleanuparr does send a code challenge -- confirmed from the authorize
      # URL its own /api/auth/oidc/start builds -- so PKCE is required here
      # rather than merely allowed.
      require_pkce: true
      pkce_challenge_method: S256
      scopes: [openid, profile, email, groups, offline_access]
      # Cleanuparr APPENDS /api/auth/oidc/callback to the redirect URL it is
      # configured with, so the registered URI is that full path while
      # Cleanuparr itself is given only the base. Registering the base here
      # instead fails the authorization request with "the 'redirect_uri'
      # parameter does not match any of the OAuth 2.0 Client's pre-registered
      # 'redirect_uris'" -- which Authelia reports, so look there and not in
      # Cleanuparr's log.
      redirect_uris:
        - "https://cleanuparr.{{ frey.service_domain }}/api/auth/oidc/callback"

    audiobookshelf:
      client_name: Audiobookshelf
      public: false
      token_endpoint_auth_method: client_secret_basic
      require_pkce: true
      pkce_challenge_method: S256
      scopes:
        - openid
        - profile
        - email
        - groups
        # Authelia warns, and will later refuse, if a client is granted the
        # refresh_token grant without offline_access being an allowed scope.
        # Allowed, not required - the app asks for what it wants.
        - offline_access
      redirect_uris:
        - "https://audiobookshelf.{{ frey.service_domain }}/auth/openid/callback"
        - "https://audiobookshelf.{{ frey.service_domain }}/auth/openid/mobile-redirect"
        # The same two under /audiobookshelf, because that is Audiobookshelf's
        # OWN base path: 2.37.2 defaults ROUTER_BASE_PATH to `/audiobookshelf`
        # when the variable is unset - see `?? '/audiobookshelf'` in its
        # /app/index.js - and it logs `Serving from base path
        # "/audiobookshelf"` on every start. The app still answers at the root
        # only because its Express layer rewrites any request that does not
        # already start with that prefix.
        #
        # So which of these two it asks Authelia to redirect back to depends on
        # a setting of its own (redirect_url_subfolder below) and on an upstream
        # default that could move. Registering both costs nothing - a redirect
        # URI is only ever permitted, never forced - and removes the failure
        # where Authelia rejects the sign-in with invalid_request and the
        # explanation is in ITS log rather than Audiobookshelf's.
        - "https://audiobookshelf.{{ frey.service_domain }}/audiobookshelf/auth/openid/callback"
        - "https://audiobookshelf.{{ frey.service_domain }}/audiobookshelf/auth/openid/mobile-redirect"
        # The mobile app's own scheme. Not a URL Traefik ever sees - the phone
        # intercepts it - but Authelia still has to be told to allow it.
        - "audiobookshelf://oauth"
      # Audiobookshelf reads group membership from the userinfo endpoint, the
      # way the spec intends, so it needs no claims policy.
      claims_policy: ""

    jellyfin:
      client_name: Jellyfin
      # A PUBLIC client, with no secret. That is the jellyfin-sso plugin's
      # requirement, not a shortcut: the plugin cannot hold a client secret, so
      # it uses PKCE instead. Authelia refuses plain-HTTP redirect URIs for
      # public clients, which is why frey_pki is a hard dependency here.
      public: true
      token_endpoint_auth_method: none
      require_pkce: true
      pkce_challenge_method: S256
      scopes:
        - openid
        - profile
        - email
        - groups
        - offline_access
      redirect_uris:
        # The trailing element is the plugin provider's <Id>, NOT its <Name>.
        #
        # This comment used to say "name", and that was wrong: it cost a
        # debugging session chasing Authelia when the fault was in Jellyfin.
        # In the be-nj fork the callback path is built from <Id>, which is
        # auto-generated on create (e.g. xmk42t0g3umvq2c4vi) and is NOT exposed
        # anywhere in the plugin UI. <Name> is a display label and nothing else.
        #
        # So the provider's <Id> has to literally be `authelia`, which means
        # editing the plugin's XML by hand - see identity.jellyfin.sso_plugin
        # below and docs/IDENTITY.md. Recreating the provider through the UI
        # regenerates a random Id and breaks SSO again, with Authelia showing
        # invalid_request / "redirect_uri does not match".
        - "https://jellyfin.{{ frey.service_domain }}/sso/oidc/callback/authelia"
      # Empty on purpose: groups stay out of the ID token, so the plugin must
      # fetch them from userinfo (<GroupsFromUserInfo>true</GroupsFromUserInfo>).
      claims_policy: ""

    # ------------------------------------------------------------------------
    # Not deployed yet, but declared so that the day the module lands, SSO is
    # already waiting for it. A client nobody uses costs nothing.
    # ------------------------------------------------------------------------
    immich:
      client_name: Immich
      public: false
      token_endpoint_auth_method: client_secret_post
      require_pkce: true
      pkce_challenge_method: S256
      scopes:
        - openid
        - profile
        - email
      redirect_uris:
        - "https://immich.{{ frey.service_domain }}/auth/login"
        - "https://immich.{{ frey.service_domain }}/user-settings"
        - "app.immich:///oauth-callback"
      claims_policy: ""

    grafana:
      client_name: Grafana
      public: false
      token_endpoint_auth_method: client_secret_basic
      require_pkce: true
      pkce_challenge_method: S256
      scopes:
        - openid
        - profile
        - email
        - groups
      redirect_uris:
        - "https://grafana.{{ frey.service_domain }}/login/generic_oauth"
      # Grafana wants groups in the ID token rather than fetching them from
      # userinfo, which the spec does not require a provider to do. Authelia's
      # escape hatch for exactly this is a claims policy.
      claims_policy: frey_groups

    mealie:
      client_name: Mealie
      public: false
      token_endpoint_auth_method: client_secret_basic
      require_pkce: true
      pkce_challenge_method: S256
      scopes:
        - openid
        - profile
        - email
        - groups
      redirect_uris:
        - "https://mealie.{{ frey.service_domain }}/login"
      claims_policy: frey_groups

    # Hermes Agent's dashboard. Every value below was read out of the image's
    # own source (plugins/dashboard_auth/self_hosted/__init__.py and
    # plugins/dashboard_auth/_shared.py), not from its documentation, because
    # a wrong redirect_uri is rejected by Authelia rather than by the app and
    # therefore shows up in the wrong log.
    #
    #   - the redirect path MUST end in /auth/callback: validate_redirect_uri()
    #     fast-fails anything else before the browser is ever bounced.
    #   - PKCE S256 is unconditional, and a client_secret is layered on top of
    #     it rather than replacing it, so this is a confidential client that
    #     still sends a code challenge - require_pkce, not merely allow.
    #   - _token_endpoint_auth() sends the secret as HTTP Basic unless the IDP
    #     advertises client_secret_post WITHOUT client_secret_basic. Authelia
    #     advertises both, so Basic is what will actually be used.
    #   - scopes are the plugin's own _DEFAULT_SCOPES. No `groups`: Hermes
    #     verifies the ID token and reads identity from it, and access control
    #     is the `groups` list in identity_services, enforced by Authelia
    #     before it ever issues a token. A groups claim here would buy nothing
    #     and claims_policy is left empty for the same reason.
    hermes:
      client_name: Hermes Agent
      public: false
      token_endpoint_auth_method: client_secret_basic
      require_pkce: true
      pkce_challenge_method: S256
      # offline_access is here because the client template grants
      # `refresh_token`, and Authelia warns that the two must agree:
      # "option 'grant_types' should only have the 'refresh_token' value if
      # the client is also configured with the 'offline_access' scope" -
      # a deprecation that it says will become an error. The Hermes plugin
      # does refresh (plugins/dashboard_auth/_shared.refresh_token_from), so
      # granting it is correct rather than merely quiet.
      scopes:
        - openid
        - profile
        - email
        - offline_access
      redirect_uris:
        - "https://hermes.{{ frey.service_domain }}/auth/callback"
      claims_policy: ""

  # ----------------------------------------------------------------------------
  # JELLYFIN SSO PLUGIN
  #
  # Jellyfin has no built-in OIDC, so single sign-on there means a community
  # plugin. Read roles/identity/README.md before relying on this: the plugin is
  # tested against Jellyfin 12.0-12.2 and this deployment runs 12.3, so it is
  # outside its tested range. Jellyfin's own local accounts keep working
  # either way, which is the fallback if the plugin misbehaves.
  # ----------------------------------------------------------------------------
  jellyfin:
    # The plugin's own configuration file, which has to be edited by hand -
    # the UI does not expose the fields that matter. Written out here so the
    # run can print the exact path instead of making you hunt for it.
    xml_path: >-
      {{ media.appdata_dir }}/jellyfin/data/plugins/configurations/Jellyfin.Plugin.Sso.xml

    sso_plugin:
      enabled: true
      # Added to Jellyfin's plugin catalogue so the plugin can be installed
      # from the UI. Installing it is a manual step on purpose - a plugin DLL
      # downloaded and dropped in by Ansible has no ABI check and bricks the
      # server if it mismatches.
      repository_name: jellyfin-sso
      repository_url: https://raw.githubusercontent.com/be-nj/jellyfin-sso/main/manifest.json

      # The provider's <Id> in the plugin's XML - the last path element of the
      # redirect URI above, and the thing Authelia matches on.
      #
      # Named provider_id, not provider_name, because that distinction is the
      # whole trap: the plugin UI only lets you set <Name>, while the callback
      # path is built from <Id>. The Id must be set by editing
      #   /opt/frey/appdata/jellyfin/data/plugins/configurations/\
      #     Jellyfin.Plugin.Sso.xml
      # and restarting Jellyfin. See docs/IDENTITY.md for the whole procedure.
      provider_id: authelia

      # Jellyfin group that maps to administrator. Members of this LDAP group
      # get Jellyfin admin on login.
      #
      # Applied through the plugin's <GroupMappings>, which it re-applies on
      # EVERY login - and it ships <PreserveAdminPermissions>false</...>, so
      # permissions edited by hand on Jellyfin's user screen are wiped the next
      # time that person signs in. Change the mapping, never the user.
      admin_group: frey_admins

  # ----------------------------------------------------------------------------
  # AUDIOBOOKSHELF SSO
  #
  # Unlike Jellyfin, this one is automatic.
  #
  # This repository used to say Audiobookshelf had "no API and no environment
  # variable" for OIDC, and that it therefore had to be clicked through by hand
  # after every rebuild. That stopped being true: it has an admin endpoint,
  # PATCH /api/auth-settings, and it is the good kind - it compares each key
  # against what is stored and answers {"updated": false} when nothing changed,
  # so a second run reports no change without Ansible having to guess.
  #
  # What it needs that nothing else here does is the password of
  # Audiobookshelf's OWN root account: that endpoint authenticates as that
  # account, and there is no deploy-time token to use instead. The account is
  # created by hand in a browser on first run, so Ansible cannot know its
  # password unless it is told. Put it in the vault:
  #
  #   ansible-vault edit inventory/group_vars/all/secrets.yml
  #
  #   vault_identity_secrets:
  #     audiobookshelf_admin_password: <the root account's password>
  #
  # Without it nothing fails: the values are printed for pasting into
  # Settings -> Authentication, which is what used to happen on every run.
  audiobookshelf:
    configure: true

    # Audiobookshelf's root account - its own local account, not an LLDAP user.
    # media_admin is what this van's install was built with, the same name
    # Jellyfin's administrator uses, and not the `frey` that role defaults
    # elsewhere still suggest.
    admin_user: media_admin

    # Where the password is looked for in the persisted identity secrets, and
    # therefore the key to set in vault_identity_secrets.
    admin_password_key: audiobookshelf_admin_password

    # Shown on the login page, beside the local username and password form.
    button_text: Sign in with Frey

    # Skip the local form and go straight to Authelia: OFF, deliberately.
    # Audiobookshelf's own login is the way back in when SSO is not working,
    # and in a van "not working" includes "Authelia is restarting". The bypass
    # exists - ?autoLaunch=0 - but it is not a thing to have to remember while
    # parked off-grid.
    auto_launch: false

    # Create an Audiobookshelf account on first SSO sign-in. Effectively
    # required: with this off, the first sign-in by someone who has no
    # Audiobookshelf account yet fails, and there is nothing they can do about
    # it from the browser.
    auto_register: true

    # Attach an SSO login to an existing account with the same email rather
    # than making a second one. Emails are @frey identifiers from
    # identity_users, so this matches only accounts deliberately given the same
    # address. `username` or null are the other choices.
    match_existing_by: email

    # ROLES FROM FREY'S OWN GROUPS.
    #
    # Audiobookshelf understands exactly three roles - admin, user, guest - and
    # nothing else. It does not map group names onto them: it looks for those
    # literal strings in the claim and, finding none, raises `No valid group
    # found in userinfo` and DENIES the login outright. So pointing it straight
    # at Frey's groups (frey_admins, media, notes, guests - and `guests` is not
    # `guest`) would refuse every sign-in, including those of the admins it
    # looked like it was about to promote.
    #
    # Authelia does the translating instead. A CEL attribute turns group
    # membership into the literal role Audiobookshelf expects, and the
    # audiobookshelf client serves it as the claim named below. Audiobookshelf
    # reads that claim, sees ["admin"], and LLDAP still only ever knows
    # frey_admins. One vocabulary in the directory, no ABS-shaped groups to
    # maintain beside it.
    #
    # Turning this off puts roles back on Audiobookshelf's own Users screen and
    # stops it asking for the claim at all - the task derives the claim name
    # from this switch, so the two sides cannot drift apart.
    map_groups: true

    # The claim carrying the translated role, and - because Audiobookshelf
    # appends the claim name to the scope it requests - also the name of a
    # custom scope Authelia is given for it.
    #
    # NOT `groups`, and that is the whole lesson of this feature. A custom
    # claim named `groups` passes `authelia validate-config` and is then
    # silently ignored: `authelia debug oidc claims <user>` shows the hydrated
    # claim still holding the raw directory list. Pointing Audiobookshelf at
    # that would have denied every sign-in, because the real list holds
    # `guests` and `frey_admins` and Audiobookshelf wants `guest` and `admin`.
    # Standard claims cannot be overridden by a claims policy.
    role_claim: abs_role

    # Priority order, highest first: the first entry whose groups the person is
    # in decides their role. Membership of several is not a conflict.
    role_map:
      - role: admin
        groups: [frey_admins]
      - role: user
        groups: [media]

    # Everyone in none of the above. This is not decoration - it is what makes
    # the feature safe. Audiobookshelf denies a login whose claim carries no
    # role it recognises, so an unmatched person has to come out as SOMETHING.
    #
    # It is a safety net rather than a role anybody actually gets: the client's
    # authorization policy is default deny and admits only the groups listed
    # against audiobookshelf in identity.yml, so Authelia turns away anyone
    # unmatched before Audiobookshelf ever sees them. Which is just as well -
    # do NOT read `guest` as "restricted". In 2.37.2
    # getDefaultPermissionsForUserType gives `guest` and `user` IDENTICAL
    # defaults (download, accessAllLibraries and accessAllTags all true; update,
    # delete, upload and explicit content all false). The difference is the
    # label, not the rights. Who may get in is decided by that authorization
    # policy, never by this fallback.
    #
    # One edge: if a directory account's email matches Audiobookshelf's local
    # root user (see match_existing_by above), a non-admin role is refused with
    # "Root user cannot be downgraded". Keep the root account's address off the
    # directory and that cannot arise.
    role_fallback: guest

    advanced_perms_claim: ""

    # The mobile app's custom scheme, which must match the URI registered for
    # the client in oidc_catalog above. Audiobookshelf already defaults to this
    # value; it is set explicitly so a rebuild cannot inherit something else.
    mobile_redirect_uris:
      - "audiobookshelf://oauth"

    # RS256: what Authelia signs with, and Audiobookshelf's own default. One of
    # the eight values isOpenIDAuthSettingsValid demands, so it is spelled out
    # rather than left to a default - see the note in tasks/audiobookshelf.yml
    # about what Audiobookshelf does when one of the eight is missing.
    token_signing_algorithm: RS256

    # Authelia advertises no end_session_endpoint, so there is no logout URL to
    # hand over. Empty rather than guessed: a wrong one sends people to a 404
    # at the exact moment they are trying to sign out.
    logout_url: ""

    # EMPTY STRING, AND IT MUST ACTUALLY BE SENT AS ONE.
    #
    # Empty is right even though Audiobookshelf's own base path is NOT empty:
    # 2.37.2 defaults ROUTER_BASE_PATH to `/audiobookshelf` and logs `Serving
    # from base path "/audiobookshelf"` at every start. It answers at the root
    # regardless, because its Express layer prefixes any request that arrives
    # without that path - which is also what makes the unprefixed callback
    # below work. Both forms are registered with Authelia either way, so
    # changing this to "/audiobookshelf" is safe if that rewrite ever goes.
    #
    # The reason this is here rather than just left out: Audiobookshelf builds
    # the callback by string interpolation,
    #
    #   `${authOpenIDSubfolderForRedirectURLs}/auth/openid/callback`
    #
    # over a value that defaults to undefined and is stored verbatim. Never
    # setting it therefore does not yield /auth/openid/callback - it yields
    # the literal /undefined/auth/openid/callback, which Authelia rejects as
    # an unregistered redirect_uri, in ITS log, while Audiobookshelf looks
    # perfectly configured. Its own web UI always submits a value, so this is
    # a trap only for configuration written over the API.
    #
    # Its handler special-cases this one key so that an empty string stays an
    # empty string instead of being normalised to null - null would interpolate
    # just as badly as undefined. See getStrategy in
    # server/auth/OidcAuthStrategy.js.
    redirect_url_subfolder: ""

    # Audiobookshelf answers through Traefik, and identity runs BEFORE
    # media_library on a first deploy - so on a fresh Pi it is not there yet.
    # These are deliberately short: wait briefly, then leave the manual values
    # printed rather than holding the whole run up. The next deploy, or
    # `--tags identity` once media is up, configures it.
    api_timeout: 10
    api_retries: 3
    api_delay: 5

  # Generated once on the Pi, then reused. Nothing here is ever printed, and
  # none of it is in the vault: a secret that only has to be the same tomorrow
  # as it was today does not need to be in version control.
  secret_keys:
    - lldap_admin_password
    - lldap_jwt_secret
    - lldap_key_seed
    - authelia_ldap_password
    - authelia_session_secret
    - authelia_storage_encryption_key
    - authelia_oidc_hmac_secret
    - authelia_reset_jwt_secret

  configure:
    key_file: "{{ frey.base_dir }}/appdata/identity/.identity-keys.json"
    # Users whose initial password Ansible has already handed over. Listed here
    # so the next run does NOT reset a password the person has since changed.
    created_file: "{{ frey.base_dir }}/appdata/identity/.identity-users.json"
    # A cold first start on a Pi takes longer than feels reasonable: Authelia
    # builds its database and LLDAP generates key material.
    health_retries: 30
    health_delay: 5
