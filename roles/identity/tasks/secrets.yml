---
# ==============================================================================
# SECRETS
#
# Generated on the Pi on first run, persisted, and reused forever after. Same
# read-merge-write pattern the media modules use, and the same reasoning: a
# secret that only has to be the same tomorrow as it was today does not belong
# in version control, and nothing is gained by making you invent it.
#
# This is a deliberate correction of the old stack, whose setup guide opened
# with "Generate All Secrets" and eight openssl commands you had to run and
# paste into the vault BEFORE the first deploy - every one of them a chance to
# paste the wrong value into the wrong key and get an opaque failure later.
#
# vault_identity_secrets always wins, so anything you do want to pin can be.
# ==============================================================================

- name: Check for the persisted identity secret file
  ansible.builtin.stat:
    path: "{{ identity.configure.key_file }}"
  register: identity_key_stat
  tags: [identity, sso, identity_config]

- name: Read persisted identity secrets
  ansible.builtin.slurp:
    src: "{{ identity.configure.key_file }}"
  register: identity_key_blob
  when: identity_key_stat.stat.exists
  no_log: true
  tags: [identity, sso, identity_config]

- name: Load persisted identity secrets
  ansible.builtin.set_fact:
    identity_secrets: >-
      {{
        (identity_key_blob.content | b64decode | from_json)
        if identity_key_stat.stat.exists
        else {}
      }}
  no_log: true
  tags: [identity, sso, identity_config]

- name: Generate any missing infrastructure secrets
  ansible.builtin.set_fact:
    identity_secrets: >-
      {{
        identity_secrets
        | combine({
            item: identity_secrets[item]
                  | default(lookup('password', '/dev/null',
                                   chars=['ascii_letters', 'digits'],
                                   length=48))
          })
      }}
  loop: "{{ identity.secret_keys }}"
  no_log: true
  tags: [identity, sso, identity_config]

# ------------------------------------------------------------------------------
# OIDC CLIENT SECRETS
#
# Two values per confidential client, and the distinction matters:
#   <client>_oidc_secret       the plaintext, which the APP is configured with
#   <client>_oidc_secret_hash  a PBKDF2-SHA512 digest, which AUTHELIA stores
#
# Authelia never holds the plaintext, so the readable config carries only the
# hash. The run prints the plaintext for any app you still have to configure
# by hand.
# ------------------------------------------------------------------------------
- name: Identify the confidential OIDC clients
  ansible.builtin.set_fact:
    identity_confidential_clients: >-
      {{
        identity_services | dict2items
        | selectattr('value.auth', 'equalto', 'oidc')
        | map(attribute='key')
        | reject('in', identity_public_clients)
        | list
      }}
  vars:
    identity_public_clients: >-
      {{
        identity.oidc_catalog | dict2items
        | selectattr('value.public', 'equalto', true)
        | map(attribute='key')
        | list
      }}
  tags: [identity, sso, identity_config]

- name: Generate any missing OIDC client secrets
  ansible.builtin.set_fact:
    identity_secrets: >-
      {{
        identity_secrets
        | combine({
            item ~ '_oidc_secret': identity_secrets[item ~ '_oidc_secret']
                  | default(lookup('password', '/dev/null',
                                   chars=['ascii_letters', 'digits'],
                                   length=48))
          })
      }}
  loop: "{{ identity_confidential_clients }}"
  no_log: true
  tags: [identity, sso, identity_config]

# ------------------------------------------------------------------------------
# STARTING PASSWORDS
#
# One per person, generated once. Shorter and alphanumeric because unlike the
# secrets above, a human has to read this off a screen and type it into a
# phone. It is a starting password: everyone is expected to change it in the
# directory UI, after which Ansible stops managing it.
# ------------------------------------------------------------------------------
- name: Generate any missing starting passwords
  ansible.builtin.set_fact:
    identity_secrets: >-
      {{
        identity_secrets
        | combine({
            'user_' ~ item.username ~ '_password':
              identity_secrets['user_' ~ item.username ~ '_password']
              | default(lookup('password', '/dev/null',
                               chars=['ascii_letters', 'digits'],
                               length=16))
          })
      }}
  loop: "{{ identity_users }}"
  loop_control:
    label: "{{ item.username }}"
  no_log: true
  tags: [identity, sso, identity_config]

- name: Apply vault overrides over generated identity secrets
  ansible.builtin.set_fact:
    identity_secrets: "{{ identity_secrets | combine(vault_identity_secrets | default({}, true)) }}"
  no_log: true
  tags: [identity, sso, identity_config]

# ------------------------------------------------------------------------------
# HASHING
#
# Done by the Authelia binary itself rather than reimplemented here. The digest
# format carries its own parameters - variant, iterations, salt - and Authelia
# is the only authority on what it will accept. Hand-rolling PBKDF2 to match
# would be a silent-failure generator.
#
# Only computed for a client whose hash is missing, so a normal run does no
# work and reports no change.
# ------------------------------------------------------------------------------
- name: Start with no clients needing a hash
  ansible.builtin.set_fact:
    identity_unhashed_clients: []
  tags: [identity, sso, identity_config]

- name: Find OIDC clients still needing a secret hash
  ansible.builtin.set_fact:
    identity_unhashed_clients: "{{ identity_unhashed_clients + [item] }}"
  loop: "{{ identity_confidential_clients }}"
  loop_control:
    label: "{{ item }}"
  # `default('', true)` also replaces a stored null, which matters: testing the
  # key's mere presence is not enough. A failed parse once stored a null here,
  # which then looked "already hashed" forever and rendered an empty
  # client_secret into the configuration - a silent, total SSO failure for that
  # app. Anything that is not a real digest is retried.
  when: >-
    not (identity_secrets[item ~ '_oidc_secret_hash'] | default('', true))
        is string
    or not (identity_secrets[item ~ '_oidc_secret_hash'] | default('', true))
           .startswith('$pbkdf2-sha512$')
  tags: [identity, sso, identity_config]

- name: Pull the Authelia image so its hashing tool is available
  community.docker.docker_image:
    name: "authelia/authelia:{{ identity_versions.authelia }}"
    source: pull
    state: present
  when:
    - identity_unhashed_clients | length > 0
    - not ansible_check_mode
  tags: [identity, sso, identity_config]

- name: Hash the OIDC client secrets
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "authelia/authelia:{{ identity_versions.authelia }}"
      - authelia
      - crypto
      - hash
      - generate
      - pbkdf2
      - --variant
      - sha512
      - --password
      - "{{ identity_secrets[item ~ '_oidc_secret'] }}"
  register: identity_hash_out
  loop: "{{ identity_unhashed_clients }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true
  when: not ansible_check_mode
  no_log: true
  tags: [identity, sso, identity_config]

# The command prints exactly one line: "Digest: $pbkdf2-sha512$310000$...".
# Taking the last whitespace-separated field is deliberate rather than clever -
# an earlier version used a regex here, it quietly matched nothing, and the
# resulting null sailed all the way into the rendered configuration as an empty
# client secret. The assertion below is there so that can never repeat silently.
- name: Record the OIDC client secret hashes
  ansible.builtin.set_fact:
    identity_secrets: >-
      {{
        identity_secrets
        | combine({
            item.item ~ '_oidc_secret_hash':
              (item.stdout | trim).split(' ') | last
          })
      }}
  loop: "{{ identity_hash_out.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - identity_hash_out is defined
    - not (item.skipped | default(false))
  no_log: true
  tags: [identity, sso, identity_config]

- name: Verify every OIDC client ended up with a usable secret hash
  ansible.builtin.assert:
    that:
      - identity_secrets[item ~ '_oidc_secret_hash'] | default('', true) is string
      - identity_secrets[item ~ '_oidc_secret_hash'].startswith('$pbkdf2-sha512$')
    fail_msg: >-
      Could not read a PBKDF2 digest out of `authelia crypto hash generate`
      for the '{{ item }}' client. Its output format has probably changed in
      Authelia {{ identity_versions.authelia }}. Run it by hand to see:
      docker run --rm authelia/authelia:{{ identity_versions.authelia }}
      authelia crypto hash generate pbkdf2 --variant sha512 --password test
  loop: "{{ identity_confidential_clients }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode
  tags: [identity, sso, identity_config]

- name: Persist identity secrets
  ansible.builtin.copy:
    content: "{{ identity_secrets | to_nice_json }}\n"
    dest: "{{ identity.configure.key_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [identity, sso, identity_config]
