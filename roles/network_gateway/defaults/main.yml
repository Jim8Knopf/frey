---
# Frey gateway module.
#
# Radio assignment is deliberately two variables. Swapping the two
# `interface:` lines swaps which radio hosts FreyHub and which reaches
# for public Wi-Fi. Nothing else in the role hardcodes a radio.
#
#   downstream.interface -> FreyHub AP   (must be the MOST reliable radio)
#   upstream.interface   -> public Wi-Fi (the expendable one)

network_gateway:

  # ---------------------------------------------------------------
  # Upstream: opportunistic public Wi-Fi. Absent by design much of
  # the time. Nothing below the Pi depends on it being up.
  # ---------------------------------------------------------------
  upstream:
    enabled: true
    interface: wlan1
    connection_prefix: frey-uplink
    route_metric: 100
    country: NZ
    powersave: false
    # Known networks, tried by NetworkManager whichever is in range.
    # Declared in group_vars/all/secrets.yml so a rebuild reproduces them.
    networks: []

    # -------------------------------------------------------------
    # Opportunistic open Wi-Fi.
    #
    # NetworkManager only auto-connects to networks it already has a
    # profile for, so `networks` above can only ever cover SSIDs known
    # in advance. A van meets a new open SSID at every campground, cafe
    # and car park, and joining one by hand needs the uplink that is
    # down. This scans for open networks and joins the strongest.
    #
    # Declared networks always win: these profiles get a lower
    # autoconnect-priority and are only created while the uplink is down.
    # -------------------------------------------------------------
    autojoin_open:
      enabled: true
      # Separate prefix on purpose. The prune step deletes any
      # `connection_prefix`-* profile that is not in `networks`, which
      # would wipe these on every run if they shared the prefix.
      profile_prefix: frey-open
      # Must stay below the lowest priority in `networks` so a known
      # network is always preferred when both are in range.
      autoconnect_priority: 1
      interval_seconds: 120
      boot_delay_seconds: 45
      # Time for the radio to finish reporting results after a rescan.
      scan_settle_seconds: 8
      timeout_seconds: 120
      # nmcli SIGNAL is 0-100, not dBm. Below ~35 an association tends to
      # succeed and then carry no usable traffic, which is worse than
      # staying down because it looks connected.
      min_signal: 35
      # How long a network that refused us is skipped, so one broken but
      # strong AP cannot keep winning on signal and pinning the uplink down.
      failure_backoff_seconds: 1800
      # Cap on remembered open profiles; oldest-used are pruned first.
      max_profiles: 20
      # SSIDs never to join. FreyHub's own SSID is always excluded.
      # Worth listing: pay-walled chains, and anything that associates
      # happily but never routes.
      ssid_denylist: []
      state_dir: /var/lib/frey/uplink-autojoin

  # ---------------------------------------------------------------
  # Downstream: FreyHub. This is the critical always-on service.
  # It must come up and stay up with no upstream of any kind.
  # ---------------------------------------------------------------
  downstream:
    enabled: true
    mode: ap
    interface: wlan0
    connection_name: frey-hub-ap
    address: 10.20.0.1
    prefix: 24
    netmask: 255.255.255.0
    network_cidr: 10.20.0.0/24
    route_metric: 500
    dhcp_range_start: 10.20.0.50
    dhcp_range_end: 10.20.0.150
    dhcp_lease_time: 12h
    domain: frey
    ap:
      ssid: FreyHub
      password: ""
      country: NZ
      # band bg = 2.4 GHz (better range through a van body, widest client
      # support). band a = 5 GHz (faster for media). Channel must stay
      # non-DFS so the AP can never go silent for a radar check.
      band: bg
      channel: 6
      hidden: false
      # AP radios must not sleep.
      powersave: false

  dns:
    # Captive portals intercept DNS and answer with private addresses.
    # Rebind protection throws those answers away and the sign-in page
    # never appears, so it is off by default.
    stop_dns_rebind: false
    # Empty on purpose: follow the upstream network's own resolvers so
    # portal interception works. Hardcoding public resolvers here breaks
    # sign-in pages. With no uplink, *.frey still resolves locally.
    upstream_servers: []
    resolv_file: /run/NetworkManager/no-stub-resolv.conf
    cache_size: 1000

  nat:
    enabled: true

  network_manager:
    disable_dhcpcd: true
    # Netplan renders its own NetworkManager profiles. Left in place they
    # compete with ours for the same radios on every boot.
    take_over_netplan: true
    netplan_backup_dir: /var/lib/frey/netplan-disabled

  safety:
    # Guard against reconfiguring the radio carrying the live SSH session.
    allow_reconfigure_control_interface: false
    rollback:
      # Deadman switch: arms before the AP cutover and reverts the Pi to
      # its previous network config unless the run explicitly commits.
      # This is the only way back in on a box with no Ethernet and no console.
      enabled: true
      timeout_seconds: 600
      state_dir: /var/lib/frey/rollback

  packages:
    - dnsmasq
    - iptables
    - network-manager
    - rfkill
    - wireless-regdb
    - iw
