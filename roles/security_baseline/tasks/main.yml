---
- name: Validate security baseline configuration
  ansible.builtin.assert:
    that:
      - security_baseline.firewall.downstream_interface | length > 0
      - security_baseline.firewall.upstream_interface | length > 0
    fail_msg: "security_baseline requires upstream and downstream interface names."
  tags:
    - security

- name: Resolve the trusted-source whitelist
  ansible.builtin.include_tasks: trusted_sources.yml
  tags:
    - security

- name: Install security packages
  ansible.builtin.apt:
    name: "{{ security_baseline.packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - security

- name: Apply kernel network hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    # See frey.sysctl_file in inventory/group_vars/all/main.yml: the module's
    # /etc/sysctl.conf default is not read at boot on Debian 13, so this
    # hardening was reverting to kernel defaults on every reboot. rp_filter
    # was measured at 0 rather than the 2 set here.
    sysctl_file: "{{ frey.sysctl_file }}"
  loop: "{{ security_baseline.sysctl | dict2items }}"
  tags:
    - security

# ---------------------------------------------------------------------------
# SSH ACCESS POLICY
#
# This is the one task in the repo that can make the Pi unreachable, so it
# never trusts its own output: the rendered config is validated with
# `sshd -t` against the FULL configuration, and on any error the previous
# file is put back and the play fails WITHOUT notifying the reload handler -
# so the running daemon keeps the config it already had and the live session
# survives.
# ---------------------------------------------------------------------------
- name: Configure SSH access policy and the trusted-device whitelist
  when: security_baseline.ssh.manage_config | bool
  tags:
    - security
    - ssh
  block:
    - name: Remove superseded SSH drop-ins
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ security_baseline.ssh.legacy_config_files | default([]) }}"
      notify: Reload sshd

    - name: Deploy SSH access policy
      ansible.builtin.template:
        src: sshd-frey-access.conf.j2
        dest: "{{ security_baseline.ssh.config_file }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: security_baseline_sshd_config
      notify: Reload sshd

    - name: Verify the full sshd configuration still parses
      ansible.builtin.command:
        cmd: /usr/sbin/sshd -t
      changed_when: false

  rescue:
    - name: Restore the previous SSH access policy
      ansible.builtin.copy:
        src: "{{ security_baseline_sshd_config.backup_file }}"
        dest: "{{ security_baseline.ssh.config_file }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: security_baseline_sshd_config.backup_file is defined

    # No backup means there was nothing there before, so the rejected file is
    # the only thing to undo. Guarded on `changed` so a Jinja error - which
    # leaves the destination untouched - cannot delete a working config.
    - name: Remove the rejected SSH access policy
      ansible.builtin.file:
        path: "{{ security_baseline.ssh.config_file }}"
        state: absent
      when:
        - security_baseline_sshd_config is defined
        - security_baseline_sshd_config.changed | default(false) | bool
        - security_baseline_sshd_config.backup_file is not defined

    - name: Fail on a rejected SSH configuration
      ansible.builtin.fail:
        msg: >-
          sshd rejected {{ security_baseline.ssh.config_file }}. The previous
          configuration has been restored and sshd was NOT reloaded, so the
          running daemon and this SSH session are unaffected. Fix
          roles/security_baseline/templates/sshd-frey-access.conf.j2 and
          re-run. Most likely cause: an entry in the trusted list carries a
          mask with host bits set (10.20.0.1/24 is invalid, 10.20.0.0/24 is
          not).

- name: Configure fail2ban SSH jail
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/frey-sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  when: security_baseline.fail2ban.enabled | bool
  tags:
    - security

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when:
    - security_baseline.fail2ban.enabled | bool
    - not ansible_check_mode
  tags:
    - security

- name: Determine SSH control source
  ansible.builtin.set_fact:
    security_baseline_control_source: "{{ ansible_facts.env.SSH_CLIENT.split()[0] if ansible_facts.env.SSH_CLIENT is defined else 'any' }}"
  tags:
    - security

- name: Set UFW default incoming policy
  ansible.builtin.command:
    cmd: ufw default deny incoming
  register: security_baseline_ufw_default_in
  changed_when: "'Default incoming policy changed' in security_baseline_ufw_default_in.stdout"
  when: security_baseline.firewall.enabled | bool
  tags:
    - security

- name: Set UFW default outgoing policy
  ansible.builtin.command:
    cmd: ufw default allow outgoing
  register: security_baseline_ufw_default_out
  changed_when: "'Default outgoing policy changed' in security_baseline_ufw_default_out.stdout"
  when: security_baseline.firewall.enabled | bool
  tags:
    - security

- name: Set UFW default routed policy
  ansible.builtin.command:
    cmd: ufw default deny routed
  register: security_baseline_ufw_default_routed
  changed_when: "'Default routed policy changed' in security_baseline_ufw_default_routed.stdout"
  when: security_baseline.firewall.enabled | bool
  tags:
    - security

- name: Allow downstream TCP services
  ansible.builtin.command:
    cmd: "ufw allow in on {{ security_baseline.firewall.downstream_interface }} proto tcp to any port {{ item }} comment 'Frey downstream TCP {{ item }}'"
  loop: "{{ security_baseline.firewall.downstream_tcp_ports }}"
  register: security_baseline_ufw_downstream_tcp
  changed_when: "'Rule added' in security_baseline_ufw_downstream_tcp.stdout"
  when: security_baseline.firewall.enabled | bool
  tags:
    - security

- name: Allow downstream UDP services
  ansible.builtin.command:
    cmd: "ufw allow in on {{ security_baseline.firewall.downstream_interface }} proto udp to any port {{ item }} comment 'Frey downstream UDP {{ item }}'"
  loop: "{{ security_baseline.firewall.downstream_udp_ports }}"
  register: security_baseline_ufw_downstream_udp
  changed_when: "'Rule added' in security_baseline_ufw_downstream_udp.stdout"
  when: security_baseline.firewall.enabled | bool
  tags:
    - security

- name: Allow current Ansible SSH control path
  ansible.builtin.command:
    cmd: "ufw allow in on {{ ansible_facts.default_ipv4.interface }} proto tcp from {{ security_baseline_control_source }} to any port {{ ansible_port | default(22) }} comment 'Frey Ansible control SSH'"
  register: security_baseline_ufw_control_ssh
  changed_when: "'Rule added' in security_baseline_ufw_control_ssh.stdout"
  when:
    - security_baseline.firewall.enabled | bool
    - security_baseline.firewall.allow_ssh_from_control_interface | bool
    - ansible_facts.default_ipv4 is defined
    - ansible_facts.default_ipv4.interface is defined
    - ansible_facts.default_ipv4.interface != security_baseline.firewall.downstream_interface
  tags:
    - security

- name: Allow downstream clients to route through upstream Wi-Fi
  ansible.builtin.command:
    cmd: "ufw route allow in on {{ security_baseline.firewall.downstream_interface }} out on {{ security_baseline.firewall.upstream_interface }} comment 'Frey downstream internet routing'"
  register: security_baseline_ufw_route
  changed_when: "'Rule added' in security_baseline_ufw_route.stdout"
  when:
    - security_baseline.firewall.enabled | bool
    - security_baseline.firewall.allow_gateway_routing | bool
  tags:
    - security

# Interface-independent, unlike the downstream and control-path rules above:
# a trusted device stays reachable to SSH no matter which radio it arrives
# on, so moving the AP between wlan0 and wlan1 cannot strand the admin
# laptop. Default-deny still applies to every address not on this list.
- name: Allow trusted devices to SSH on any interface
  ansible.builtin.command:
    cmd: "ufw allow proto tcp from {{ item }} to any port {{ ansible_port | default(22) }} comment 'Frey trusted SSH'"
  loop: "{{ security_baseline_trusted_remote_sources }}"
  register: security_baseline_ufw_trusted_ssh
  changed_when: "'Rule added' in security_baseline_ufw_trusted_ssh.stdout"
  when:
    - security_baseline.firewall.enabled | bool
    - security_baseline.trusted.enabled | bool
  tags:
    - security

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  register: security_baseline_ufw_enable
  changed_when: "'Firewall is active and enabled' in security_baseline_ufw_enable.stdout"
  when:
    - security_baseline.firewall.enabled | bool
    - not ansible_check_mode
  tags:
    - security
