---
- name: Identify the device holding the root filesystem
  ansible.builtin.command:
    cmd: findmnt -n -o SOURCE /
  register: rpi_nvme_root_source
  changed_when: false
  check_mode: false
  tags:
    - system
    - nvme

- name: Report which device root is on
  ansible.builtin.debug:
    msg: "root filesystem is on '{{ rpi_nvme_root_source.stdout | trim }}'"
  tags:
    - system
    - nvme

- name: Require that this host runs from NVMe
  ansible.builtin.assert:
    that:
      - (rpi_nvme_root_source.stdout | trim) is match(rpi_nvme.root_device_pattern)
    fail_msg: >-
      root is on '{{ rpi_nvme_root_source.stdout | trim }}', not NVMe.
      This role tunes an NVMe-backed system, and service data under
      {{ frey.base_dir | default('/opt/frey') }} would land on the SD card.
      Migrate first:
        ansible-playbook -i inventory/hosts.yml playbooks/nvme_migrate.yml -e nvme_migrate_confirm=yes
      then reboot and confirm with: findmnt -n -o SOURCE /
      To deploy on the SD card anyway, set rpi_nvme.require_nvme_root=false
    success_msg: "root is NVMe-backed"
  when: rpi_nvme.require_nvme_root | bool
  tags:
    - system
    - nvme

- name: Install NVMe and disk health packages
  ansible.builtin.apt:
    name: "{{ rpi_nvme.packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - system
    - nvme

- name: Enable periodic filesystem trim
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
    state: started
  tags:
    - system
    - nvme

- name: Apply Raspberry Pi service host VM tuning
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    # NOT the module's /etc/sysctl.conf default, which Debian 13's
    # systemd-sysctl never reads - see frey.sysctl_file in
    # inventory/group_vars/all/main.yml. Writing there applies the values live
    # and loses them at the next boot, which for hung_task_panic means the
    # wedge self-reboot is armed only until the first reboot.
    sysctl_file: "{{ frey.sysctl_file }}"
  loop: "{{ rpi_nvme.sysctl | dict2items }}"
  tags:
    - system
    - nvme

# ==============================================================================
# NVMe POWER-STATE STABILITY
#
# Why this exists at all is in roles/rpi_nvme/defaults/main.yml, next to the
# parameters. Short version: APST parks this drive in a 5mW state it does not
# reliably wake from, it leaves the PCIe bus, and the host wedges in a way the
# hardware watchdog cannot catch.
#
# This writes the boot cmdline, so it is the single most dangerous task in the
# repo after the gateway: get it wrong and the Pi does not come up, with no
# console to find out why. Hence the read-modify-write through a template, the
# backup, and the validate that refuses to install a line that lost root=.
# ==============================================================================
- name: Read the current kernel cmdline
  ansible.builtin.slurp:
    src: "{{ rpi_nvme.cmdline.path }}"
  register: rpi_nvme_cmdline_raw
  when: rpi_nvme.cmdline.manage | bool
  tags:
    - system
    - nvme

- name: Keep the existing cmdline tokens to merge against
  ansible.builtin.set_fact:
    # cmdline.txt is a single line. Anything after the first is not read by
    # the bootloader, so only the first is carried forward.
    rpi_nvme_cmdline_tokens: >-
      {{ (rpi_nvme_cmdline_raw.content | b64decode).splitlines() | first | default('', true) | trim }}
  when: rpi_nvme.cmdline.manage | bool
  tags:
    - system
    - nvme

- name: Keep a pristine copy of the original kernel cmdline
  # `force: false` means this is written once and never again, so it always
  # holds the line the Pi last booted successfully with - which is the one you
  # want when recovering by putting the card in a reader.
  #
  # Done by hand rather than with the template's `backup: true`, because
  # /boot/firmware is FAT32 and Ansible's backup filenames contain colons
  # (cmdline.txt.107101.2026-10-29@22:43:09~), which vfat rejects outright:
  #   [Errno 22] Invalid argument
  # That failure aborted the task before it wrote anything, so it failed safe -
  # but it also meant the fix could never land.
  ansible.builtin.copy:
    src: "{{ rpi_nvme.cmdline.path }}"
    dest: "{{ rpi_nvme.cmdline.backup_path }}"
    remote_src: true
    force: false
  when: rpi_nvme.cmdline.manage | bool
  tags:
    - system
    - nvme

- name: Set the NVMe power-state parameters on the kernel cmdline
  ansible.builtin.template:
    src: cmdline.txt.j2
    dest: "{{ rpi_nvme.cmdline.path }}"
    # No owner/group/mode: vfat has no concept of either, and asking for them
    # is another way for this task to fail on the one file that must not be
    # left half-written.
    #
    # A line without root= is an unbootable Pi, and this host has no console
    # and no SD card to fall back to. Refuse rather than install it.
    validate: "grep -qE '(^| )root=' %s"
  register: rpi_nvme_cmdline_written
  when: rpi_nvme.cmdline.manage | bool
  tags:
    - system
    - nvme

- name: Point out that the cmdline change needs a reboot
  ansible.builtin.debug:
    msg: >-
      The kernel cmdline changed and these parameters only apply at boot, so
      the NVMe is still running with its old power-state policy. Reboot when
      convenient - `sudo reboot` - then confirm with:
      cat /sys/module/nvme_core/parameters/default_ps_max_latency_us  (expect 0)
      and: sudo nvme get-feature /dev/nvme0 -f 0x0c -H  (expect APSTE Disabled).
      The line the Pi last booted successfully with is kept at
      {{ rpi_nvme.cmdline.backup_path }} - restore it from a card reader if
      this host ever fails to come back up.
  when:
    - rpi_nvme.cmdline.manage | bool
    - rpi_nvme_cmdline_written.changed | default(false)
  tags:
    - system
    - nvme

# ==============================================================================
# PCIe LINK SPEED
#
# Escalation step 1 after APST alone proved insufficient. See the comment on
# rpi_nvme.pcie in defaults/main.yml for the measurement that forced it.
#
# lineinfile rather than a template because config.txt carries firmware
# settings this role has no business owning - the display, the audio, the
# camera overlays. The regexp matches a commented-out form too, so toggling
# this off and on cannot leave two contradictory lines behind.
# ==============================================================================
- name: Limit the PCIe link to Gen 1 for NVMe stability
  ansible.builtin.lineinfile:
    path: "{{ rpi_nvme.pcie.config_path }}"
    line: dtparam=pciex1_gen=1
    regexp: '^\s*#?\s*dtparam=pciex1_gen='
    state: present
    insertafter: EOF
    owner: root
    group: root
    mode: "0755"
  register: rpi_nvme_pcie_gen
  when: rpi_nvme.pcie.limit_to_gen1 | bool
  tags:
    - system
    - nvme

# Removes the line entirely rather than setting gen=2, so the Pi falls back to
# whatever the firmware defaults to on this board revision instead of this role
# asserting a speed it has not measured.
- name: Restore the default PCIe link speed
  ansible.builtin.lineinfile:
    path: "{{ rpi_nvme.pcie.config_path }}"
    regexp: '^\s*#?\s*dtparam=pciex1_gen='
    state: absent
  register: rpi_nvme_pcie_gen_removed
  when: not (rpi_nvme.pcie.limit_to_gen1 | bool)
  tags:
    - system
    - nvme

- name: Point out that the PCIe link speed needs a reboot
  ansible.builtin.debug:
    msg: >-
      config.txt now pins the PCIe link to Gen 1, which only applies at boot -
      so the NVMe is still running at its old link speed. Reboot when
      convenient - `sudo reboot` - then confirm the link trained at 2.5GT/s
      with: sudo lspci -vv -s $(lspci | grep -i non-volatile | cut -d" " -f1)
      | grep -i "LnkSta:". Expect about 250 MB/s sequential rather than 500.
      If dropouts continue after this, the remaining steps need hands on the
      hardware: reseat the NVMe and its FFC ribbon, then suspect the drive.
  when: rpi_nvme_pcie_gen.changed | default(false)
  tags:
    - system
    - nvme

- name: Ensure journald override directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - system
    - nvme

- name: Make the journal persistent and bound
  ansible.builtin.template:
    src: frey-nvme-journald.conf.j2
    dest: /etc/systemd/journald.conf.d/frey-nvme.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
  tags:
    - system
    - nvme
