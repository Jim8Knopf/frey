---
rpi_nvme:
  # This host is expected to run from NVMe. Every deploy verifies it, so a
  # rebuild that is still on the SD card fails loudly with a pointer to the
  # migration rather than quietly tuning and filling the wrong disk.
  require_nvme_root: true
  root_device_pattern: "^/dev/nvme"

  packages:
    - nvme-cli
    - smartmontools

  sysctl:
    vm.swappiness: "10"
    vm.vfs_cache_pressure: "50"
    # ---------------------------------------------------------------
    # TURN AN NVMe WEDGE INTO A REBOOT.
    #
    # When the NVMe controller drops off the PCIe bus, every task that
    # touches the filesystem blocks forever - but systemd runs from RAM and
    # carries on petting the hardware watchdog, so the watchdog never fires.
    # The Pi sits there, reachable by ping, answering nothing, until someone
    # physically cuts the power. Observed: a 28-minute wedge that ended with
    # a button press, and 13 unsafe shutdowns in 19 power cycles.
    #
    # hung_task_panic turns a task blocked for longer than the timeout into a
    # panic, and kernel.panic reboots a few seconds later. The van recovers on
    # its own in about two and a half minutes instead of waiting for a human.
    #
    # 120s is deliberately generous: a healthy NVMe never blocks a task for
    # two minutes, so this only fires on a genuine fault.
    # ---------------------------------------------------------------
    kernel.hung_task_timeout_secs: "120"
    kernel.hung_task_panic: "1"
    kernel.panic: "10"

  # ---------------------------------------------------------------
  # KERNEL PARAMETERS THAT ONLY WORK FROM THE BOOT CMDLINE.
  #
  # The root cause of this Pi's recurring freezes. The fitted drive is a
  # KLEVV CRAS C910 4TB - a DRAM-less Realtek RTS5772DL - and it advertises
  # two non-operational power states:
  #
  #   ps3  0.1500W  enter 5000us   exit 10000us
  #   ps4  0.0050W  enter 17000us  exit 60000us
  #
  # The kernel's default default_ps_max_latency_us is 100000, which is above
  # ps4's 77ms round trip, so APST is allowed to park the drive in ps4 - a
  # 5-milliwatt state with a 60ms wake-up. This controller intermittently
  # fails to come back from it, and the drive vanishes from the bus:
  #
  #   nvme nvme0: controller is down; will reset: CSTS=0xffffffff, PCI_STATUS=0x10
  #
  # Six of those inside 25 minutes were recovered by the kernel's own reset.
  # When the reset also fails, the host wedges as described above. Nothing
  # appears in the journal afterwards, because the journal lives on the disk
  # that just disappeared - which is why this hid for so long and looked
  # like a software fault every time.
  #
  # 0 forbids every non-operational state. 5500 would allow ps3 but not ps4
  # and keeps most of the idle saving; prefer 0 until the van has gone a few
  # weeks without a dropout, because stability here is worth more than the
  # fraction of a watt.
  #
  # ASPM is set away from powersave for the same reason: L1 link power
  # management is the other half of the same class of fault.
  # ---------------------------------------------------------------
  cmdline:
    manage: true
    path: /boot/firmware/cmdline.txt
    # FAT32-safe name: no colons. Written once, never overwritten.
    backup_path: /boot/firmware/cmdline.txt.frey-orig
    # Appended verbatim. Any existing token sharing a key is replaced, so
    # re-running cannot duplicate or conflict.
    params:
      - nvme_core.default_ps_max_latency_us=0
      - pcie_aspm.policy=performance
      # -----------------------------------------------------------------
      # THE MEMORY CGROUP, WHICH THIS PI HAS BEEN RUNNING WITHOUT.
      #
      # Raspberry Pi firmware puts `cgroup_disable=memory` on the cmdline on
      # Pi 5 by default (it is in /proc/cmdline but not in cmdline.txt, which
      # is why it is easy to miss). The consequence is that every `mem_limit`
      # in this repo - 25 of them - was silently doing nothing, `docker stats`
      # reported 0B of memory for every container, and the
      # FreyContainerMemoryHigh alert could not have fired whatever happened.
      # A runaway container could take the whole van down unopposed.
      #
      # Enabling it makes all 25 limits binding AT ONCE, so they were measured
      # against real usage first. Grafana was 189 MiB over its limit and alloy
      # had 120 MiB of headroom; both were raised in
      # roles/monitoring/defaults/main.yml before this was switched on.
      # Everything else had room. Without that pass, this line would have
      # OOM-killed Grafana on the next boot.
      #
      # Jellyfin is the one to keep an eye on: 441 MiB measured against a 2g
      # limit is comfortable, but the Pi 5 has no hardware encoder, so a
      # software transcode is the one workload that could still surprise us.
      #
      # TWO STEPS, NOT ONE. Docker does not merely leave a limit unenforced
      # when the controller is missing - it drops it when the container is
      # CREATED, logging
      #   "Your kernel does not support memory limit capabilities or the
      #    cgroup is not mounted. Limitation discarded."
      # and storing HostConfig.Memory=0. A reboot restarts containers from
      # that stored config, so the limits still will not apply. After the
      # reboot, re-run the deploy: compose sees desired != actual and
      # recreates them, and only then is the limit real. Verify with
      #   docker inspect grafana --format '{{.HostConfig.Memory}}'
      # which must be non-zero.
      # -----------------------------------------------------------------
      - cgroup_enable=memory
      - cgroup_memory=1

  # ---------------------------------------------------------------
  # PCIe LINK SPEED - ESCALATION STEP 1, NOW IN FORCE.
  #
  # Turning APST off was supposed to end the dropouts. It did not: on
  # 2026-10-31, twelve minutes after a boot with
  # nvme_core.default_ps_max_latency_us=0 and pcie_aspm.policy=performance
  # both confirmed live in /sys, the drive left the bus again -
  #
  #   nvme nvme0: controller is down; will reset: CSTS=0xffffffff
  #
  # - so power management was a cause and not the only one. The documented
  # next lever is link speed. The Pi 5's connector is electrically marginal
  # for Gen 2 and this drive is a DRAM-less Realtek RTS5772DL; Gen 1 halves
  # the signalling rate, which is the standard remedy for a link that trains
  # but does not stay up. It is also the only one of the three remaining
  # steps that can be done from here - the other two are reseating the FFC
  # ribbon and replacing the drive.
  #
  # THE COST IS REAL: Gen 1 x1 is about 250 MB/s against 500. That is far
  # more than Jellyfin needs - a 1080p stream is single-digit MB/s - and it
  # is slower for large library copies and the *arrs' bulk imports. A wedge
  # that needs a human in a van costs more than either.
  #
  # config.txt, so it needs a reboot. Set false and re-run to go back to
  # Gen 2 once the ribbon has been reseated or the drive replaced.
  # ---------------------------------------------------------------
  pcie:
    limit_to_gen1: true
    config_path: /boot/firmware/config.txt

  journald:
    # Raspberry Pi OS defaults the journal to RAM (volatile), which loses every
    # log line on reboot. On NVMe there is no card to spare, and the logs from
    # before an unclean power loss are the whole point of having them.
    storage: persistent
    system_max_use: 256M
    max_file_sec: 7day

  # ---------------------------------------------------------------
  # SD -> NVMe root migration.
  #
  # One-shot imaging operation, NOT part of site.yml. Run it with
  # playbooks/nvme_migrate.yml. Safe to re-run: it detects a system
  # already rooted on NVMe and stops.
  # ---------------------------------------------------------------
  migrate:
    # Hard opt-in. Nothing touches the disk without this.
    enabled: false
    target_device: /dev/nvme0n1
    boot_partition_size: 513MiB
    boot_label: bootfs
    root_label: rootfs
    mount_point: /mnt/nvme-migrate
    # Refuse to destroy an NVMe that already has partitions unless set.
    force_wipe: false
    # 0xf416 = try NVMe, then SD, then USB, then restart. Keeping SD in the
    # chain means a failed NVMe boot falls back instead of stranding the Pi.
    boot_order: "0xf416"
    set_boot_order: true
    # Flashing the bootloader EEPROM is a separate, riskier action.
    update_eeprom_firmware: false
    packages:
      - parted
      - gdisk
      - dosfstools
      - e2fsprogs
      - rsync
