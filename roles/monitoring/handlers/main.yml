---
# ==============================================================================
# HANDLERS
#
# RELOAD WHERE POSSIBLE, RESTART ONLY WHERE NECESSARY.
#
# Prometheus, Alertmanager and blackbox all reload their configuration on
# SIGHUP. That matters more here than it would elsewhere: a restart of
# Prometheus is a gap in the data AND a gap in the alerting, and it would
# happen at exactly the moment you had just changed the alerting. Reloading
# keeps both running.
#
# Every handler tolerates the container not existing. A first deploy writes
# every config before anything is running, which would otherwise fail the run
# on a container that is about to be created a few tasks later.
#
# A note for anyone checking by hand whether a reload took effect: Prometheus
# takes several seconds to finish one with this many rules, so
# prometheus_config_last_reload_success_timestamp_seconds can still show the
# old value a few seconds after the signal. Wait ten before concluding the
# reload failed.
# ==============================================================================

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload Prometheus
  # SIGHUP is delivered to the container's main process ON THE HOST, and
  # deliberately NOT with `docker kill -s HUP`.
  #
  # dockerd's killWithSignal() sets HasBeenManuallyStopped on the container
  # for ANY signal, not only a terminating one. The reload itself works and
  # the container carries straight on running, so this looks entirely
  # harmless - but the container is now flagged as "stopped by the user", and
  # `restart: unless-stopped` honours that flag the next time the daemon
  # starts. The result is a container that runs fine for as long as the Pi
  # stays up and is then silently NOT restarted at the next boot, while every
  # other container comes back.
  #
  # That is not hypothetical. A rules change HUPed Prometheus, the Pi rebooted
  # nine hours later, and it came up with Prometheus alone missing - so no
  # metrics and no alerting, and nothing could raise an alert about it because
  # Prometheus is the thing that raises alerts. Alertmanager survived the same
  # reboot only because its own config had not changed in that run, so its
  # handler never fired.
  #
  # `kill -HUP <pid>` goes nowhere near the Docker API, so the flag is never
  # set. The PID from `docker inspect` is a host-namespace PID, so signalling
  # it from here reaches PID 1 inside the container.
  ansible.builtin.shell:
    cmd: |
      set -eu
      pid="$(docker inspect -f '{{ "{{" }}.State.Pid{{ "}}" }}' {{ monitoring.services.prometheus.container_name | quote }} 2>/dev/null || true)"
      [ -n "${pid:-}" ] && [ "$pid" -gt 0 ] 2>/dev/null || exit 0
      kill -HUP "$pid"
  changed_when: true
  failed_when: false

- name: Reload Alertmanager
  # Host-side SIGHUP, for the same reason as the Prometheus handler above:
  # `docker kill -s HUP` would flag this container as manually stopped and
  # stop `restart: unless-stopped` from bringing it back after a reboot.
  ansible.builtin.shell:
    cmd: |
      set -eu
      pid="$(docker inspect -f '{{ "{{" }}.State.Pid{{ "}}" }}' {{ monitoring.services.alertmanager.container_name | quote }} 2>/dev/null || true)"
      [ -n "${pid:-}" ] && [ "$pid" -gt 0 ] 2>/dev/null || exit 0
      kill -HUP "$pid"
  changed_when: true
  failed_when: false

# RESTARTED, not signalled, unlike the two above.
#
# blackbox is the one component where a signal was observed not to take
# effect: after adding a new service, SIGHUP left the exporter still
# answering "400 Bad Request - unknown module" for it, and a restart was what
# actually picked the module up. Its /-/reload endpoint answers 200 but was
# not demonstrably better.
#
# A restart costs exactly one missed probe on a 30-second interval, and the
# probes are the thing that notices a new service at all - so a reload that
# silently does nothing here means a newly added service appears permanently
# down. Deterministic beats elegant.
- name: Reload blackbox exporter
  community.docker.docker_container:
    name: "{{ monitoring.services.blackbox.container_name }}"
    state: started
    restart: true
  failed_when: false

# Loki, Alloy, Grafana and the relay have no reload signal, so these do have
# to restart. All four are stateless enough for that to be free: Loki's chunks
# and Grafana's database are on disk, and the relay persists its queue of held
# alerts before exiting - so a restart does not lose a notification that is
# waiting for an uplink.
- name: Restart Loki
  community.docker.docker_container:
    name: "{{ monitoring.services.loki.container_name }}"
    state: started
    restart: true
  failed_when: false

- name: Restart Alloy
  community.docker.docker_container:
    name: "{{ monitoring.services.alloy.container_name }}"
    state: started
    restart: true
  failed_when: false

- name: Restart Grafana
  community.docker.docker_container:
    name: "{{ monitoring.services.grafana.container_name }}"
    state: started
    restart: true
  failed_when: false

- name: Restart monitoring relay
  community.docker.docker_container:
    name: "{{ monitoring.services.alert_relay.container_name }}"
    state: started
    restart: true
  failed_when: false
