---
- name: Prepare monitoring
  ansible.builtin.import_tasks: prepare.yml

- name: Pull missing images
  ansible.builtin.import_tasks: images.yml

- name: Render service configuration
  ansible.builtin.import_tasks: configure.yml

- name: Validate service configuration
  ansible.builtin.import_tasks: validate.yml

- name: Install host collectors
  ansible.builtin.import_tasks: collectors.yml

- name: Deploy the Compose stack
  ansible.builtin.import_tasks: compose.yml

- name: Report what to do next
  ansible.builtin.include_tasks:
    file: report.yml
    apply:
      tags: [monitoring, metrics]
  tags: [monitoring, metrics]
