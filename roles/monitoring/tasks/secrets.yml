---
# ==============================================================================
# SECRETS
#
# Generated on the Pi on first run, persisted, reused forever after - the same
# read-merge-write pattern roles/identity/ and the media modules use, and the
# same reasoning: a secret that only has to be the same tomorrow as it was
# today does not belong in version control, and nothing is gained by making
# you invent it.
#
# vault_monitoring_secrets always wins, so anything you do want to pin can be.
#
# THE NTFY TOPIC IS THE ONE TO UNDERSTAND. It is not a password in the usual
# sense - it is a channel name on a public relay - but knowing it is the only
# thing needed to read your alerts or to send you fake ones. So it is
# generated long and random rather than chosen, and printed once at the end of
# the first deploy so you can subscribe your phone to it.
# ==============================================================================

- name: Check for the persisted monitoring secret file
  ansible.builtin.stat:
    path: "{{ monitoring.configure.key_file }}"
  register: monitoring_key_stat
  tags: [monitoring, metrics, monitoring_config]

- name: Read persisted monitoring secrets
  ansible.builtin.slurp:
    src: "{{ monitoring.configure.key_file }}"
  register: monitoring_key_blob
  when: monitoring_key_stat.stat.exists
  no_log: true
  tags: [monitoring, metrics, monitoring_config]

- name: Load persisted monitoring secrets
  ansible.builtin.set_fact:
    monitoring_secrets: >-
      {{
        (monitoring_key_blob.content | b64decode | from_json)
        if monitoring_key_stat.stat.exists
        else {}
      }}
  no_log: true
  tags: [monitoring, metrics, monitoring_config]

- name: Generate any missing monitoring secrets
  ansible.builtin.set_fact:
    monitoring_secrets: >-
      {{
        monitoring_secrets
        | combine({
            item: monitoring_secrets[item]
                  | default(lookup('password', '/dev/null',
                                   chars=['ascii_letters', 'digits'],
                                   length=20))
          })
      }}
  loop: "{{ monitoring.configure.secret_keys | reject('equalto', 'ntfy_topic') | list }}"
  no_log: true
  tags: [monitoring, metrics, monitoring_config]

# ------------------------------------------------------------------------------
# The topic gets its own task because it is shaped differently: prefixed so it
# is recognisable in a phone's notification list, and restricted to the
# characters ntfy accepts in a topic name.
# ------------------------------------------------------------------------------
- name: Generate the ntfy topic if there is not one yet
  ansible.builtin.set_fact:
    monitoring_secrets: >-
      {{
        monitoring_secrets
        | combine({
            'ntfy_topic': monitoring_secrets.ntfy_topic
              | default(
                  'frey-' ~ (
                    lookup('password', '/dev/null', chars=['hexdigits'], length=24)
                    | lower
                  )
                )
          })
      }}
  no_log: true
  tags: [monitoring, metrics, monitoring_config]

- name: Apply vault overrides over generated monitoring secrets
  ansible.builtin.set_fact:
    monitoring_secrets: >-
      {{
        monitoring_secrets
        | combine(vault_monitoring_secrets | default({}, true))
        | combine(
            {'ntfy_topic': monitoring_alerting.ntfy.topic}
            if (monitoring_alerting.ntfy.topic | default('', true) | length > 0)
            else {}
          )
      }}
  no_log: true
  tags: [monitoring, metrics, monitoring_config]

- name: Record whether the ntfy topic was newly generated
  # Used by report.yml to decide whether to print it. Printing it on every run
  # would train you to ignore the output of a deploy, which is where the one
  # thing you actually have to act on appears.
  ansible.builtin.set_fact:
    monitoring_topic_is_new: "{{ not monitoring_key_stat.stat.exists }}"
  tags: [monitoring, metrics, monitoring_config]

- name: Persist monitoring secrets
  ansible.builtin.copy:
    content: "{{ monitoring_secrets | to_nice_json }}\n"
    dest: "{{ monitoring.configure.key_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [monitoring, metrics, monitoring_config]

# ==============================================================================
# THE GRAFANA OIDC CLIENT SECRET
#
# Generated by roles/identity/, not here. This module only READS it - it never
# writes to the identity key file, because two modules writing one secret store
# is how a secret gets lost.
#
# The grafana client was already in identity's OIDC catalogue before this
# module existed, complete with the frey_groups claims policy it needs. Adding
# `grafana: {auth: oidc}` to identity.yml is what makes identity generate the
# secret; this picks it up.
#
# If identity is not deployed, or grafana is not set to oidc there, Grafana
# falls back to its local admin account and single sign-on is simply off. That
# is a supported state, not a failure - which is what keeps this module
# deployable on its own.
# ==============================================================================

- name: Check for the identity secret file
  ansible.builtin.stat:
    path: "{{ monitoring.configure.identity_key_file }}"
  register: monitoring_identity_key_stat
  tags: [monitoring, metrics, monitoring_config]

- name: Read the identity secrets
  ansible.builtin.slurp:
    src: "{{ monitoring.configure.identity_key_file }}"
  register: monitoring_identity_blob
  when: monitoring_identity_key_stat.stat.exists
  no_log: true
  tags: [monitoring, metrics, monitoring_config]

- name: Pick up the Grafana OIDC client secret
  ansible.builtin.set_fact:
    monitoring_grafana_oidc_secret: >-
      {{
        (
          (monitoring_identity_blob.content | b64decode | from_json)
          | default({}, true)
        ).grafana_oidc_secret | default('', true)
        if monitoring_identity_key_stat.stat.exists
        else ''
      }}
  no_log: true
  tags: [monitoring, metrics, monitoring_config]

- name: Decide whether Grafana uses single sign-on
  ansible.builtin.set_fact:
    monitoring_grafana_oidc: >-
      {{
        (identity_services | default({})).grafana is defined
        and (identity_services | default({})).grafana.auth | default('') == 'oidc'
        and monitoring_grafana_oidc_secret | length > 0
      }}
  tags: [monitoring, metrics, monitoring_config]

- name: Warn when Grafana single sign-on cannot be configured
  ansible.builtin.debug:
    msg: >-
      Grafana is set to auth: oidc in identity.yml but no client secret was
      found in {{ monitoring.configure.identity_key_file }}. Deploy the
      identity module first (--tags identity) and then re-run this one;
      until then Grafana only accepts its local admin account.
  when:
    - (identity_services | default({})).grafana is defined
    - (identity_services | default({})).grafana.auth | default('') == 'oidc'
    - not (monitoring_grafana_oidc | bool)
  tags: [monitoring, metrics, monitoring_config]
