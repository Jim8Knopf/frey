---
# ==============================================================================
# SECRETS
#
# Reads and extends the same persisted secret file the acquisition module
# uses. The read-merge-write pattern matters: this module must add its own
# secrets without discarding the *arr API keys written by the other one.
#
# Vault values (vault_media_api_keys) always win over generated ones.
# ==============================================================================

- name: Check for the persisted media secret file
  ansible.builtin.stat:
    path: "{{ media_library.configure.key_file }}"
  register: media_library_key_stat
  tags:
    - media
    - media_library
    - media_config

- name: Read persisted media secrets
  ansible.builtin.slurp:
    src: "{{ media_library.configure.key_file }}"
  register: media_library_key_blob
  when: media_library_key_stat.stat.exists
  no_log: true
  tags:
    - media
    - media_library
    - media_config

- name: Load persisted media secrets
  ansible.builtin.set_fact:
    media_secrets: >-
      {{
        (media_library_key_blob.content | b64decode | from_json)
        if media_library_key_stat.stat.exists
        else {}
      }}
  no_log: true
  tags:
    - media
    - media_library
    - media_config

- name: Generate any missing media library secrets
  ansible.builtin.set_fact:
    media_secrets: >-
      {{
        media_secrets
        | combine({
            item: media_secrets[item]
                  | default(lookup('password', '/dev/null',
                                   chars=['hexdigits'], length=32) | lower)
          })
      }}
  loop: "{{ media_library.configure.secret_keys }}"
  no_log: true
  tags:
    - media
    - media_library
    - media_config

- name: Apply vault overrides over generated media secrets
  ansible.builtin.set_fact:
    media_secrets: "{{ media_secrets | combine(vault_media_api_keys | default({}, true)) }}"
  no_log: true
  tags:
    - media
    - media_library
    - media_config

- name: Persist media secrets
  ansible.builtin.copy:
    content: "{{ media_secrets | to_nice_json }}\n"
    dest: "{{ media_library.configure.key_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags:
    - media
    - media_library
    - media_config
