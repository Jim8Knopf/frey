---
- name: Restart media library stack
  community.docker.docker_compose_v2:
    project_src: "{{ media_library.stack_dir }}"
    state: restarted
    timeout: 300
  when: not ansible_check_mode

- name: Restart jellyfin
  community.docker.docker_container:
    name: "{{ media_library.services.jellyfin.container_name }}"
    state: started
    restart: true
  when: not ansible_check_mode
