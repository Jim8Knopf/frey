---
# ==============================================================================
# DOCKGE - a window onto the compose stacks
#
# A web UI that lists the Docker Compose stacks on the Pi and lets you see
# their containers, logs and state in one place, instead of remembering which
# of twenty-odd container names belongs to which stack.
#
# ------------------------------------------------------------------------------
# READ THIS BEFORE EDITING ANYTHING IN IT
#
# Dockge can edit compose files, and the Frey stacks are generated by Ansible.
# Every one of them opens with:
#
#     Do not edit on the Pi; changes are overwritten on the next deploy.
#
# That is still true with Dockge installed. Anything you change in the UI
# survives exactly until the next `ansible-playbook`, which rewrites the file
# from its template and recreates the containers. The same goes for stopping a
# service: the next deploy starts it again, because the role's compose state is
# `present`.
#
# So treat it as a dashboard, not a control panel:
#
#   good    seeing what is running, reading logs, checking why something
#           restarted, restarting a container to clear a transient fault
#   bad     editing a frey_* stack's compose file - make the change in the
#           role and deploy, or it will be silently reverted
#
# `stacks_writable: false` below enforces that by mounting the Frey stacks
# read-only, so the UI shows them and refuses to save over them. Set it true
# if you would rather have the rope.
#
# Nothing in the monitoring module depends on this. Dockge is for looking at
# the stack; Grafana and the alerts are for knowing it is healthy.
# ==============================================================================

dockge:
  stack_dir: "{{ frey.base_dir }}/stacks/dockge"
  appdata_dir: "{{ frey.base_dir }}/appdata/dockge"

  image: "louislam/dockge:{{ dockge_version }}"
  container_name: dockge
  # Dockge's own port inside the container. Published nowhere - it is reached
  # through Traefik like everything else.
  port: 5001

  # The hostname it answers on: dockge.hub.frey
  host: dockge

  mem_limit: 512m

  # --------------------------------------------------------------------------
  # WHERE IT LOOKS FOR STACKS
  #
  # The real Frey stack directory, so it shows the actual deployment rather
  # than an empty parallel universe. Mounted at the same path inside the
  # container because Dockge shells out to `docker compose` with these paths,
  # and a path that differs between the UI and the daemon produces errors that
  # look like permissions problems.
  # --------------------------------------------------------------------------
  stacks_dir: "{{ frey.base_dir }}/stacks"
  # false mounts the stacks read-only - see the note at the top of this file.
  stacks_writable: false
