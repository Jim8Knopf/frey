---
# ==============================================================================
# DOCKGE
#
# A window onto the compose stacks. Read roles/dockge/defaults/main.yml before
# using it to change anything: the Frey stacks are generated by Ansible, and
# edits made in the UI are reverted by the next deploy.
# ==============================================================================

- name: Validate dockge configuration
  ansible.builtin.assert:
    that:
      - dockge.stack_dir | length > 0
      - dockge.stacks_dir | length > 0
      - dockge_version is defined
      - dockge_version | length > 0
    fail_msg: >-
      dockge configuration is invalid. inventory/group_vars/all/images.yml must
      define dockge_version.
  tags: [dockge, services]

- name: Ensure dockge directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ dockge.stack_dir }}"
    - "{{ dockge.appdata_dir }}"
  tags: [dockge, services]

- name: Warn when the Frey stacks are mounted writable
  # Not a failure - it is a supported choice - but it should never be a
  # surprise, because the symptom is edits silently disappearing on the next
  # deploy rather than an error anyone would connect to this setting.
  ansible.builtin.debug:
    msg: >-
      dockge.stacks_writable is true, so Dockge can save over the compose
      files in {{ dockge.stacks_dir }}. Those files are generated from the
      roles and will be rewritten on the next deploy - make lasting changes in
      roles/<module>/templates/ instead.
  when: dockge.stacks_writable | bool
  tags: [dockge, services]

- name: Pull the dockge image
  community.docker.docker_image_pull:
    name: "{{ dockge.image }}"
  register: dockge_pull
  retries: 8
  delay: 30
  until: dockge_pull is succeeded
  # ignore_errors rather than failed_when, so the next task can report it
  # readably instead of the failure being swallowed.
  ignore_errors: true
  when: not ansible_check_mode
  tags: [dockge, services]

- name: Fail clearly when the dockge image is missing
  ansible.builtin.fail:
    msg: >-
      Could not pull {{ dockge.image }} after 8 attempts. Re-run
      `--tags dockge` on a better connection.
  when:
    - dockge_pull is defined
    - dockge_pull.failed | default(false)
  tags: [dockge, services]

- name: Deploy the dockge compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dockge.stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
    validate: "docker compose -f %s config --quiet"
  tags: [dockge, services]

- name: Start dockge
  community.docker.docker_compose_v2:
    project_src: "{{ dockge.stack_dir }}"
    state: present
    remove_orphans: true
    # Already pulled above; `missing` costs a registry HEAD that times out on
    # a van's uplink.
    pull: never
    timeout: 180
  when: not ansible_check_mode
  tags: [dockge, services]

- name: Report where dockge is
  ansible.builtin.debug:
    msg: >-
      {{
        [
          "",
          "Dockge: https://" ~ dockge.host ~ "." ~ frey.service_domain,
          "",
          "It lists the compose stacks and their containers. The Frey stacks"
          ~ " are mounted "
          ~ ("READ-WRITE - edits will be reverted by the next deploy."
             if dockge.stacks_writable | bool
             else "read-only, because Ansible owns those files."),
          "",
        ] | join('\n')
      }}
  tags: [dockge, services]
