---
- name: Validate campaign assistant access policy
  ansible.builtin.assert:
    that:
      - campaign_ai.host in identity_services.campaign_ai.hosts
      - identity_services.campaign_ai.auth == 'forward_auth'
      - identity_services.campaign_ai.groups | sort == ['frey_admins', 'notes'] | sort
      - campaign_ai.model_sha256 is match('^[a-f0-9]{64}$')

- name: Create assistant directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ campaign_ai.stack_dir }}"
    - "{{ campaign_ai.model_dir }}"

- name: Check whether the assistant stack directory exists
  ansible.builtin.stat:
    path: "{{ campaign_ai.stack_dir }}"
  register: campaign_ai_stack_stat

- name: Pull pinned assistant images
  community.docker.docker_image_pull:
    name: "{{ item }}"
    pull: not_present
  loop:
    - "{{ campaign_ai.image }}"
    - "{{ campaign_ai.gateway_image }}"
  when: not ansible_check_mode

- name: Install and validate assistant compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ campaign_ai.stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
    validate: "docker compose -f %s --profile model config --quiet"
  when: not ansible_check_mode or campaign_ai_stack_stat.stat.exists

- name: Install assistant configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ campaign_ai.stack_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: route.yml.j2, dest: route.yml, mode: "0644"}
    - {src: download-model.sh.j2, dest: download-model.sh, mode: "0755"}
  when: not ansible_check_mode or campaign_ai_stack_stat.stat.exists

- name: Install model download service and retry timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - frey-campaign-ai-download.service
    - frey-campaign-ai-download.timer
  register: campaign_ai_download_unit

- name: Reload systemd after installing download service
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: campaign_ai_download_unit.changed and not ansible_check_mode

- name: Start the authenticated assistant gateway
  community.docker.docker_compose_v2:
    project_src: "{{ campaign_ai.stack_dir }}"
    services: [gateway]
    state: present
    pull: never
  when: not ansible_check_mode

- name: Check for downloaded model
  ansible.builtin.stat:
    path: "{{ campaign_ai.model_dir }}/{{ campaign_ai.model_file }}"
  register: campaign_ai_model

- name: Start local model if available
  community.docker.docker_compose_v2:
    project_src: "{{ campaign_ai.stack_dir }}"
    profiles: [model]
    services: [model]
    state: present
    pull: never
  when: campaign_ai_model.stat.exists and not ansible_check_mode

- name: Begin model download in the background when needed
  ansible.builtin.systemd_service:
    name: frey-campaign-ai-download.service
    state: started
    no_block: true
  when: not campaign_ai_model.stat.exists and not ansible_check_mode

- name: Enable automatic model download retries
  ansible.builtin.systemd_service:
    name: frey-campaign-ai-download.timer
    enabled: true
    state: started
  when: not ansible_check_mode
