---
- name: Deploy the acquisition stack's resolver configuration
  # Ansible owns this outright - it is the reason the container exists, and
  # drift here silently reintroduces the AAAA failure it was added to stop.
  # See the `dns:` note in defaults/main.yml.
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: "{{ media.appdata_dir }}/resolver/dnsmasq.conf"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0644"
  when: media_acquisition.services.resolver.enabled | bool
  notify: Restart media resolver
  tags:
    - media
    - media_acquisition
    - media_config

- name: Seed the acquisition resolver's upstream list
  ansible.builtin.template:
    src: resolver-servers.conf.j2
    dest: "{{ media.appdata_dir }}/resolver/servers.conf"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0644"
    force: false
  when:
    - media_acquisition.services.resolver.enabled | bool
    - media_acquisition.dns.fallback_to_uplink | default(true) | bool
  tags:
    - media
    - media_acquisition
    - media_config
