---
- name: Seed Servarr configuration files
  ansible.builtin.template:
    src: arr-config.xml.j2
    dest: "{{ media.appdata_dir }}/{{ item.key }}/config.xml"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0640"
    # Never overwrite: once the app has started, this file is its own.
    force: false
  loop: "{{ media_acquisition.services | dict2items | selectattr('value.enabled', 'truthy') | selectattr('value.env_prefix', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  tags:
    - media
    - media_acquisition

- name: Compute qBittorrent WebUI password hash
  # Runs on the Pi; the password is passed in the environment, not argv, so it
  # does not appear in the process list. Deterministic for a given password,
  # so re-runs do not churn the config file.
  ansible.builtin.script:
    cmd: files/qbt_pbkdf2.py
  environment:
    QBT_PASSWORD: "{{ media_secrets.qbittorrent_password }}"
  register: media_qbt_hash
  changed_when: false
  check_mode: false
  no_log: true
  when: media_acquisition.services.qbittorrent.enabled | bool
  tags:
    - media
    - media_acquisition
    - media_config

- name: Expose the qBittorrent password hash to templates
  ansible.builtin.set_fact:
    qbittorrent_password_hash: "{{ media_qbt_hash.stdout | trim }}"
  when:
    - media_acquisition.services.qbittorrent.enabled | bool
    - media_qbt_hash.stdout is defined
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config

- name: Check whether qBittorrent already has a configuration
  # Recorded BEFORE the seed template runs, so the next task can tell "the
  # app has config of its own that may need its password corrected" apart
  # from "we just wrote the config and it already has the right password".
  ansible.builtin.stat:
    path: "{{ media.appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
  register: media_qbt_conf_stat
  when: media_acquisition.services.qbittorrent.enabled | bool
  tags:
    - media
    - media_acquisition
    - media_config

- name: Seed qBittorrent configuration
  ansible.builtin.template:
    src: qBittorrent.conf.j2
    dest: "{{ media.appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0640"
    force: false
  when:
    - media_acquisition.services.qbittorrent.enabled | bool
    - qbittorrent_password_hash is defined
  no_log: true
  tags:
    - media
    - media_acquisition

- name: Read the current qBittorrent configuration
  # Needed to tell "no password set at all" from "qBittorrent has rewritten
  # the password hash with its own salt", which are very different situations.
  ansible.builtin.slurp:
    src: "{{ media.appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
  register: media_qbt_conf_content
  when:
    - media_acquisition.services.qbittorrent.enabled | bool
    - media_qbt_conf_stat.stat.exists | default(false)
  failed_when: false
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config

- name: Restore the qBittorrent password when none is stored
  ansible.builtin.lineinfile:
    path: "{{ media.appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
    regexp: '^WebUI\\Password_PBKDF2='
    line: 'WebUI\Password_PBKDF2="{{ qbittorrent_password_hash }}"'
    insertafter: '^\[Preferences\]'
  when:
    - media_acquisition.services.qbittorrent.enabled | bool
    - media_acquisition.services.qbittorrent.enforce_password
    - qbittorrent_password_hash is defined
    # Only for a config that already existed. A freshly seeded one was just
    # written with the correct hash, and in check mode it was not written at
    # all - so touching it here would fail on a file that does not exist.
    - media_qbt_conf_stat.stat.exists | default(false)
    # And only when there is genuinely no password stored.
    - media_qbt_conf_content.content is defined
    - "'Password_PBKDF2' not in (media_qbt_conf_content.content | b64decode)"
  no_log: true
  notify: Restart qbittorrent
  tags:
    - media
    - media_acquisition
    - media_config

- name: Seed Bazarr configuration directory
  ansible.builtin.file:
    path: "{{ media.appdata_dir }}/bazarr/config"
    state: directory
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0775"
  when: media_acquisition.services.bazarr.enabled | bool
  tags:
    - media
    - media_acquisition

- name: Seed Bazarr configuration
  ansible.builtin.template:
    src: bazarr-config.yaml.j2
    dest: "{{ media.appdata_dir }}/bazarr/config/config.yaml"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0640"
    force: false
  when: media_acquisition.services.bazarr.enabled | bool
  no_log: true
  tags:
    - media
    - media_acquisition
