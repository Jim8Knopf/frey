---
# ==============================================================================
# One Servarr application: root folders + qBittorrent download client
#
# Called per app from arrs.yml with `arr` as {key: sonarr, value: {...}}.
#
# Idempotency: every step reads the collection first and only POSTs what is
# missing, matched by name or path. Re-running is a no-op, which is what makes
# --tags media_config safe to run whenever something looks wrong.
#
# WHY ROOT FOLDERS ARE NOT ONE SHARED PAYLOAD
#
# The Servarr apps disagree about what a root folder is:
#
#   Sonarr, Radarr (v3)  a path is enough
#   Lidarr (v1)          Name + a default quality AND metadata profile, or it
#                        answers 400 "must be greater than 0"
#   Chaptarr (v1)        manages audiobooks and ebooks together, so each
#                        folder declares a numeric folderType and carries
#                        profiles for that media type specifically
#
# So each app declares its own root folders in defaults, and profiles are
# resolved by NAME here rather than by hardcoded id - the ids an app gives its
# own built-in profiles are not guaranteed to be stable.
# ==============================================================================

- name: "{{ arr.key }}: read existing root folders"
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/{{ arr.value.api_version }}/rootfolder"
    method: GET
    headers:
      Host: "{{ arr.key }}.{{ frey.local_domain }}"
      X-Api-Key: "{{ media_secrets[arr.key] }}"
    return_content: true
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  register: arr_rootfolders
  failed_when: false
  changed_when: false

- name: "{{ arr.key }}: read quality profiles"
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/{{ arr.value.api_version }}/qualityprofile"
    method: GET
    headers:
      Host: "{{ arr.key }}.{{ frey.local_domain }}"
      X-Api-Key: "{{ media_secrets[arr.key] }}"
    return_content: true
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  register: arr_quality_profiles
  failed_when: false
  changed_when: false
  when: arr.value.root_folders | selectattr('quality_field', 'defined') | list | length > 0

- name: "{{ arr.key }}: read metadata profiles"
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/{{ arr.value.api_version }}/metadataprofile"
    method: GET
    headers:
      Host: "{{ arr.key }}.{{ frey.local_domain }}"
      X-Api-Key: "{{ media_secrets[arr.key] }}"
    return_content: true
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  register: arr_metadata_profiles
  failed_when: false
  changed_when: false
  when: arr.value.root_folders | selectattr('metadata_field', 'defined') | list | length > 0

- name: "{{ arr.key }}: add root folders"
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/{{ arr.value.api_version }}/rootfolder"
    method: POST
    headers:
      Host: "{{ arr.key }}.{{ frey.local_domain }}"
      X-Api-Key: "{{ media_secrets[arr.key] }}"
    body_format: json
    body: "{{ arr_rootfolder_body }}"
    status_code: [200, 201]
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  vars:
    # Resolve profile names to ids, falling back to the lowest id the app has
    # rather than failing outright - a wrong-but-valid profile is recoverable
    # in the UI, a missing root folder means nothing can be imported at all.
    arr_quality_id: >-
      {{
        (arr_quality_profiles.json | default([])
         | selectattr('name', 'equalto', rf.quality_profile | default(''))
         | map(attribute='id') | list
         + (arr_quality_profiles.json | default([]) | map(attribute='id') | sort | list))
        | first | default(1)
      }}
    arr_metadata_id: >-
      {{
        (arr_metadata_profiles.json | default([])
         | selectattr('name', 'equalto', rf.metadata_profile | default(''))
         | map(attribute='id') | list
         + (arr_metadata_profiles.json | default([]) | map(attribute='id') | sort | list))
        | first | default(1)
      }}
    arr_rootfolder_body: >-
      {{
        {'path': rf.path}
        | combine({'name': rf.name} if rf.name is defined else {})
        | combine(rf.extra | default({}))
        | combine({rf.quality_field: arr_quality_id | int} if rf.quality_field is defined else {})
        | combine({rf.metadata_field: arr_metadata_id | int} if rf.metadata_field is defined else {})
        | combine({
            'defaultMonitorOption': 'none',
            'defaultNewItemMonitorOption': 'none',
            'defaultTags': [],
          } if rf.quality_field is defined else {})
      }}
  loop: "{{ arr.value.root_folders }}"
  loop_control:
    loop_var: rf
    label: "{{ arr.key }}:{{ rf.path }}"
  when:
    - arr_rootfolders.json is defined
    - rf.path not in (arr_rootfolders.json | map(attribute='path') | list)
  register: arr_rootfolder_add
  failed_when: false

- name: "{{ arr.key }}: record root folder failures"
  ansible.builtin.set_fact:
    media_wiring_failures: >-
      {{
        media_wiring_failures
        + (arr_rootfolder_add.results | default([])
           | rejectattr('skipped', 'defined')
           | selectattr('status', 'defined')
           | rejectattr('status', 'in', [200, 201])
           | map(attribute='rf.path')
           | map('regex_replace', '^(.*)$', arr.key ~ ': root folder \1 not created')
           | list)
      }}
  when: arr_rootfolder_add.results is defined

- name: "{{ arr.key }}: read existing download clients"
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/{{ arr.value.api_version }}/downloadclient"
    method: GET
    headers:
      Host: "{{ arr.key }}.{{ frey.local_domain }}"
      X-Api-Key: "{{ media_secrets[arr.key] }}"
    return_content: true
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  register: arr_downloadclients
  failed_when: false
  changed_when: false
  when: media_acquisition.services.qbittorrent.enabled | bool

- name: "{{ arr.key }}: add qBittorrent as the download client"
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/{{ arr.value.api_version }}/downloadclient"
    method: POST
    headers:
      Host: "{{ arr.key }}.{{ frey.local_domain }}"
      X-Api-Key: "{{ media_secrets[arr.key] }}"
    body_format: json
    body:
      enable: true
      protocol: torrent
      priority: 1
      # Let the *arr clean up after itself once an import has completed.
      removeCompletedDownloads: true
      removeFailedDownloads: true
      name: qBittorrent
      implementation: QBittorrent
      implementationName: qBittorrent
      configContract: QBittorrentSettings
      tags: []
      fields:
        # Container hostname on the internal media network - resolved by
        # Docker DNS, and stable across container recreation unlike an IP.
        #
        # This is `gluetun` when the VPN is on, because qBittorrent then has
        # no hostname of its own: it lives inside the tunnel container's
        # network namespace, and that is where its listening socket is.
        - name: host
          value: "{{ media_acquisition.vpn.qbittorrent_host }}"
        - name: port
          value: "{{ media_acquisition.services.qbittorrent.port }}"
        - name: useSsl
          value: false
        - name: urlBase
          value: ""
        - name: username
          value: "{{ media_acquisition.services.qbittorrent.web_username }}"
        - name: password
          value: "{{ media_secrets.qbittorrent_password }}"
        # The category field name differs per app, hence category_field.
        - name: "{{ arr.value.category_field }}"
          value: "{{ arr.value.category }}"
        - name: initialState
          value: 0
        - name: sequentialOrder
          value: false
        - name: firstAndLast
          value: false
    status_code: [200, 201]
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  when:
    - media_acquisition.services.qbittorrent.enabled | bool
    - arr_downloadclients.json is defined
    - "'qBittorrent' not in (arr_downloadclients.json | map(attribute='name') | list)"
  register: arr_downloadclient_add
  failed_when: false
  no_log: true

- name: "{{ arr.key }}: correct the qBittorrent credential on an existing download client"
  # The add task above only fires when no client named qBittorrent exists, so
  # on every later run the stored credential is whatever was true the day it
  # was created. Change the login in the vault and, without this, the *arrs
  # keep sending the old one: every poll comes back 401 and the app reports
  # "All download clients are unavailable due to failures" while qBittorrent
  # itself is healthy and reachable.
  #
  # PUT the whole definition back rather than patching a field, because the
  # Servarr API replaces the resource and silently drops any field omitted.
  # The username is read back and compared; the password cannot be, since the
  # API returns it censored, so it is rewritten whenever the username differs
  # or the client was reported as failing.
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/{{ arr.value.api_version }}/downloadclient/{{ arr_qbt_existing.id }}"
    method: PUT
    headers:
      Host: "{{ arr.key }}.{{ frey.local_domain }}"
      X-Api-Key: "{{ media_secrets[arr.key] }}"
    body_format: json
    body: >-
      {{
        arr_qbt_existing
        | combine({
            'fields': (
              arr_qbt_existing.fields
              | rejectattr('name', 'in', ['username', 'password'])
              | list
            ) + [
              {'name': 'username',
               'value': media_acquisition.services.qbittorrent.web_username},
              {'name': 'password', 'value': media_secrets.qbittorrent_password}
            ]
          })
      }}
    status_code: [200, 202]
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  vars:
    arr_qbt_existing: >-
      {{
        (arr_downloadclients.json | default([])
         | selectattr('name', 'equalto', 'qBittorrent')
         | list | first) | default({}, true)
      }}
    arr_qbt_stored_username: >-
      {{
        (arr_qbt_existing.fields | default([])
         | selectattr('name', 'equalto', 'username')
         | map(attribute='value') | list | first) | default('', true)
      }}
  when:
    - media_acquisition.services.qbittorrent.enabled | bool
    - arr_downloadclients.json is defined
    - "'qBittorrent' in (arr_downloadclients.json | map(attribute='name') | list)"
    - arr_qbt_existing.id is defined
    - arr_qbt_stored_username != media_acquisition.services.qbittorrent.web_username
  register: arr_downloadclient_fix
  failed_when: false
  no_log: true

- name: "{{ arr.key }}: record download client credential failure"
  ansible.builtin.set_fact:
    media_wiring_failures: "{{ media_wiring_failures + [arr.key ~ ': qBittorrent credential not corrected'] }}"
  when:
    - arr_downloadclient_fix is defined
    - not (arr_downloadclient_fix.skipped | default(false))
    - arr_downloadclient_fix.status is defined
    - arr_downloadclient_fix.status not in [200, 202]

- name: "{{ arr.key }}: record download client failure"
  ansible.builtin.set_fact:
    media_wiring_failures: "{{ media_wiring_failures + [arr.key ~ ': qBittorrent download client not added'] }}"
  when:
    - arr_downloadclient_add is defined
    - not (arr_downloadclient_add.skipped | default(false))
    - arr_downloadclient_add.status is defined
    - arr_downloadclient_add.status not in [200, 201]
