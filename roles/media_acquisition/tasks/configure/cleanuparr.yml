---
# ==============================================================================
# CLEANUPARR
#
# Cleanuparr is the only application in this stack that cannot be configured
# by rendering a file. Its settings live in its own SQLite database, it has no
# config file, and upstream dropped environment-variable configuration when v2
# moved everything into the UI -- PORT/PUID/PGID/UMASK/TZ and the database
# variables are all that is left. So it is configured here over its REST API.
#
# AUTHENTICATION IS THE INVERSE OF THE *ARRS
#
# Ansible chooses the *arr API keys and seeds them before those containers
# first start, which is what lets the rest of the wiring happen with no
# clicking. Cleanuparr generates its own key when the first account is
# created, so Ansible cannot invent it -- it has to be handed one, via
# vault_media_api_keys.cleanuparr. With no key this file reports Cleanuparr as
# unwired and writes nothing, exactly like an app whose API never answered.
#
# Every write is read-modify-write: GET the section, merge the keys this role
# owns, and PUT only when the merge actually differs. Anything configured in
# the UI that this role does not mention is therefore left alone, and a
# re-run reports no change.
# ==============================================================================

- name: Read the Cleanuparr account API key from its own database
  # Cleanuparr generates this key itself when the first account is created,
  # so unlike every *arr key Ansible cannot choose it ahead of time -- and no
  # API call hands it over without already holding it. It is therefore read
  # out of the application's own database, read-only, rather than asked of a
  # human: that keeps the stack deployable with no copy-and-paste step and no
  # second copy of the secret living in the vault.
  #
  # Never written -- Cleanuparr owns this file. Returns empty when nobody has
  # created the account yet, which is not an error: the steps below then
  # report Cleanuparr as unwired and change nothing.
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - "-c"
      - |
        import sqlite3, sys
        try:
            db = sqlite3.connect("file:%s?mode=ro" % sys.argv[1], uri=True)
            row = db.execute("select api_key from users limit 1").fetchone()
        except Exception:
            row = None
        sys.stdout.write(row[0] if row and row[0] else "")
      - "{{ media.appdata_dir }}/cleanuparr/users.db"
  register: cleanuparr_key_probe
  changed_when: false
  failed_when: false
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config

- name: Resolve the Cleanuparr API key
  # A vault entry still wins, so the key can be pinned in the repo instead.
  ansible.builtin.set_fact:
    cleanuparr_key: >-
      {{
        (media_secrets | default({})).cleanuparr
        | default(cleanuparr_key_probe.stdout | default('') | trim, true)
      }}
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config

- name: Record Cleanuparr as unwired when no API key is available
  ansible.builtin.set_fact:
    media_wiring_failures: >-
      {{
        media_wiring_failures
        + ['cleanuparr: no API key. Copy it from Settings -> Account -> API Key
            into vault_media_api_keys.cleanuparr and re-run with
            --tags media_config.']
      }}
  when: cleanuparr_key | length == 0
  tags:
    - media
    - media_acquisition
    - media_config

- name: Wire Cleanuparr
  when: cleanuparr_key | length > 0
  tags:
    - media
    - media_acquisition
    - media_config
  block:
    - name: Define the Cleanuparr API endpoint
      # Through Traefik with a Host header, like every other app here. The
      # /api prefix is served by the cleanuparr-api router, which carries no
      # forward-auth middleware, so an X-Api-Key request is not intercepted
      # by Authelia and bounced to a login page.
      ansible.builtin.set_fact:
        cleanuparr_url: "{{ media_api_base }}/api/configuration"
        # The download cleaner's per-client features are NOT under
        # /api/configuration -- each has its own controller, keyed by the
        # download client id. Hence a second root.
        cleanuparr_api: "{{ media_api_base }}/api"
        cleanuparr_headers:
          Host: "cleanuparr.{{ frey.local_domain }}"
          X-Api-Key: "{{ cleanuparr_key }}"
      no_log: true

    - name: Wait for the Cleanuparr API to become available
      ansible.builtin.uri:
        url: "{{ media_api_base }}/api/auth/status"
        method: GET
        headers:
          Host: "cleanuparr.{{ frey.local_domain }}"
        status_code: 200
        timeout: "{{ media_acquisition.configure.api_timeout }}"
      register: cleanuparr_ready
      retries: "{{ media_acquisition.configure.api_retries }}"
      delay: "{{ media_acquisition.configure.api_delay }}"
      until: cleanuparr_ready.status | default(0) == 200
      failed_when: false
      changed_when: false

    - name: Record Cleanuparr as unwired when its API never answered
      ansible.builtin.set_fact:
        media_wiring_failures: "{{ media_wiring_failures + ['cleanuparr: API never answered'] }}"
      when: cleanuparr_ready.status | default(0) != 200

    - name: Configure Cleanuparr
      when: cleanuparr_ready.status | default(0) == 200
      block:
        # ----------------------------------------------------------------------
        # GENERAL
        # ----------------------------------------------------------------------
        - name: Read the Cleanuparr general configuration
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/general"
            method: GET
            headers: "{{ cleanuparr_headers }}"
            status_code: 200
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_general
          changed_when: false
          no_log: true

        - name: Define the desired Cleanuparr general configuration
          ansible.builtin.set_fact:
            cleanuparr_general_want: >-
              {{
                cleanuparr_general.json | combine({
                  'statusCheckEnabled': media_acquisition.cleanuparr_wiring.general.status_check_enabled,
                  'displaySupportBanner': media_acquisition.cleanuparr_wiring.general.display_support_banner,
                  'httpCertificateValidation':
                    media_acquisition.cleanuparr_wiring.general.http_certificate_validation,
                }, recursive=True)
              }}

        - name: Align the Cleanuparr general configuration
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/general"
            method: PUT
            headers: "{{ cleanuparr_headers }}"
            body_format: json
            body: "{{ cleanuparr_general_want }}"
            status_code: [200, 204]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          when: cleanuparr_general_want != cleanuparr_general.json
          no_log: true

        # ----------------------------------------------------------------------
        # DOWNLOAD CLIENT
        # ----------------------------------------------------------------------
        - name: Read the Cleanuparr download clients
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/download_client"
            method: GET
            headers: "{{ cleanuparr_headers }}"
            status_code: 200
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_clients
          changed_when: false
          no_log: true

        - name: Register qBittorrent with Cleanuparr
          # Username and password, never apiKey: Cleanuparr validates that it
          # was handed one or the other and rejects a payload carrying both.
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/download_client"
            method: POST
            headers: "{{ cleanuparr_headers }}"
            body_format: json
            body:
              enabled: true
              name: "{{ media_acquisition.cleanuparr_wiring.download_client.name }}"
              typeName: "{{ media_acquisition.cleanuparr_wiring.download_client.type_name }}"
              host: "{{ media_acquisition.cleanuparr_wiring.download_client.host }}"
              username: "{{ media_acquisition.services.qbittorrent.web_username }}"
              password: "{{ media_secrets.qbittorrent_password }}"
              urlBase: ""
            status_code: [200, 201]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          when:
            - media_acquisition.services.qbittorrent.enabled | bool
            - media_acquisition.cleanuparr_wiring.download_client.name
              not in (cleanuparr_clients.json.clients | default([]) | map(attribute='name') | list)
          no_log: true

        # ----------------------------------------------------------------------
        # THE *ARR APPLICATIONS
        # ----------------------------------------------------------------------
        - name: Read the configured Cleanuparr application instances
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/{{ item.key }}"
            method: GET
            headers: "{{ cleanuparr_headers }}"
            status_code: 200
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_arrs
          changed_when: false
          no_log: true
          loop: "{{ media_acquisition.cleanuparr_wiring.instances | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when: media_acquisition.services[item.key].enabled | bool

        - name: Register the *arr applications with Cleanuparr
          # One instance per application, named after it. Cleanuparr reaches
          # them on the stack's internal network by container hostname, which
          # is why no Host header or Traefik route is involved here.
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/{{ item.item.key }}/instances"
            method: POST
            headers: "{{ cleanuparr_headers }}"
            body_format: json
            # Built as one Jinja expression so `version` stays a JSON number.
            # Written as an ordinary YAML mapping its value templates to the
            # string "4", and Cleanuparr rejects that with a 400.
            body: >-
              {{
                {
                  'name': item.item.key,
                  'url': 'http://' ~ media_acquisition.services[item.item.key].hostname
                         ~ ':' ~ media_acquisition.services[item.item.key].port,
                  'apiKey': media_secrets[item.item.key],
                  'version': item.item.value.version | int,
                  'enabled': true,
                }
              }}
            status_code: [200, 201]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          loop: "{{ cleanuparr_arrs.results | default([]) }}"
          loop_control:
            label: "{{ item.item.key | default('skipped') }}"
          when:
            - not (item.skipped | default(false))
            - item.item.key not in (item.json.instances | default([]) | map(attribute='name') | list)
          no_log: true

        # ----------------------------------------------------------------------
        # JOBS
        #
        # A fresh install ships with every strike counter at 0, which disables
        # that category -- so the container runs, reports healthy, and cleans
        # up nothing at all until these are set.
        # ----------------------------------------------------------------------
        # ----------------------------------------------------------------------
        # DEAD TORRENTS
        #
        # TWO ENDPOINTS, BOTH REQUIRED, both keyed by the download client id:
        # dead-torrent-config only TAGS a torrent, and a seeding rule matching
        # that tag is what removes it. Configure one without the other and
        # either nothing is tagged or things are tagged and never removed.
        # Neither lives under /api/configuration/download_cleaner, which is
        # why a PUT to that section alone leaves both untouched.
        #
        # The counts and thresholds, and why ratio is useless as a trigger
        # here, are explained beside the values in defaults/main.yml.
        # ----------------------------------------------------------------------
        - name: Re-read the Cleanuparr download clients
          # Re-read rather than reuse the earlier register: if qBittorrent was
          # only registered a few tasks ago, the id we need did not exist yet.
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/download_client"
            method: GET
            headers: "{{ cleanuparr_headers }}"
            status_code: 200
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_clients_after
          changed_when: false
          no_log: true

        - name: Resolve the Cleanuparr download client id and categories
          ansible.builtin.set_fact:
            cleanuparr_client_id: >-
              {{
                (cleanuparr_clients_after.json.clients | default([]))
                | selectattr('name', 'equalto',
                             media_acquisition.cleanuparr_wiring.download_client.name)
                | map(attribute='id') | first | default('')
              }}
            # Derived from this role's own services so the two cannot drift,
            # plus the categories owned by other modules.
            cleanuparr_categories: >-
              {{
                (media_acquisition.services | dict2items
                 | selectattr('value.enabled', 'truthy')
                 | selectattr('value.category', 'defined')
                 | map(attribute='value.category') | list
                 + media_acquisition.cleanuparr_wiring.download_cleaner.extra_categories)
                | unique | sort
              }}

        - name: Record Cleanuparr as unwired when the download client has no id
          ansible.builtin.set_fact:
            media_wiring_failures: >-
              {{
                media_wiring_failures
                + ['cleanuparr: download client id not found, dead-torrent rules skipped']
              }}
          when: cleanuparr_client_id | length == 0

        - name: Read the Cleanuparr dead-torrent configuration
          ansible.builtin.uri:
            url: "{{ cleanuparr_api }}/dead-torrent-config/{{ cleanuparr_client_id }}"
            method: GET
            headers: "{{ cleanuparr_headers }}"
            status_code: [200, 404]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_dead
          changed_when: false
          failed_when: false
          when: cleanuparr_client_id | length > 0
          no_log: true

        - name: Define the desired Cleanuparr dead-torrent configuration
          ansible.builtin.set_fact:
            cleanuparr_dead_want: >-
              {{
                {
                  'enabled': dead.enabled | bool,
                  'targetCategory': dead.tag,
                  'useTag': dead.use_tag | bool,
                  'maxStrikes': dead.max_strikes | int,
                  'categories': cleanuparr_categories,
                }
              }}
          vars:
            dead: "{{ media_acquisition.cleanuparr_wiring.download_cleaner.dead_torrents }}"
          when: cleanuparr_client_id | length > 0

        - name: Align the Cleanuparr dead-torrent configuration
          ansible.builtin.uri:
            url: "{{ cleanuparr_api }}/dead-torrent-config/{{ cleanuparr_client_id }}"
            method: PUT
            headers: "{{ cleanuparr_headers }}"
            body_format: json
            body: "{{ cleanuparr_dead_want }}"
            status_code: [200, 204]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          vars:
            live: "{{ cleanuparr_dead.json | default({}) }}"
          register: cleanuparr_dead_set
          changed_when: cleanuparr_dead_set.status | default(0) in [200, 204]
          failed_when: false
          when:
            - cleanuparr_client_id | length > 0
            # Only when it actually differs, so a converged run reports no change.
            - >-
              (live.enabled | default(false) | bool) != cleanuparr_dead_want.enabled
              or (live.useTag | default(false) | bool) != cleanuparr_dead_want.useTag
              or (live.targetCategory | default('')) != cleanuparr_dead_want.targetCategory
              or (live.maxStrikes | default(0) | int) != cleanuparr_dead_want.maxStrikes
              or (live.categories | default([]) | sort) != cleanuparr_categories

        - name: Read the Cleanuparr seeding rules
          ansible.builtin.uri:
            url: "{{ cleanuparr_api }}/seeding-rules/{{ cleanuparr_client_id }}"
            method: GET
            headers: "{{ cleanuparr_headers }}"
            status_code: [200, 404]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_rules
          changed_when: false
          failed_when: false
          when: cleanuparr_client_id | length > 0
          no_log: true

        - name: Define the desired Cleanuparr dead-torrent seeding rule
          ansible.builtin.set_fact:
            cleanuparr_rule_want: >-
              {{
                {
                  'name': rule.name,
                  'categories': cleanuparr_categories,
                  'tagsAny': [dead.tag],
                  'tagsAll': [],
                  'trackerPatterns': [],
                  'privacyType': rule.privacy_type,
                  'maxRatio': rule.max_ratio | float,
                  'minSeedTime': rule.min_seed_time | float,
                  'maxSeedTime': rule.max_seed_time | float,
                  'minSeeders': rule.min_seeders | int,
                  'maxInactiveDays': -1,
                  'deleteSourceFiles': rule.delete_source_files | bool,
                  'action': rule.action,
                }
              }}
          vars:
            rule: "{{ media_acquisition.cleanuparr_wiring.download_cleaner.seeding_rule }}"
            dead: "{{ media_acquisition.cleanuparr_wiring.download_cleaner.dead_torrents }}"
          when: cleanuparr_client_id | length > 0

        - name: Create the Cleanuparr dead-torrent seeding rule
          ansible.builtin.uri:
            url: "{{ cleanuparr_api }}/seeding-rules/{{ cleanuparr_client_id }}"
            method: POST
            headers: "{{ cleanuparr_headers }}"
            body_format: json
            body: "{{ cleanuparr_rule_want }}"
            status_code: [200, 201, 204]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_rule_created
          changed_when: cleanuparr_rule_created.status | default(0) in [200, 201, 204]
          failed_when: false
          when:
            - cleanuparr_client_id | length > 0
            - cleanuparr_rule_want.name not in
              (cleanuparr_rules.json | default([]) | map(attribute='name') | list)

        - name: Update the Cleanuparr dead-torrent seeding rule in place
          # Addressed by RULE id, not client id - a different route shape from
          # every other endpoint in this file.
          ansible.builtin.uri:
            url: "{{ cleanuparr_api }}/seeding-rules/{{ existing.id }}"
            method: PUT
            headers: "{{ cleanuparr_headers }}"
            body_format: json
            body: "{{ cleanuparr_rule_want }}"
            status_code: [200, 204]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          vars:
            existing: >-
              {{
                (cleanuparr_rules.json | default([]))
                | selectattr('name', 'equalto', cleanuparr_rule_want.name)
                | first | default({})
              }}
          register: cleanuparr_rule_updated
          changed_when: cleanuparr_rule_updated.status | default(0) in [200, 204]
          failed_when: false
          when:
            - cleanuparr_client_id | length > 0
            - existing.id is defined
            - >-
              (existing.tagsAny | default([]) | sort) != (cleanuparr_rule_want.tagsAny | sort)
              or (existing.categories | default([]) | sort) != cleanuparr_categories
              or (existing.maxSeedTime | default(-1) | float) != cleanuparr_rule_want.maxSeedTime
              or (existing.maxRatio | default(-1) | float) != cleanuparr_rule_want.maxRatio
              or (existing.minSeeders | default(-1) | int) != cleanuparr_rule_want.minSeeders
              or (existing.action | default('')) != cleanuparr_rule_want.action
              or (existing.privacyType | default('')) != cleanuparr_rule_want.privacyType
              or (existing.deleteSourceFiles | default(false) | bool)
                 != cleanuparr_rule_want.deleteSourceFiles

        - name: Read the Cleanuparr download cleaner configuration
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/download_cleaner"
            method: GET
            headers: "{{ cleanuparr_headers }}"
            status_code: 200
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_dlclean
          changed_when: false
          no_log: true

        - name: Enable the Cleanuparr download cleaner
          # Last of this group on purpose: enabled before the rule exists, it
          # would tag dead torrents and then leave them tagged forever.
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/download_cleaner"
            method: PUT
            headers: "{{ cleanuparr_headers }}"
            body_format: json
            body: >-
              {{
                cleanuparr_dlclean.json | combine({
                  'enabled': cleaner.enabled | bool,
                  'cronExpression': cleaner.cron_expression,
                })
              }}
            status_code: [200, 204]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          vars:
            cleaner: "{{ media_acquisition.cleanuparr_wiring.download_cleaner }}"
          register: cleanuparr_dlclean_set
          changed_when: cleanuparr_dlclean_set.status | default(0) in [200, 204]
          failed_when: false
          when: >-
            (cleanuparr_dlclean.json.enabled | default(false) | bool) != (cleaner.enabled | bool)
            or (cleanuparr_dlclean.json.cronExpression | default('')) != cleaner.cron_expression

        # ----------------------------------------------------------------------
        # MALWARE BLOCKER
        #
        # Public trackers occasionally carry an executable dressed up as an
        # episode. This checks each download's file list against an upstream
        # blacklist and removes it before it finishes. Off by default upstream.
        # ----------------------------------------------------------------------
        - name: Read the Cleanuparr malware blocker configuration
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/malware_blocker"
            method: GET
            headers: "{{ cleanuparr_headers }}"
            status_code: 200
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_malware
          changed_when: false
          no_log: true

        - name: Define the desired Cleanuparr malware blocker configuration
          ansible.builtin.set_fact:
            cleanuparr_malware_want: >-
              {{
                cleanuparr_malware.json | combine({
                  'enabled': mb.enabled | bool,
                  'cronExpression': mb.cron_expression,
                  'deleteIfAnyFileBlocked': mb.delete_if_any_file_blocked | bool,
                })
              }}
          vars:
            mb: "{{ media_acquisition.cleanuparr_wiring.malware_blocker }}"

        - name: Add the per-application blocklists to the Cleanuparr malware blocker
          ansible.builtin.set_fact:
            cleanuparr_malware_want: >-
              {{
                cleanuparr_malware_want | combine({
                  item: {
                    'enabled': true,
                    'blocklistType': mb.blocklist_type,
                    'blocklistPath': mb.blocklist_path,
                  }
                }, recursive=True)
              }}
          loop: "{{ media_acquisition.cleanuparr_wiring.malware_blocker.apps }}"
          vars:
            mb: "{{ media_acquisition.cleanuparr_wiring.malware_blocker }}"

        - name: Align the Cleanuparr malware blocker
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/malware_blocker"
            method: PUT
            headers: "{{ cleanuparr_headers }}"
            body_format: json
            body: "{{ cleanuparr_malware_want }}"
            status_code: [200, 204]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_malware_set
          changed_when: cleanuparr_malware_set.status | default(0) in [200, 204]
          failed_when: false
          when: cleanuparr_malware_want != cleanuparr_malware.json

        - name: Read the Cleanuparr queue cleaner configuration
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/queue_cleaner"
            method: GET
            headers: "{{ cleanuparr_headers }}"
            status_code: 200
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_queue
          changed_when: false
          no_log: true

        - name: Define the desired Cleanuparr queue cleaner configuration
          ansible.builtin.set_fact:
            cleanuparr_queue_want: >-
              {{
                cleanuparr_queue.json | combine({
                  'enabled': media_acquisition.cleanuparr_wiring.queue_cleaner.enabled,
                  'cronExpression': media_acquisition.cleanuparr_wiring.queue_cleaner.cron_expression,
                  'downloadingMetadataMaxStrikes':
                    media_acquisition.cleanuparr_wiring.queue_cleaner.downloading_metadata_max_strikes,
                  'failedImport': {
                    'maxStrikes': media_acquisition.cleanuparr_wiring.queue_cleaner.failed_import_max_strikes,
                    'patternMode': media_acquisition.cleanuparr_wiring.queue_cleaner.failed_import_pattern_mode,
                  },
                  'errored': {
                    'maxStrikes': media_acquisition.cleanuparr_wiring.queue_cleaner.errored_max_strikes,
                  },
                }, recursive=True)
              }}

        - name: Align the Cleanuparr queue cleaner
          ansible.builtin.uri:
            url: "{{ cleanuparr_url }}/queue_cleaner"
            method: PUT
            headers: "{{ cleanuparr_headers }}"
            body_format: json
            body: "{{ cleanuparr_queue_want }}"
            status_code: [200, 204]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          when: cleanuparr_queue_want != cleanuparr_queue.json
          no_log: true

        # ----------------------------------------------------------------------
        # SINGLE SIGN-ON
        #
        # Cleanuparr speaks OIDC itself rather than trusting the proxy, so its
        # /api keeps requiring the API key while the browser gets one login.
        #
        # The client secret is identity's, read from the file that role
        # persists it in -- the same route roles/monitoring/ takes to Grafana's
        # secret, and the reason both are read from a file rather than a
        # variable is that a role's defaults are not in scope outside it.
        # ----------------------------------------------------------------------
        - name: Check for the identity secret file
          ansible.builtin.stat:
            path: "{{ media_acquisition.cleanuparr_wiring.identity_key_file }}"
          register: cleanuparr_identity_stat

        - name: Read the identity secrets
          ansible.builtin.slurp:
            src: "{{ media_acquisition.cleanuparr_wiring.identity_key_file }}"
          register: cleanuparr_identity_blob
          when: cleanuparr_identity_stat.stat.exists
          no_log: true

        - name: Pick up the Cleanuparr OIDC client secret
          ansible.builtin.set_fact:
            cleanuparr_oidc_secret: >-
              {{
                (
                  (cleanuparr_identity_blob.content | b64decode | from_json)
                  | default({}, true)
                ).cleanuparr_oidc_secret | default('', true)
                if cleanuparr_identity_stat.stat.exists
                else ''
              }}
          no_log: true

        - name: Decide whether Cleanuparr uses single sign-on
          ansible.builtin.set_fact:
            cleanuparr_use_oidc: >-
              {{
                (identity_services | default({})).cleanuparr is defined
                and (identity_services | default({})).cleanuparr.auth | default('') == 'oidc'
                and cleanuparr_oidc_secret | length > 0
              }}

        - name: Warn when Cleanuparr single sign-on cannot be configured
          ansible.builtin.debug:
            msg: >-
              Cleanuparr is set to auth: oidc but no client secret was found in
              {{ media_acquisition.cleanuparr_wiring.identity_key_file }}.
              Deploy the identity module first, then re-run with
              --tags media_config. Cleanuparr's local login still works.
          when:
            - (identity_services | default({})).cleanuparr.auth | default('') == 'oidc'
            - not (cleanuparr_use_oidc | bool)

        - name: Read the Cleanuparr OIDC configuration
          ansible.builtin.uri:
            url: "{{ media_api_base }}/api/account/oidc"
            method: GET
            headers: "{{ cleanuparr_headers }}"
            status_code: 200
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          register: cleanuparr_oidc
          changed_when: false
          when: cleanuparr_use_oidc | bool
          no_log: true

        - name: Align the Cleanuparr OIDC configuration
          # Compared field by field rather than as a whole object, because the
          # GET masks clientSecret as bullet characters: a whole-object compare
          # would differ on every run and rewrite the settings forever.
          #
          # exclusiveMode and authorizedSubject are deliberately NOT asserted.
          # The subject is set by linking an account from the UI, and
          # overwriting either from here would undo that link -- or, worse,
          # enable exclusive mode with nothing linked and lock the UI.
          ansible.builtin.uri:
            url: "{{ media_api_base }}/api/account/oidc"
            method: PUT
            headers: "{{ cleanuparr_headers }}"
            body_format: json
            body: >-
              {{
                {
                  'enabled': true,
                  'issuerUrl': 'https://' ~ (identity_hosts.auth | default('auth'))
                               ~ '.' ~ frey.service_domain,
                  'clientId': 'cleanuparr',
                  'clientSecret': cleanuparr_oidc_secret,
                  'scopes': media_acquisition.cleanuparr_wiring.oidc.scopes,
                  'providerName': media_acquisition.cleanuparr_wiring.oidc.provider_name,
                  'redirectUrl': 'https://cleanuparr.' ~ frey.service_domain,
                  'authorizedSubject': cleanuparr_oidc.json.authorizedSubject | default(''),
                  'exclusiveMode': cleanuparr_oidc.json.exclusiveMode | default(false),
                }
              }}
            status_code: [200, 204]
            timeout: "{{ media_acquisition.configure.api_timeout }}"
          when:
            - cleanuparr_use_oidc | bool
            - >-
              not cleanuparr_oidc.json.enabled | default(false)
              or cleanuparr_oidc.json.issuerUrl | default('')
                 != 'https://' ~ (identity_hosts.auth | default('auth')) ~ '.' ~ frey.service_domain
              or cleanuparr_oidc.json.clientId | default('') != 'cleanuparr'
              or cleanuparr_oidc.json.scopes | default('')
                 != media_acquisition.cleanuparr_wiring.oidc.scopes
              or cleanuparr_oidc.json.providerName | default('')
                 != media_acquisition.cleanuparr_wiring.oidc.provider_name
              or cleanuparr_oidc.json.redirectUrl | default('')
                 != 'https://cleanuparr.' ~ frey.service_domain
          no_log: true
