---
# ==============================================================================
# qBittorrent
#
# Preferences and categories are set through the WebUI API rather than by
# editing qBittorrent.conf, because the API is safe against a running
# container and the config file is not: qBittorrent holds preferences in
# memory and writes them back on exit, so an edited file is silently
# overwritten.
#
# The archived role learned this the hard way - twenty lineinfile tasks, all
# with ignore_errors, against a file the app owned.
#
# CATEGORIES ARE THE HARDLINK CONTRACT
#
# Each category's save path sits under /data/torrents, and the *arrs see the
# same /data mount. Same filesystem, so an import is a hardlink: the torrent
# keeps seeding from the original path while the library points at the same
# bytes under /data/media. One copy on disk.
# ==============================================================================

- name: Log in to the qBittorrent WebUI API
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/v2/auth/login"
    method: POST
    headers:
      Host: "qbittorrent.{{ frey.local_domain }}"
      Referer: "http://qbittorrent.{{ frey.local_domain }}"
    body_format: form-urlencoded
    body:
      username: "{{ media_acquisition.services.qbittorrent.web_username }}"
      password: "{{ media_secrets.qbittorrent_password }}"
    status_code: 200
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  register: qbt_login
  retries: "{{ media_acquisition.configure.api_retries }}"
  delay: "{{ media_acquisition.configure.api_delay }}"
  until: qbt_login is succeeded
  failed_when: false
  changed_when: false
  no_log: true

- name: Record a qBittorrent login failure
  ansible.builtin.set_fact:
    media_wiring_failures: "{{ media_wiring_failures + ['qbittorrent: WebUI login failed'] }}"
  when: qbt_login.status is not defined or qbt_login.status != 200

- name: Capture the qBittorrent session cookie
  ansible.builtin.set_fact:
    qbt_cookie: "{{ qbt_login.set_cookie | default('') }}"
  when: qbt_login.status is defined and qbt_login.status == 200
  no_log: true

- name: Read current qBittorrent preferences
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/v2/app/preferences"
    method: GET
    headers:
      Host: "qbittorrent.{{ frey.local_domain }}"
      Cookie: "{{ qbt_cookie }}"
    return_content: true
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  register: qbt_prefs
  failed_when: false
  changed_when: false
  when: qbt_cookie is defined
  no_log: true

- name: Apply qBittorrent preferences
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/v2/app/setPreferences"
    method: POST
    headers:
      Host: "qbittorrent.{{ frey.local_domain }}"
      Cookie: "{{ qbt_cookie }}"
      Referer: "http://qbittorrent.{{ frey.local_domain }}"
    body_format: form-urlencoded
    body:
      json: "{{ qbt_desired_prefs | to_json }}"
    status_code: 200
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  vars:
    qbt_desired_prefs:
      save_path: /data/torrents
      temp_path_enabled: false
      # Categories own their save paths; without this they are ignored.
      auto_tmm_enabled: true
      category_changed_tmm_enabled: true
      save_path_changed_tmm_enabled: true
      torrent_changed_tmm_enabled: true
      listen_port: "{{ media_acquisition.services.qbittorrent.listen_port }}"
      random_port: false
      upnp: false
      dht: true
      pex: true
      lsd: true
      # No proxy: this deployment runs without a VPN by choice.
      proxy_type: 0
      proxy_torrents_only: false
      # Throttled values used by the uplink gating script on metered links.
      alt_dl_limit: "{{ media_acquisition.uplink_gating.metered_down_limit_kib * 1024 }}"
      alt_up_limit: "{{ media_acquisition.uplink_gating.metered_up_limit_kib * 1024 }}"
      # Accept any Host header; Traefik presents qbittorrent.frey.
      web_ui_host_header_validation_enabled: false
      web_ui_csrf_protection_enabled: false
      bypass_local_auth: true
  register: qbt_set_prefs
  failed_when: false
  # The API has no "did anything change" response, so compare what we asked
  # for against what was already set rather than reporting changed every run.
  changed_when:
    - qbt_prefs.content is defined
    - (qbt_prefs.content | from_json).save_path | default('') != '/data/torrents'
      or not (qbt_prefs.content | from_json).auto_tmm_enabled | default(false)
  when: qbt_cookie is defined
  no_log: true

- name: Record a qBittorrent preferences failure
  ansible.builtin.set_fact:
    media_wiring_failures: "{{ media_wiring_failures + ['qbittorrent: setPreferences failed'] }}"
  when:
    - qbt_cookie is defined
    - qbt_set_prefs.status is not defined or qbt_set_prefs.status != 200

- name: Read existing qBittorrent categories
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/v2/torrents/categories"
    method: GET
    headers:
      Host: "qbittorrent.{{ frey.local_domain }}"
      Cookie: "{{ qbt_cookie }}"
    return_content: true
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  register: qbt_categories
  failed_when: false
  changed_when: false
  when: qbt_cookie is defined
  no_log: true

- name: Create qBittorrent categories for each Servarr app
  ansible.builtin.uri:
    url: "{{ media_api_base }}/api/v2/torrents/createCategory"
    method: POST
    headers:
      Host: "qbittorrent.{{ frey.local_domain }}"
      Cookie: "{{ qbt_cookie }}"
      Referer: "http://qbittorrent.{{ frey.local_domain }}"
    body_format: form-urlencoded
    body:
      category: "{{ item.value.category }}"
      savePath: "{{ item.value.torrent_dir }}"
    status_code: [200, 409]
    timeout: "{{ media_acquisition.configure.api_timeout }}"
  loop: "{{ media_acquisition.services | dict2items | selectattr('value.enabled') | selectattr('value.torrent_dir', 'defined') | list }}"
  loop_control:
    label: "{{ item.value.category }}"
  when:
    - qbt_cookie is defined
    - qbt_categories.content is defined
    - item.value.category not in (qbt_categories.content | from_json)
  failed_when: false
  register: qbt_create_categories

- name: Record qBittorrent category failures
  ansible.builtin.set_fact:
    media_wiring_failures: >-
      {{
        media_wiring_failures
        + (qbt_create_categories.results | default([])
           | rejectattr('skipped', 'defined')
           | selectattr('status', 'defined')
           | rejectattr('status', 'in', [200, 409])
           | map(attribute='item.value.category')
           | map('regex_replace', '^(.*)$', 'qbittorrent: category \1 not created')
           | list)
      }}
  when: qbt_create_categories.results is defined
