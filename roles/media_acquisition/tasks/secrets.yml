---
# ==============================================================================
# SECRETS
#
# Every *arr app is seeded with an API key that Ansible chooses, BEFORE the
# container first starts. That inverts the usual order - normally the app
# invents a key and you copy it out of the UI by hand - and it is what makes
# the rest of the wiring possible without any clicking.
#
# Keys are generated once and persisted on the Pi at mode 0600. A rebuild
# from scratch generates fresh keys, which is harmless because the same run
# re-applies every connection that uses them.
#
# Set vault_media_api_keys in inventory/group_vars/all/secrets.yml to pin any
# of them instead; vault values always win.
# ==============================================================================

- name: Check for the persisted media secret file
  ansible.builtin.stat:
    path: "{{ media_acquisition.configure.key_file }}"
  register: media_acquisition_key_stat
  tags:
    - media
    - media_acquisition
    - media_config

- name: Read persisted media secrets
  ansible.builtin.slurp:
    src: "{{ media_acquisition.configure.key_file }}"
  register: media_acquisition_key_blob
  when: media_acquisition_key_stat.stat.exists
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config

- name: Load persisted media secrets
  ansible.builtin.set_fact:
    media_secrets: >-
      {{
        (media_acquisition_key_blob.content | b64decode | from_json)
        if media_acquisition_key_stat.stat.exists
        else {}
      }}
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config

- name: Generate any missing media secrets
  # 32 hex characters: what the Servarr apps use for their own keys, so
  # nothing downstream has to care that these were not self-generated.
  ansible.builtin.set_fact:
    media_secrets: >-
      {{
        media_secrets
        | combine({
            item: media_secrets[item]
                  | default(lookup('password', '/dev/null',
                                   chars=['hexdigits'], length=32) | lower)
          })
      }}
  loop: "{{ media_acquisition.configure.secret_keys }}"
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config

- name: Apply vault overrides over generated media secrets
  ansible.builtin.set_fact:
    media_secrets: "{{ media_secrets | combine(vault_media_api_keys | default({}, true)) }}"
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config

- name: Persist media secrets
  ansible.builtin.copy:
    content: "{{ media_secrets | to_nice_json }}\n"
    dest: "{{ media_acquisition.configure.key_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config
