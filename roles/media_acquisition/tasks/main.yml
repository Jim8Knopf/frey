---
# ==============================================================================
# MEDIA ACQUISITION
#
# Order matters here:
#   1. storage   - the /data tree and appdata must exist before any container
#                  mounts them, or Docker creates root-owned directories.
#   2. secrets   - API keys must be known before the apps first start, which
#                  is what makes step 5 possible without any manual clicking.
#   3. seeds     - config files written while nothing is running.
#   4. deploy    - containers.
#   5. configure - wiring, over each app's REST API against live containers.
# ==============================================================================

- name: Validate media acquisition configuration
  ansible.builtin.assert:
    that:
      - media.data_dir | length > 0
      - media.appdata_dir | length > 0
      - media.network.name | length > 0
      - media_acquisition.stack_dir | length > 0
      # The internal container network must never overlap FreyHub's LAN. The
      # archived media role put it on 10.20.0.0/24 - the access point's own
      # subnet - which would have taken down the one service that must always
      # survive. Fail loudly rather than deploy that again.
      - not media.network.subnet.startswith('10.20.0.')
      - media_acquisition.uplink_gating.mode in ['pause', 'stop', 'off']
      - media_acquisition.auth.method in ['External', 'Forms']
    fail_msg: >-
      media_acquisition configuration is invalid. In particular the internal
      Docker network ({{ media.network.subnet }}) must not overlap FreyHub's
      {{ network_gateway.downstream.network_cidr }}.
  tags:
    - media
    - media_acquisition
    - media_config

- name: Prepare media storage
  ansible.builtin.include_tasks: storage.yml
  tags:
    - media
    - media_acquisition

- name: Resolve media secrets
  ansible.builtin.include_tasks: secrets.yml
  tags:
    - media
    - media_acquisition
    - media_config

# ------------------------------------------------------------------------------
# SEED CONFIGURATION
# ------------------------------------------------------------------------------

- name: Seed Servarr configuration files
  ansible.builtin.template:
    src: arr-config.xml.j2
    dest: "{{ media.appdata_dir }}/{{ item.key }}/config.xml"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0640"
    # Never overwrite: once the app has started, this file is its own.
    force: false
  loop: "{{ media_acquisition.services | dict2items | selectattr('value.enabled') | selectattr('value.env_prefix', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  tags:
    - media
    - media_acquisition

- name: Compute qBittorrent WebUI password hash
  # Runs on the Pi; the password is passed in the environment, not argv, so it
  # does not appear in the process list. Deterministic for a given password,
  # so re-runs do not churn the config file.
  ansible.builtin.script:
    cmd: files/qbt_pbkdf2.py
  environment:
    QBT_PASSWORD: "{{ media_secrets.qbittorrent_password }}"
  register: media_qbt_hash
  changed_when: false
  check_mode: false
  no_log: true
  when: media_acquisition.services.qbittorrent.enabled
  tags:
    - media
    - media_acquisition
    - media_config

- name: Expose the qBittorrent password hash to templates
  ansible.builtin.set_fact:
    qbittorrent_password_hash: "{{ media_qbt_hash.stdout | trim }}"
  when:
    - media_acquisition.services.qbittorrent.enabled
    - media_qbt_hash.stdout is defined
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config

- name: Check whether qBittorrent already has a configuration
  # Recorded BEFORE the seed template runs, so the next task can tell "the
  # app has config of its own that may need its password corrected" apart
  # from "we just wrote the config and it already has the right password".
  ansible.builtin.stat:
    path: "{{ media.appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
  register: media_qbt_conf_stat
  when: media_acquisition.services.qbittorrent.enabled
  tags:
    - media
    - media_acquisition
    - media_config

- name: Seed qBittorrent configuration
  ansible.builtin.template:
    src: qBittorrent.conf.j2
    dest: "{{ media.appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0640"
    force: false
  when:
    - media_acquisition.services.qbittorrent.enabled
    - qbittorrent_password_hash is defined
  no_log: true
  tags:
    - media
    - media_acquisition

- name: Keep the stored qBittorrent password in step with Ansible
  # The seed file above is never overwritten, so without this a password
  # change in the vault would leave Ansible locked out of the API it needs
  # for wiring and for download gating.
  ansible.builtin.lineinfile:
    path: "{{ media.appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
    regexp: '^WebUI\\Password_PBKDF2='
    line: 'WebUI\Password_PBKDF2="{{ qbittorrent_password_hash }}"'
    insertafter: '^\[Preferences\]'
  when:
    - media_acquisition.services.qbittorrent.enabled
    - media_acquisition.services.qbittorrent.enforce_password
    - qbittorrent_password_hash is defined
    # Only for a config that already existed. A freshly seeded one was just
    # written with the correct hash, and in check mode it was not written at
    # all - so touching it here would fail on a file that does not exist.
    - media_qbt_conf_stat.stat.exists | default(false)
  no_log: true
  notify: Restart qbittorrent
  tags:
    - media
    - media_acquisition
    - media_config

- name: Seed Bazarr configuration directory
  ansible.builtin.file:
    path: "{{ media.appdata_dir }}/bazarr/config"
    state: directory
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0775"
  when: media_acquisition.services.bazarr.enabled
  tags:
    - media
    - media_acquisition

- name: Seed Bazarr configuration
  ansible.builtin.template:
    src: bazarr-config.yaml.j2
    dest: "{{ media.appdata_dir }}/bazarr/config/config.yaml"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0640"
    force: false
  when: media_acquisition.services.bazarr.enabled
  no_log: true
  tags:
    - media
    - media_acquisition

- name: Deploy Recyclarr configuration
  # Ansible owns this one outright: it is the config-as-code definition of the
  # quality profiles, so drift should be corrected, not preserved.
  ansible.builtin.template:
    src: recyclarr.yml.j2
    dest: "{{ media.appdata_dir }}/recyclarr/recyclarr.yml"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0640"
  when: media_acquisition.services.recyclarr.enabled
  no_log: true
  notify: Restart recyclarr
  tags:
    - media
    - media_acquisition
    - media_config

# ------------------------------------------------------------------------------
# DEPLOY
# ------------------------------------------------------------------------------

- name: Create the internal media network
  community.docker.docker_network:
    name: "{{ media.network.name }}"
    driver: bridge
    state: present
    ipam_config:
      - subnet: "{{ media.network.subnet }}"
  when: not ansible_check_mode
  tags:
    - media
    - media_acquisition

- name: Deploy media acquisition compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ media_acquisition.stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
    validate: "docker compose -f %s config --quiet"
  register: media_acquisition_compose
  tags:
    - media
    - media_acquisition

- name: Start the media acquisition stack
  community.docker.docker_compose_v2:
    project_src: "{{ media_acquisition.stack_dir }}"
    state: present
    remove_orphans: true
    pull: missing
    timeout: 300
  register: media_acquisition_up
  when: not ansible_check_mode
  tags:
    - media
    - media_acquisition

- name: Pull and recreate pinned media acquisition images
  # Deliberate image refresh, separate from a normal deploy.
  #
  # The pins in defaults/main.yml name upstream versions, but linuxserver
  # rebuilds those same tags for base-image security updates. This re-pulls
  # them and recreates anything that moved - run it while you still have a
  # connection, not when you are parked somewhere with none.
  #
  # Self-contained on purpose: it works from the compose file already on disk,
  # so it needs no secrets and no re-render.
  #
  # Gated on an explicit variable rather than a `never` tag. site.yml injects
  # the module's tags into every task in the role, so a `never`-tagged task
  # still matches `--tags media` - and a normal deploy would then force a pull
  # that fails with no uplink. A variable cannot misfire that way.
  community.docker.docker_compose_v2:
    project_src: "{{ media_acquisition.stack_dir }}"
    state: present
    pull: always
    recreate: auto
    timeout: 600
  when:
    - not ansible_check_mode
    - media_update | default(false) | bool
  tags:
    - media
    - media_acquisition
    - media_update

# ------------------------------------------------------------------------------
# UPLINK GATING
# ------------------------------------------------------------------------------

- name: Install the media gating script
  ansible.builtin.template:
    src: frey-media-gate.sh.j2
    dest: /usr/local/bin/frey-media-gate
    owner: root
    group: root
    mode: "0755"
  tags:
    - media
    - media_acquisition
    - media_gating

- name: Ensure the Frey configuration directory exists
  ansible.builtin.file:
    path: /etc/frey
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags:
    - media
    - media_acquisition
    - media_gating

- name: Install media gating credentials
  ansible.builtin.template:
    src: media-gate.env.j2
    dest: /etc/frey/media-gate.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_gating

- name: Install the NetworkManager dispatcher hook for media gating
  ansible.builtin.template:
    src: 90-frey-media-gate.j2
    dest: /etc/NetworkManager/dispatcher.d/90-frey-media-gate
    owner: root
    group: root
    # NetworkManager refuses to run dispatcher scripts that are writable by
    # anyone other than root.
    mode: "0755"
  when: media_acquisition.uplink_gating.mode != 'off'
  tags:
    - media
    - media_acquisition
    - media_gating

- name: Remove the media gating dispatcher hook when gating is off
  ansible.builtin.file:
    path: /etc/NetworkManager/dispatcher.d/90-frey-media-gate
    state: absent
  when: media_acquisition.uplink_gating.mode == 'off'
  tags:
    - media
    - media_acquisition
    - media_gating

- name: Install media gating systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - frey-media-gate.service
    - frey-media-gate.timer
  notify: Reload systemd for media gating
  tags:
    - media
    - media_acquisition
    - media_gating

- name: Apply systemd unit changes
  ansible.builtin.meta: flush_handlers
  tags:
    - media
    - media_acquisition
    - media_gating

- name: Enable the media gating timer
  ansible.builtin.systemd:
    name: frey-media-gate.timer
    enabled: "{{ media_acquisition.uplink_gating.mode != 'off' }}"
    state: "{{ 'started' if media_acquisition.uplink_gating.mode != 'off' else 'stopped' }}"
  # Check mode does not write the unit file, so systemd cannot see a unit to
  # enable and the task would fail on a run that changes nothing.
  when: not ansible_check_mode
  tags:
    - media
    - media_acquisition
    - media_gating

# ------------------------------------------------------------------------------
# WIRING
# ------------------------------------------------------------------------------

- name: Wire the media services together
  ansible.builtin.include_tasks: configure/main.yml
  when:
    - media_acquisition.configure.enabled
    - not ansible_check_mode
  tags:
    - media
    - media_acquisition
    - media_config
