---
- name: Prepare acquisition
  ansible.builtin.import_tasks: prepare.yml

- name: Seed application configuration
  ansible.builtin.import_tasks: seed.yml

- name: Configure the resolver
  ansible.builtin.import_tasks: resolver_config.yml

- name: Deploy the Compose stack
  ansible.builtin.import_tasks: compose.yml

- name: Configure resolver upstream selection
  ansible.builtin.import_tasks: resolver_upstream.yml

- name: Configure uplink gating and audiobook imports
  ansible.builtin.import_tasks: gating.yml

- name: Wire the media services together
  ansible.builtin.include_tasks:
    file: configure/main.yml
    apply:
      tags:
        - media
        - media_acquisition
        - media_config
  when:
    - media_acquisition.configure.enabled
    - not ansible_check_mode
  tags:
    - media
    - media_acquisition
    - media_config
