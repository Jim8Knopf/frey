---
# ==============================================================================
# MEDIA ACQUISITION
#
# Order matters here:
#   1. storage   - the /data tree and appdata must exist before any container
#                  mounts them, or Docker creates root-owned directories.
#   2. secrets   - API keys must be known before the apps first start, which
#                  is what makes step 5 possible without any manual clicking.
#   3. seeds     - config files written while nothing is running.
#   4. deploy    - containers.
#   5. configure - wiring, over each app's REST API against live containers.
# ==============================================================================

- name: Validate media acquisition configuration
  ansible.builtin.assert:
    that:
      - media.data_dir | length > 0
      - media.appdata_dir | length > 0
      - media.network.name | length > 0
      - media_acquisition.stack_dir | length > 0
      # The internal container network must never overlap FreyHub's LAN. The
      # archived media role put it on 10.20.0.0/24 - the access point's own
      # subnet - which would have taken down the one service that must always
      # survive. Fail loudly rather than deploy that again.
      - not media.network.subnet.startswith('10.20.0.')
      - media_acquisition.uplink_gating.mode in ['pause', 'stop', 'off']
      - media_acquisition.auth.method in ['External', 'Forms']
      # The central knobs file must be present, or every image tag and
      # on/off switch silently resolves to nothing.
      - media_versions is defined
      - media_enable is defined
      - media_vpn is defined
    fail_msg: >-
      media_acquisition configuration is invalid. The internal Docker network
      ({{ media.network.subnet }}) must not overlap FreyHub's
      {{ network_gateway.downstream.network_cidr }}, and
      inventory/group_vars/all/media.yml must define media_versions,
      media_enable and media_vpn.
  tags:
    - media
    - media_acquisition
    - media_config

- name: Validate VPN configuration
  # Checked separately so the message can be specific. Turning the tunnel on
  # without credentials must fail here and now, not start an unconfigured
  # Gluetun that blocks all torrent traffic and looks like a broken stack.
  ansible.builtin.assert:
    that:
      - media_vpn.type in ['wireguard', 'openvpn']
      - media_vpn.provider | length > 0
      - >-
        (media_vpn.type == 'wireguard'
         and media_vpn.credentials.wireguard_private_key | length > 0
         and media_vpn.credentials.wireguard_addresses | length > 0)
        or
        (media_vpn.type == 'openvpn'
         and media_vpn.credentials.openvpn_user | length > 0
         and media_vpn.credentials.openvpn_password | length > 0)
    fail_msg: >-
      media_vpn.enabled is true but the credentials for a
      {{ media_vpn.type }} connection are missing. Add them to the vault:
      ansible-vault edit inventory/group_vars/all/secrets.yml
      --vault-password-file .vault_pass
      -- then vault_vpn_wireguard_private_key and
      vault_vpn_wireguard_addresses for WireGuard, or vault_vpn_openvpn_user
      and vault_vpn_openvpn_password for OpenVPN. See the comments in
      inventory/group_vars/all/media.yml.
    success_msg: "VPN enabled: {{ media_vpn.provider }} over {{ media_vpn.type }}."
  when: media_vpn.enabled | bool
  tags:
    - media
    - media_acquisition
    - media_config

- name: Prepare media storage
  ansible.builtin.include_tasks:
    file: storage.yml
    apply:
      tags:
        - media
        - media_acquisition
  tags:
    - media
    - media_acquisition

- name: Resolve media secrets
  ansible.builtin.include_tasks:
    file: secrets.yml
    apply:
      tags:
        - media
        - media_acquisition
        - media_config
        # media_gating too: the gating credentials file needs the qBittorrent
        # password, so `--tags media_gating` on its own fails with
        # "'media_secrets' is undefined" without this.
        - media_gating
        - audiobook_import
  tags:
    - media
    - media_acquisition
    - media_config
    - media_gating
    - audiobook_import

# ------------------------------------------------------------------------------
# SEED CONFIGURATION
# ------------------------------------------------------------------------------

- name: Seed Servarr configuration files
  ansible.builtin.template:
    src: arr-config.xml.j2
    dest: "{{ media.appdata_dir }}/{{ item.key }}/config.xml"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0640"
    # Never overwrite: once the app has started, this file is its own.
    force: false
  loop: "{{ media_acquisition.services | dict2items | selectattr('value.enabled', 'truthy') | selectattr('value.env_prefix', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  tags:
    - media
    - media_acquisition

- name: Compute qBittorrent WebUI password hash
  # Runs on the Pi; the password is passed in the environment, not argv, so it
  # does not appear in the process list. Deterministic for a given password,
  # so re-runs do not churn the config file.
  ansible.builtin.script:
    cmd: files/qbt_pbkdf2.py
  environment:
    QBT_PASSWORD: "{{ media_secrets.qbittorrent_password }}"
  register: media_qbt_hash
  changed_when: false
  check_mode: false
  no_log: true
  when: media_acquisition.services.qbittorrent.enabled | bool
  tags:
    - media
    - media_acquisition
    - media_config

- name: Expose the qBittorrent password hash to templates
  ansible.builtin.set_fact:
    qbittorrent_password_hash: "{{ media_qbt_hash.stdout | trim }}"
  when:
    - media_acquisition.services.qbittorrent.enabled | bool
    - media_qbt_hash.stdout is defined
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config

- name: Check whether qBittorrent already has a configuration
  # Recorded BEFORE the seed template runs, so the next task can tell "the
  # app has config of its own that may need its password corrected" apart
  # from "we just wrote the config and it already has the right password".
  ansible.builtin.stat:
    path: "{{ media.appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
  register: media_qbt_conf_stat
  when: media_acquisition.services.qbittorrent.enabled | bool
  tags:
    - media
    - media_acquisition
    - media_config

- name: Seed qBittorrent configuration
  ansible.builtin.template:
    src: qBittorrent.conf.j2
    dest: "{{ media.appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0640"
    force: false
  when:
    - media_acquisition.services.qbittorrent.enabled | bool
    - qbittorrent_password_hash is defined
  no_log: true
  tags:
    - media
    - media_acquisition

- name: Read the current qBittorrent configuration
  # Needed to tell "no password set at all" from "qBittorrent has rewritten
  # the password hash with its own salt", which are very different situations.
  ansible.builtin.slurp:
    src: "{{ media.appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
  register: media_qbt_conf_content
  when:
    - media_acquisition.services.qbittorrent.enabled | bool
    - media_qbt_conf_stat.stat.exists | default(false)
  failed_when: false
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_config

- name: Restore the qBittorrent password when none is stored
  # ONLY when the config carries no password at all.
  #
  # Deliberately not reconciled on every run: qBittorrent re-salts the hash
  # each time it writes its config, so our deterministic value and its value
  # never match. Enforcing ours unconditionally made this task report
  # "changed" on every single deploy and restart the container each time,
  # while qBittorrent promptly rewrote it again - a loop that achieved
  # nothing.
  #
  # Both hashes authenticate the same password, so there is nothing to fix in
  # the normal case. If you change the password in the vault, delete the
  # Password_PBKDF2 line and re-run.
  ansible.builtin.lineinfile:
    path: "{{ media.appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
    regexp: '^WebUI\\Password_PBKDF2='
    line: 'WebUI\Password_PBKDF2="{{ qbittorrent_password_hash }}"'
    insertafter: '^\[Preferences\]'
  when:
    - media_acquisition.services.qbittorrent.enabled | bool
    - media_acquisition.services.qbittorrent.enforce_password
    - qbittorrent_password_hash is defined
    # Only for a config that already existed. A freshly seeded one was just
    # written with the correct hash, and in check mode it was not written at
    # all - so touching it here would fail on a file that does not exist.
    - media_qbt_conf_stat.stat.exists | default(false)
    # And only when there is genuinely no password stored.
    - media_qbt_conf_content.content is defined
    - "'Password_PBKDF2' not in (media_qbt_conf_content.content | b64decode)"
  no_log: true
  notify: Restart qbittorrent
  tags:
    - media
    - media_acquisition
    - media_config

- name: Seed Bazarr configuration directory
  ansible.builtin.file:
    path: "{{ media.appdata_dir }}/bazarr/config"
    state: directory
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0775"
  when: media_acquisition.services.bazarr.enabled | bool
  tags:
    - media
    - media_acquisition

- name: Seed Bazarr configuration
  ansible.builtin.template:
    src: bazarr-config.yaml.j2
    dest: "{{ media.appdata_dir }}/bazarr/config/config.yaml"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0640"
    force: false
  when: media_acquisition.services.bazarr.enabled | bool
  no_log: true
  tags:
    - media
    - media_acquisition

- name: Deploy Recyclarr configuration
  # Ansible owns this one outright: it is the config-as-code definition of the
  # quality profiles, so drift should be corrected, not preserved.
  ansible.builtin.template:
    src: recyclarr.yml.j2
    dest: "{{ media.appdata_dir }}/recyclarr/recyclarr.yml"
    owner: "{{ media.user.name }}"
    group: "{{ media.user.name }}"
    mode: "0640"
  when: media_acquisition.services.recyclarr.enabled | bool
  no_log: true
  notify: Restart recyclarr
  tags:
    - media
    - media_acquisition
    - media_config

# ------------------------------------------------------------------------------
# DEPLOY
# ------------------------------------------------------------------------------

- name: Create the internal media network
  community.docker.docker_network:
    name: "{{ media.network.name }}"
    driver: bridge
    state: present
    ipam_config:
      - subnet: "{{ media.network.subnet }}"
  when: not ansible_check_mode
  tags:
    - media
    - media_acquisition

- name: Deploy media acquisition compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ media_acquisition.stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
    validate: "docker compose -f %s config --quiet"
  register: media_acquisition_compose
  tags:
    - media
    - media_acquisition

- name: Pre-pull media acquisition images one at a time
  # `docker compose up` pulls every missing image in PARALLEL. Eleven
  # simultaneous pulls over a campground Wi-Fi uplink starve each other and
  # time out - which is exactly how the first deploy of this stack failed
  # (ghcr.io i/o timeout on radarr while ten others were in flight).
  #
  # Pulling serially with retries is slower in the best case and far more
  # likely to finish at all on a weak link, which is the case that matters
  # here. The images are pinned, so a pull is a no-op once it has succeeded.
  community.docker.docker_image_pull:
    name: "{{ item }}"
    pull: not_present
  loop: >-
    {{
      (media_acquisition.services | dict2items
       | selectattr('value.enabled', 'truthy')
       | map(attribute='value.image')
       | list
       + ([media_acquisition.vpn.image] if (media_vpn.enabled | bool) else []))
      | unique
    }}
  loop_control:
    label: "{{ item }}"
  register: media_acquisition_pull
  retries: 8
  delay: 30
  until: media_acquisition_pull is succeeded
  # ignore_errors, NOT failed_when: false - the latter rewrites every item's
  # `failed` to false, so a genuinely failed pull becomes indistinguishable
  # from a successful one and the check below silently passes. That is exactly
  # how the first attempt at this reported success while Prowlarr's image was
  # never pulled.
  ignore_errors: true
  when: not ansible_check_mode
  tags:
    - media
    - media_acquisition

- name: Fail clearly when images are missing
  # The stack cannot start without them: `docker compose up` is all-or-
  # nothing, so continuing would only produce a more confusing error.
  ansible.builtin.fail:
    msg: >-
      Could not pull {{ media_acquisition_pull_failures | length }} image(s) after
      8 attempts: {{ media_acquisition_pull_failures | join(', ') }}.
      The uplink is too unreliable right now. Everything else is already
      configured on disk - re-run `--tags media_acquisition` on a better
      connection and it will pick up where it left off.
  vars:
    media_acquisition_pull_failures: >-
      {{
        media_acquisition_pull.results | default([])
        | selectattr('failed', 'defined')
        | selectattr('failed')
        | map(attribute='item') | list
      }}
  when:
    - media_acquisition_pull.results is defined
    - media_acquisition_pull_failures | length > 0
  tags:
    - media
    - media_acquisition

- name: Start the media acquisition stack
  community.docker.docker_compose_v2:
    project_src: "{{ media_acquisition.stack_dir }}"
    state: present
    remove_orphans: true
    # never, not missing: every image is already local thanks to the serial
    # pull above, and `missing` still makes compose issue a registry HEAD per
    # service to resolve the tag - eleven round-trips that time out on a weak
    # uplink even when nothing needs downloading.
    pull: never
    timeout: 300
  register: media_acquisition_up
  when: not ansible_check_mode
  tags:
    - media
    - media_acquisition

- name: Pull and recreate pinned media acquisition images
  # Deliberate image refresh, separate from a normal deploy.
  #
  # The pins in defaults/main.yml name upstream versions, but linuxserver
  # rebuilds those same tags for base-image security updates. This re-pulls
  # them and recreates anything that moved - run it while you still have a
  # connection, not when you are parked somewhere with none.
  #
  # Self-contained on purpose: it works from the compose file already on disk,
  # so it needs no secrets and no re-render.
  #
  # Gated on an explicit variable rather than a `never` tag. site.yml injects
  # the module's tags into every task in the role, so a `never`-tagged task
  # still matches `--tags media` - and a normal deploy would then force a pull
  # that fails with no uplink. A variable cannot misfire that way.
  community.docker.docker_compose_v2:
    project_src: "{{ media_acquisition.stack_dir }}"
    state: present
    pull: always
    recreate: auto
    timeout: 600
  when:
    - not ansible_check_mode
    - media_update | default(false) | bool
  tags:
    - media
    - media_acquisition
    - media_update

# ------------------------------------------------------------------------------
# UPLINK GATING
# ------------------------------------------------------------------------------

- name: Install the media gating script
  ansible.builtin.template:
    src: frey-media-gate.sh.j2
    dest: /usr/local/bin/frey-media-gate
    owner: root
    group: root
    mode: "0755"
  tags:
    - media
    - media_acquisition
    - media_gating

- name: Ensure the Frey configuration directory exists
  ansible.builtin.file:
    path: /etc/frey
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags:
    - media
    - media_acquisition
    - media_gating
    - audiobook_import

- name: Install media gating credentials
  ansible.builtin.template:
    src: media-gate.env.j2
    dest: /etc/frey/media-gate.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags:
    - media
    - media_acquisition
    - media_gating
    - audiobook_import

- name: Install completed audiobook importer
  ansible.builtin.template:
    src: frey-audiobook-import.py.j2
    dest: /usr/local/bin/frey-audiobook-import
    owner: root
    group: root
    mode: "0755"
    validate: "python3 -m py_compile %s"
  tags:
    - media
    - media_acquisition
    - audiobook_import

- name: Install audiobook import units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - frey-audiobook-import.service
    - frey-audiobook-import.timer
  register: audiobook_import_units
  tags:
    - media
    - media_acquisition
    - audiobook_import

- name: Enable audiobook import timer
  ansible.builtin.systemd:
    name: frey-audiobook-import.timer
    daemon_reload: "{{ audiobook_import_units.changed }}"
    enabled: "{{ media_enable.audiobookrequest | bool and media_enable.audiobookshelf | bool and media_acquisition.services.qbittorrent.enabled | bool }}"
    state: "{{ 'started' if (media_enable.audiobookrequest | bool and media_enable.audiobookshelf | bool and media_acquisition.services.qbittorrent.enabled | bool) else 'stopped' }}"
  when: not ansible_check_mode
  tags:
    - media
    - media_acquisition
    - audiobook_import

- name: Install the NetworkManager dispatcher hook for media gating
  ansible.builtin.template:
    src: 90-frey-media-gate.j2
    dest: /etc/NetworkManager/dispatcher.d/90-frey-media-gate
    owner: root
    group: root
    # NetworkManager refuses to run dispatcher scripts that are writable by
    # anyone other than root.
    mode: "0755"
  when: media_acquisition.uplink_gating.mode != 'off'
  tags:
    - media
    - media_acquisition
    - media_gating

- name: Remove the media gating dispatcher hook when gating is off
  ansible.builtin.file:
    path: /etc/NetworkManager/dispatcher.d/90-frey-media-gate
    state: absent
  when: media_acquisition.uplink_gating.mode == 'off'
  tags:
    - media
    - media_acquisition
    - media_gating

- name: Install media gating systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - frey-media-gate.service
    - frey-media-gate.timer
  notify: Reload systemd for media gating
  tags:
    - media
    - media_acquisition
    - media_gating

- name: Apply systemd unit changes
  ansible.builtin.meta: flush_handlers
  tags:
    - media
    - media_acquisition
    - media_gating
    # media_config too, even though no systemd unit belongs to that tag.
    # Everything queued earlier in the run gets flushed here, and the one
    # that matters is "Restart qbittorrent" from the password restore: the
    # wiring that follows has to log into qBittorrent, and the credential it
    # needs is only live once that restart has happened.
    #
    # Without this tag a `--tags media_config` run queued the restart, failed
    # every login against the old credential, skipped the whole wiring stage,
    # and only then restarted at the end of the play - so recovering took two
    # runs and the first one looked like it had done nothing.
    - media_config

- name: Enable the media gating timer
  ansible.builtin.systemd:
    name: frey-media-gate.timer
    enabled: "{{ media_acquisition.uplink_gating.mode != 'off' }}"
    state: "{{ 'started' if media_acquisition.uplink_gating.mode != 'off' else 'stopped' }}"
  # Check mode does not write the unit file, so systemd cannot see a unit to
  # enable and the task would fail on a run that changes nothing.
  when: not ansible_check_mode
  tags:
    - media
    - media_acquisition
    - media_gating

# ------------------------------------------------------------------------------
# WIRING
# ------------------------------------------------------------------------------

- name: Wire the media services together
  ansible.builtin.include_tasks:
    file: configure/main.yml
    apply:
      tags:
        - media
        - media_acquisition
        - media_config
  when:
    - media_acquisition.configure.enabled
    - not ansible_check_mode
  tags:
    - media
    - media_acquisition
    - media_config
