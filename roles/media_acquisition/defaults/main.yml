---
# ==============================================================================
# MEDIA ACQUISITION
#
# The half of the media stack that needs internet: indexer search, download,
# import. It is a separate module from media_library precisely because it is
# useless without an uplink, so it can be paused, stopped or disabled on its
# own without touching playback.
#
# Shared settings (paths, uid/gid, languages, internal network, client
# targets) live in inventory/group_vars/all/main.yml under `media`.
#
# IMAGE PINS
# Every tag below is a concrete version, not `latest`. The old stack used
# `latest` everywhere, which means an unattended pull on a campground Wi-Fi
# can hand you a broken stack with no internet left to fix it. Bump these
# deliberately, then re-pull with `--tags media_update -e media_update=true`
# while you still have a connection.
# ==============================================================================

media_acquisition:
  stack_dir: "{{ frey.base_dir }}/stacks/media_acquisition"

  # ---------------------------------------------------------------------------
  # HOW THE SERVARR UIs AND APIs AUTHENTICATE
  #
  # method: External  - the apps do no login of their own, because something in
  #                     front of them does it. That something is Authelia, via
  #                     the forward-auth middleware; see
  #                     inventory/group_vars/all/identity.yml.
  #
  # required: Enabled - the API key is demanded on EVERY request, including from
  #                     private source addresses.
  #
  # `required` is not Servarr's default and the difference matters. Left at
  # DisabledForLocalAddresses, the key is waived for any request from a private
  # address - and every request arriving through Traefik has one, because it
  # comes from Traefik's container on a Docker bridge.
  #
  # The identity module exempts /api, /feed and /ping from the session check,
  # because an API client cannot answer a 302 to a login page and the wiring in
  # tasks/configure/ drives these APIs through Traefik. With the key waived,
  # that exemption would be an unauthenticated door into the API for anyone on
  # FreyHub. With it Enabled, those paths are authenticated by X-Api-Key
  # instead of by session - a different mechanism, not a missing one.
  #
  # Every integration this role configures is seeded with its key, so nothing
  # here depends on the waiver.
  #
  # Set method to `Forms` if you would rather create credentials by hand on
  # first visit.
  #
  # ONE `auth:` KEY ONLY. There were briefly two mappings of this name in this
  # file, and YAML keeps the last - so this block, added later with the
  # reasoning above, was silently discarded in favour of a stale
  # `required: DisabledForLocalAddresses`. Ansible only muttered "Found
  # duplicate mapping key" on its way past.
  # ---------------------------------------------------------------------------
  auth:
    method: External
    required: Enabled

  # ---------------------------------------------------------------------------
  # VPN
  #
  # The switch and the credentials live in
  # inventory/group_vars/all/media.yml, so turning the tunnel on is a one-line
  # edit in one obvious place. This is only the plumbing that reads it.
  #
  # When enabled, qBittorrent gets no network interface of its own and routes
  # entirely through the Gluetun container. If the tunnel drops, Gluetun's
  # firewall blocks everything rather than falling back to the campground's
  # network - torrent traffic stops instead of leaking.
  # ---------------------------------------------------------------------------
  vpn:
    enabled: "{{ media_vpn.enabled | bool }}"
    container_name: gluetun
    hostname: gluetun
    image: "qmcgaw/gluetun:{{ media_versions.gluetun }}"
    mem_limit: 512m
    # The host the *arrs use to reach qBittorrent. With the tunnel on,
    # qBittorrent has no hostname of its own - it lives inside Gluetun's
    # network namespace - so everything must address Gluetun instead.
    qbittorrent_host: >-
      {{
        'gluetun' if (media_vpn.enabled | bool)
        else media_acquisition.services.qbittorrent.hostname
      }}

  # ---------------------------------------------------------------------------
  # UPLINK GATING
  #
  # Public Wi-Fi comes and goes, and a captive portal looks like "connected"
  # while actually answering every request with a sign-in page. Left alone,
  # the *arrs burn through search attempts against that and collect indexer
  # rate-limit bans, while qBittorrent hammers a dead link.
  #
  # A NetworkManager dispatcher hook watches the uplink and reacts:
  #   mode: pause  - pause qBittorrent, apply alternate speed limits when the
  #                  connection is metered. Resume on a usable uplink.
  #   mode: stop   - additionally stop the *arr containers after a grace
  #                  period, to save power when parked off-grid for a while.
  #   mode: off    - no gating at all.
  #
  # `nmcli networking connectivity` reporting "portal" counts as NOT usable,
  # which is the whole point.
  # ---------------------------------------------------------------------------
  uplink_gating:
    mode: pause
    grace_seconds: 300
    metered_down_limit_kib: 256
    metered_up_limit_kib: 64

  # ---------------------------------------------------------------------------
  # AUTO-CONFIGURATION
  #
  # Ansible owns the wiring between services. Each app is seeded with a known
  # API key before its first start (so Ansible knows the key in advance), then
  # everything else is applied over each app's REST API - which is idempotent
  # and safe to re-run against a live container.
  #
  # Re-run just this part with: --tags media_config
  # ---------------------------------------------------------------------------
  configure:
    enabled: true
    # When true, a failed wiring step aborts the play. Default false on
    # purpose: the containers are already up and usable by then, and in a van
    # a hard failure here would also block the media_library module - the half
    # that actually matters with no internet. Failures are always reported
    # loudly at the end of the run either way.
    strict: false
    # Where the generated secrets are persisted on the Pi, mode 0600.
    #
    # Generated once and reused on every later run, so the stack needs no
    # manual secret handling to come up fully wired. Define
    # vault_media_api_keys in inventory/group_vars/all/secrets.yml to
    # override any of them and make them reproducible from the repo instead;
    # vault values always win over generated ones.
    key_file: "{{ media.appdata_dir }}/.media-keys.json"
    # Secrets this module owns. Listed explicitly rather than derived, so it
    # is obvious what exists and nothing appears by accident.
    #
    # NOT named `keys`: Ansible's dot notation resolves `configure.keys` to
    # the dict's own .keys() method instead of this list, and the error it
    # then raises points nowhere near the actual cause.
    secret_keys:
      - prowlarr
      - sonarr
      - radarr
      - lidarr
      - chaptarr
      - bazarr
      - qbittorrent_password
    # How long to wait for an app's API to answer before giving up on wiring it.
    #
    # 60 x 10s = 10 minutes per app. That sounds generous until you watch a
    # Pi 5 cold-start eleven .NET applications at once: each one runs its
    # database migrations on first boot, all competing for the same four
    # cores. The first deploy used 30 x 5s = 150s and every single app was
    # reported as "API never answered" while all of them were in fact
    # starting normally - the wiring then silently did nothing.
    #
    # The wait exits as soon as an app answers, so a warm re-run is still fast.
    api_timeout: 20
    api_retries: 60
    api_delay: 10

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # THE STACK'S OWN RESOLVER
  #
  # Why this container exists, because it is not obvious and it cost a day:
  #
  # The van's uplink has NO working IPv6 - no address on the uplink interface,
  # no default IPv6 route, and the containers get no global IPv6 address
  # either. Campground resolvers nonetheless answer AAAA for every
  # Cloudflare-fronted tracker, because the record genuinely exists.
  #
  # Docker's embedded resolver forwards to whatever the campground handed the
  # Pi over DHCP, so those AAAA records reach the *arrs. .NET's HttpClient
  # then connects to an IPv6 address that cannot be reached and gives up with
  #
  #     System.Net.Http.HttpRequestException: Resource temporarily
  #     unavailable (www.limetorrents.fun:443)
  #
  # which Prowlarr reports as "Unable to connect to indexer ... typically
  # caused by DNS/SSL issues". curl against the same URL succeeds, because
  # curl falls back to IPv4 and .NET does not - which is exactly what makes
  # this look intermittent and unreproducible by hand.
  #
  # Prowlarr then applies escalating backoff, the indexer is marked failed for
  # hours, and Sonarr and Radarr report "All search-capable indexers are
  # temporarily unavailable".
  #
  # dnsmasq with filter-AAAA removes the record the stack cannot use. A
  # resolver we own also means a campground's own broken or filtering DNS
  # stops being able to disable indexers - the failure mode that made this
  # recur at every new parking spot.
  #
  # Deliberately NOT the Pi's own dnsmasq on 10.20.0.1: the firewall is
  # default-deny INBOUND and nothing in this stack reaches the host by
  # address. This stays container-to-container, like everything else.
  # ---------------------------------------------------------------------------
  dns:
    # Fixed address so `dns:` on the other containers can name it. Docker
    # hands out dynamic addresses from the bottom of frey_media
    # ({{ media.network.subnet }}), so a high host address cannot collide.
    address: 172.28.255.53
    # Asked in order, and PREFERRED over the uplink's own resolver. All three
    # are plain DNS on 53; the point is not privacy but not depending on the
    # campground's resolver, which is frequently slow, filtering, or both.
    upstreams:
      - 9.9.9.9
      - 1.1.1.1
      - 8.8.8.8

    # -------------------------------------------------------------------------
    # PREFERRING PUBLIC DNS IS RIGHT. DEPENDING ON IT IS NOT.
    #
    # The list above assumes a network that lets a client talk to a resolver of
    # its choosing. Plenty do not: forcing all port 53 to the local resolver is
    # ordinary policy on library, hotel and campground Wi-Fi. When that happens
    # every upstream here is unreachable and the resolver cannot answer
    # anything - which takes out every indexer at once, even though the venue's
    # own resolver would have served them perfectly well.
    #
    # Measured on the `APNK Library` uplink, 2026-11-01: 9.9.9.9, 1.1.1.1 and
    # 8.8.8.8 all timed out from the Pi, while the DHCP-supplied 172.20.1.15
    # answered normally. Prowlarr reported "Indexers unavailable due to
    # failures: YTS, The Pirate Bay, LimeTorrents, Knaben, 1337x".
    #
    # WORSE, THE CONTAINER LOOKED FINE. Its healthcheck resolves a name, and a
    # 2000-entry cache meant that name kept answering from cache long after
    # every upstream had gone away. `docker ps` said healthy while no new
    # lookup could succeed, so the one signal pointing at DNS said the
    # opposite.
    #
    # So: probe the upstreams and configure only the ones that actually answer,
    # falling back to the host's own DHCP-supplied nameservers, which by
    # definition work on the network the van is parked on.
    #
    # Probing rather than listing both tiers together is deliberate. dnsmasq
    # queries all its servers and takes the first reply, so a venue resolver
    # that censors a domain could beat a public resolver that does not, and the
    # NXDOMAIN would be cached. `strict-order` would fix the ordering but make
    # every uncached lookup wait out three dead servers first. Choosing one
    # tier avoids both.
    #
    # THE CHOICE IS MADE AT RUNTIME, NOT AT DEPLOY TIME, and that distinction
    # is the whole fix. Which upstreams are usable is a property of the network
    # the van is parked next to, and it changes without a deploy - so baking
    # the winners into dnsmasq.conf is correct only until the van moves. It did
    # move: a deploy made on the `APNK Library` uplink pinned the resolver to
    # that library's 172.20.1.15/.16, and when the van left, all six Prowlarr
    # indexers went to a 24-hour backoff while `frey-media-dns-upstream status`
    # still reported every public upstream answering - because it probes from
    # the HOST, and the container had no `servers-file` to read.
    #
    # Instead, dnsmasq.conf carries no upstreams at all. It points
    # `servers-file` at a file that frey-media-dns-upstream rewrites in place -
    # on a ten-minute timer and on every NetworkManager event - and that
    # dnsmasq re-reads on SIGHUP, without a restart that would drop DNS for the
    # whole stack mid-search. Nothing below needs a deploy at a new parking
    # spot. See the `media_dns` tag in tasks/main.yml.
    # -------------------------------------------------------------------------
    # Name used to test whether an upstream really answers. Deliberately not an
    # indexer domain: those are exactly what a filtering network blocks, so one
    # would report a healthy resolver as dead.
    #
    # These two names are read by the frey-media-dns-upstream script template.
    # They were previously spelled `probe_timeout` and `fall_back_to_host_
    # resolvers` here while every consumer read `probe_timeout_seconds` and
    # `fallback_to_uplink`, so both settings were silently inert - the defaults
    # happened to match, which is why it never showed.
    probe_name: example.com
    probe_timeout_seconds: 3
    # Forward to the uplink's own DHCP resolvers while none of `upstreams`
    # answers. Turning this off removes the servers-file indirection entirely:
    # the upstream list is then fixed at deploy time and the stack resolves
    # nothing on a network that blocks outbound port 53.
    fallback_to_uplink: true
    # Where the above list is mounted inside the container. Mounted as a single
    # FILE, so the script must rewrite it in place rather than replace it by
    # rename, or dnsmasq keeps reading the old inode forever.
    servers_file: /etc/dnsmasq.servers
    # Strip AAAA. This is the whole reason the container exists.
    filter_aaaa: true
    cache_size: 2000

  # ---------------------------------------------------------------------------
  # INDEXERS
  #
  # The list itself is in inventory/group_vars/all/media.yml, because it is
  # something a human edits. This is the sync profile the audiobook sources
  # are put on.
  #
  # RSS off, searches on. RSS is a standing poll for everything new, which is
  # how a general tracker ends up feeding unrelated releases into Sonarr's
  # queue; an audiobook source only needs to answer when something asks it.
  #
  # enableAutomaticSearch is deliberately TRUE. It used to be false, which
  # meant Chaptarr and AudiobookRequest could not search these sources at all
  # unless someone clicked through the UI by hand - the automated half of the
  # audiobook pipeline silently did nothing.
  # ---------------------------------------------------------------------------
  indexers:
    audiobook_profile:
      name: Audiobook requests
      enable_rss: false
      enable_automatic_search: true
      enable_interactive_search: true
      minimum_seeders: 1

  services:
    resolver:
      # Follows byparr's switch only in spirit: this one is not optional while
      # anything in the stack needs to reach an indexer, so it tracks whether
      # the acquisition stack itself is doing anything.
      enabled: "{{ media_enable.prowlarr | bool or media_enable.sonarr | bool or media_enable.radarr | bool }}"
      image: dockurr/dnsmasq:{{ media_versions.dnsmasq }}
      container_name: frey-media-dns
      hostname: frey-media-dns
      port: 53
      mem_limit: 64m

    prowlarr:
      enabled: "{{ media_enable.prowlarr | bool }}"
      image: lscr.io/linuxserver/prowlarr:{{ media_versions.prowlarr }}
      container_name: prowlarr
      hostname: prowlarr
      port: 9696
      # Raised when the memory cgroup was enabled: these limits had never
      # been enforced, so none had been checked against real usage. Policy is
      # a ceiling of at least 2x measured idle RSS, so enforcement is a
      # backstop against a runaway container rather than a tripwire - an OOM
      # kill mid-write on a SQLite-backed service is the corruption risk this
      # van is already trying to avoid. Measured 270 MiB.
      mem_limit: 768m
      # One core each, for the same backstop reason as the memory ceiling and
      # applied to all six *arrs. Until now only qBittorrent and Byparr had a
      # CPU cap, so any *arr stuck in a loop could take a whole core of four
      # and compete directly with a Jellyfin software transcode - the Pi 5 has
      # no hardware encoder, so that transcode has nothing else to fall back
      # on and the result is a film that buffers. These services index and
      # rename in the background; nothing they do is latency-critical, so
      # being capped costs them time and nobody else anything.
      cpus: "1.0"
      env_prefix: PROWLARR
      api_version: v1

    sonarr:
      enabled: "{{ media_enable.sonarr | bool }}"
      image: lscr.io/linuxserver/sonarr:{{ media_versions.sonarr }}
      container_name: sonarr
      hostname: sonarr
      port: 8989
      mem_limit: 768m
      cpus: "1.0"
      # Servarr env prefix, used to inject the API key before first start.
      env_prefix: SONARR
      # Prowlarr's name for this application type.
      prowlarr_impl: Sonarr
      category: tv-sonarr
      # qBittorrent category field name differs per app in the Servarr API.
      category_field: tvCategory
      # Newznab/Torznab categories Prowlarr syncs to this application.
      sync_categories: [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5090]
      api_version: v3
      # Both paths are under the same /data mount, which is what lets an
      # import hardlink instead of copy.
      torrent_dir: /data/torrents/tv
      # Sonarr and Radarr (API v3) accept a root folder with nothing but a
      # path. Lidarr and Chaptarr do not - see their entries below.
      root_folders:
        - path: /data/media/tv

    radarr:
      enabled: "{{ media_enable.radarr | bool }}"
      image: lscr.io/linuxserver/radarr:{{ media_versions.radarr }}
      container_name: radarr
      hostname: radarr
      port: 7878
      mem_limit: 768m
      cpus: "1.0"
      env_prefix: RADARR
      prowlarr_impl: Radarr
      category: radarr
      category_field: movieCategory
      sync_categories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090]
      api_version: v3
      torrent_dir: /data/torrents/movies
      root_folders:
        - path: /data/media/movies

    lidarr:
      # Honest warning: Lidarr's metadata server has been unreliable through
      # 2026, so adding artists and library imports break periodically. This
      # is upstream, not configuration. Jellyfin plays music fine regardless.
      enabled: "{{ media_enable.lidarr | bool }}"
      image: lscr.io/linuxserver/lidarr:{{ media_versions.lidarr }}
      container_name: lidarr
      hostname: lidarr
      port: 8686
      mem_limit: 768m
      cpus: "1.0"
      env_prefix: LIDARR
      prowlarr_impl: Lidarr
      category: lidarr
      category_field: musicCategory
      sync_categories: [3000, 3010, 3030, 3040, 3050, 3060]
      api_version: v1
      torrent_dir: /data/torrents/music
      # Lidarr's v1 API rejects a path-only root folder: Name, a default
      # quality profile and a default metadata profile are all mandatory.
      # Profiles are resolved by NAME at run time rather than by hardcoded id,
      # because the ids an app assigns to its own built-in profiles are not
      # guaranteed.
      root_folders:
        - name: Music
          path: /data/media/music
          quality_field: defaultQualityProfileId
          quality_profile: Standard
          metadata_field: defaultMetadataProfileId
          metadata_profile: Standard

    chaptarr:
      # The maintained successor to Readarr, which was retired in June 2025.
      # Handles audiobooks and ebooks from one instance. Not a linuxserver
      # image, so it takes PUID/PGID but no lsio-specific environment.
      enabled: "{{ media_enable.chaptarr | bool }}"
      image: chaptarr/chaptarr:{{ media_versions.chaptarr }}
      container_name: chaptarr
      hostname: chaptarr
      port: 8789
      mem_limit: 768m
      cpus: "1.0"
      env_prefix: CHAPTARR
      # No healthcheck: this image ships no curl, so the check could never
      # pass - and a permanently-failing healthcheck makes Traefik drop the
      # container from the proxy entirely, which 404s the route while the app
      # is actually fine. The app is verified by the wiring step instead.
      healthcheck_enabled: false
      # Chaptarr is a Readarr fork, so Prowlarr still talks to it as Readarr.
      prowlarr_impl: Readarr
      category: chaptarr
      category_field: bookCategory
      # 3030 audiobooks, 7000/7020 books and ebooks.
      sync_categories: [3030, 7000, 7020]
      api_version: v1
      torrent_dir: /data/torrents/audiobooks
      # Chaptarr handles audiobooks and ebooks from one instance, so every
      # root folder must declare which it is and carry profiles for that
      # media type specifically - there is no single "default" profile field.
      #
      # folderType is a numeric enum: 0 = mixed, 1 = audiobook, 2 = ebook.
      root_folders:
        - name: Audiobooks
          path: /data/media/audiobooks
          extra:
            folderType: 1
          quality_field: audiobookQualityProfileId
          quality_profile: Audiobook
          metadata_field: audiobookMetadataProfileId
          metadata_profile: Audiobook Default
        - name: Ebooks
          path: /data/media/ebooks
          extra:
            folderType: 2
          quality_field: ebookQualityProfileId
          quality_profile: E-Book
          metadata_field: ebookMetadataProfileId
          metadata_profile: Ebook Default

    bazarr:
      enabled: "{{ media_enable.bazarr | bool }}"
      image: lscr.io/linuxserver/bazarr:{{ media_versions.bazarr }}
      container_name: bazarr
      hostname: bazarr
      port: 6767
      mem_limit: 768m
      cpus: "1.0"

    qbittorrent:
      enabled: "{{ media_enable.qbittorrent | bool }}"
      image: lscr.io/linuxserver/qbittorrent:{{ media_versions.qbittorrent }}
      container_name: qbittorrent
      hostname: qbittorrent
      port: 8080
      # Outbound-only. Nothing is published to the host: behind a venue's NAT
      # there is no inbound path anyway, so publishing it would only poke a
      # hole on the uplink side for no benefit.
      listen_port: 51234
      mem_limit: 1g
      cpus: "2.0"
      # BOTH halves of the credential come from the secret store, not from
      # here. A username is half of a credential, so it belongs with the
      # other half rather than in a role default that is committed in clear.
      #
      # Resolution order, same as every other media secret:
      #   1. vault_media_api_keys.qbittorrent_username  (vault always wins)
      #   2. whatever is already persisted in the key file
      #   3. 'admin', the fallback for a stack nobody has customised
      #
      # Change it in the vault and re-deploy. Ansible then moves BOTH sides at
      # once - qBittorrent's own config, the four *arr download clients and
      # the download-gate script - which is the whole point of it living here.
      # Changing it in qBittorrent's web UI instead changes only one side, and
      # the *arrs then fail every poll with a 401 until they are corrected by
      # hand. That is not hypothetical: it is how this default came to be
      # read from the vault.
      #
      # Deliberately NOT in configure.secret_keys: entries there are given a
      # random 32-hex value when missing, which is right for an API key and
      # useless for a username.
      web_username: "{{ (media_secrets | default({})).qbittorrent_username | default('admin', true) }}"
      # Rewrite the stored WebUI password on every run. Leave true so Ansible
      # stays able to log in; set false if you want to manage it by hand.
      enforce_password: true

    byparr:
      # Replaces FlareSolverr, which was archived upstream and no longer
      # clears the Cloudflare challenges trackers use. Byparr speaks the same
      # API, so Prowlarr treats it as a FlareSolverr proxy.
      #
      # It drives a real browser engine, hence the hard memory cap - this is
      # the one container most likely to balloon and threaten the gateway.
      enabled: "{{ media_enable.byparr | bool }}"
      image: ghcr.io/thephaseless/byparr:{{ media_versions.byparr }}
      container_name: byparr
      hostname: byparr
      port: 8191
      mem_limit: 1g
      cpus: "1.5"
      # Prowlarr applies the proxy only to indexers carrying this tag. Which
      # indexers wear it is declared in media_indexers (media.yml) and applied
      # by tasks/configure/indexers.yml - the tag existing is not enough, and
      # for a long time nothing actually wore it.
      proxy_tag: cloudflare
      # How long Prowlarr waits for a solve, in seconds.
      #
      # 180, not 60. A real browser solve of a Cloudflare interstitial on a
      # Pi 5 was measured at 52-66s for 1337x - over the old 60s limit often
      # enough that the indexer failed its test with "Http request timed out"
      # while Byparr was in fact succeeding, every time, a few seconds late.
      # The cost of a generous timeout is a slow search; the cost of a tight
      # one is an indexer that gets disabled.
      request_timeout: 180
      # Liveness probe path. Deliberately not /health: in Byparr 3.x that
      # endpoint runs an actual browser solve and outlasts any reasonable
      # timeout, which left the container permanently marked unhealthy.
      health_path: /docs

    recyclarr:
      # TRaSH-guide quality profiles and custom formats as code, on a timer.
      # Better than hand-maintaining profiles in each UI.
      enabled: "{{ media_enable.recyclarr | bool }}"
      image: ghcr.io/recyclarr/recyclarr:{{ media_versions.recyclarr }}
      container_name: recyclarr
      mem_limit: 256m
      # Runs once on start, then on this cron schedule (container-local).
      cron: "0 4 * * *"

    cleanuparr:
      # Strikes downloads that stall, crawl or refuse to import, removes them,
      # blocks the release and tells the *arr to search again. On an
      # intermittent uplink this matters far more than on a home server.
      enabled: "{{ media_enable.cleanuparr | bool }}"
      image: ghcr.io/cleanuparr/cleanuparr:{{ media_versions.cleanuparr }}
      container_name: cleanuparr
      hostname: cleanuparr
      port: 11011
      mem_limit: 512m

    unpackerr:
      # Extracts archived releases so imports do not silently stall.
      enabled: "{{ media_enable.unpackerr | bool }}"
      image: ghcr.io/unpackerr/unpackerr:{{ media_versions.unpackerr }}
      container_name: unpackerr
      mem_limit: 256m

  # ---------------------------------------------------------------------------
  # QUALITY PROFILES (applied by Recyclarr from the TRaSH Guides)
  #
  # Tuned for phones, tablets and laptop browsers playing from a Pi 5 that
  # cannot hardware-encode. Prefer H.264 + AAC at 1080p so clients direct-play
  # and the CPU never transcodes.
  #
  # German is the primary language, English the accepted fallback. TRaSH's
  # German custom-format coverage is thinner than its English coverage, so
  # expect to hand-tune a few scores after the first grabs.
  # ---------------------------------------------------------------------------
  profiles:
    radarr:
      template: hd-bluray-web
      quality_profile: HD Bluray + WEB
    sonarr:
      template: web-1080p-v4
      quality_profile: WEB-1080p
    # Scores applied on top of the TRaSH templates.
    score_overrides:
      x265_hd: -10000      # browsers transcode HEVC
      av1: -10000
      hdr_without_sdr: -10000
      german_dl: 500       # dual-audio German releases preferred
