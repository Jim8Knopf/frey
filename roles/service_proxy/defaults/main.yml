---
service_proxy:
  bind_address: 10.20.0.1

  packages:
    - ca-certificates
    - curl
    - docker.io
    - python3-docker
    # The Docker Compose v2 CLI plugin. Debian's docker.io package does NOT
    # include it, so `docker compose` does not exist without this - and every
    # compose-based service module fails at validation with a bare
    # "unknown shorthand flag: 'f' in -f".
    #
    # On Debian 13 the `docker-compose` package IS v2 (2.26.x, the Go
    # implementation) and registers itself at
    # /usr/libexec/docker/cli-plugins/docker-compose, which is what makes
    # `docker compose` work. It is not the old Python v1 tool.
    - docker-compose

  docker:
    data_root: /opt/frey/docker
    log_max_size: 10m
    log_max_file: "3"
    users: []

  traefik:
    image: traefik:v3
    container_name: frey-traefik
    network: frey_proxy
    dynamic_config_dir: /opt/frey/proxy/traefik/dynamic
    dashboard_enabled: false
    exposed_by_default: false
    http_port: 80
    https_port: 443

    # ------------------------------------------------------------------------
    # ENTRYPOINT TIMEOUTS
    #
    # Traefik's default readTimeout is 60 seconds, and readTimeout covers
    # reading the WHOLE request - headers and body. That is fine for every
    # click in every admin UI and fatally wrong for an upload: a 700 MB
    # audiobook pushed into Audiobookshelf over the van's wifi takes minutes,
    # so Traefik cuts the connection at exactly sixty seconds, every time,
    # however much of the file had arrived.
    #
    # The failure does not look like a timeout from either end. Traefik logs
    # HTTP 499 (context canceled) and Audiobookshelf - which only ever sees a
    # truncated multipart body - answers "Invalid request, no files". The tell
    # is that it always breaks at the same wall-clock moment rather than at
    # the same percentage, and that small files upload fine.
    #
    # This is the same bug the previous stack hit on Audiobookshelf and
    # Immich; see archive/legacy-stack/LDAP_SSO_ISSUES.md, issue 3. Half of
    # that fix was removing a `buffering` middleware, which this stack never
    # had - templates/traefik-dynamic.yml.j2 defines only secure-headers and
    # to-canonical. This is the other half.
    #
    # Set on both entrypoints because an upload can arrive over either: the
    # canonical routers are HTTPS, but the plain-HTTP routers serve the same
    # services unredirected while redirect_http_to_https is off.
    #
    # idle is deliberately much longer than the other two. It governs
    # keep-alive connections sitting between requests, and the long-polling
    # UIs - qBittorrent, Seerr - hold one open for as long as the tab is.
    # ------------------------------------------------------------------------
    timeouts:
      # Reading a request, body included. The ceiling on how long an upload
      # may take; raise it if a single file legitimately needs longer.
      read: 600s
      # Writing a response. The ceiling on a large download or a long
      # transcode stream.
      write: 600s
      # An established connection with no request in flight.
      idle: 3600s

    # ------------------------------------------------------------------------
    # ACCESS LOG
    #
    # One line per request through the proxy, on stdout. Nothing else to
    # plumb: Alloy already tails every container's stdout into Loki and
    # labels it from frey.module, so these arrive queryable as
    #
    #     {frey_module="service_proxy"}
    #
    # This is the log that answers "did the request even reach the service,
    # and what did the service say" - the question the previous stack could
    # not answer without it, and the reason the 60-second upload cut had to
    # be diagnosed from Audiobookshelf's own log instead.
    #
    # WHY THIS IS FILTERED RATHER THAN EVERYTHING
    #
    # The monitoring module probes every service through Traefik every 30
    # seconds (prometheus.yml.j2, job service_probe). That alone is tens of
    # thousands of 200s a day, all of them uninteresting. Logging the lot
    # would not just be noise: Docker caps this container at
    # log_max_size x log_max_file = 30 MB, so a day of probe traffic would
    # push the one failure you went looking for out of the ring buffer.
    #
    # Traefik ORs its filters, so the pair below means "every error, plus
    # anything slow enough to be interesting" - which catches the 499s of a
    # severed upload AND the successful multi-minute upload that replaces
    # them, while a 30-second probe cycle writes nothing at all.
    #
    # To log every request instead - worth doing briefly while chasing
    # something specific - set status_codes to "" and min_duration to 0.
    # ------------------------------------------------------------------------
    access_log:
      enabled: true

      # JSON because the consumer is Loki, not a human with `less`. Traefik's
      # default `common` is CLF, which has to be regex-scraped to get at the
      # duration or the router name; JSON gives Loki real fields.
      format: json

      # Status codes worth a line. 499 - Traefik's code for "the client went
      # away mid-request" - lives in this range, which is precisely the
      # upload-cut signature.
      status_codes: 400-599

      # ...plus any request slower than this, whatever its status. Uploads and
      # long downloads land here; no probe ever does.
      min_duration: 10s

      # ---------------------------------------------------------------------
      # DO NOT LOG QUERY STRINGS
      #
      # Traefik's own default for query parameters is `keep`, and that is not
      # safe in this stack. Jellyfin streams and image requests carry
      # `api_key=` in the URL, and the Servarr APIs accept `apikey=` there
      # too. Those requests come through this proxy from TVs and phones, so
      # `keep` would copy working API keys into Loki in plain text, where
      # they would sit for the whole retention period and show up in any
      # shared Grafana panel.
      #
      # Headers are dropped by Traefik's default already, which is what keeps
      # the Authelia session cookie and Authorization out; it is pinned here
      # rather than assumed, because it is a security property and defaults
      # change.
      # ---------------------------------------------------------------------
      query_parameters: drop
      headers: drop

    # ------------------------------------------------------------------------
    # PROMETHEUS METRICS
    #
    # Traefik is the one point every request already passes through, so
    # counting there answers "is it slow or is it broken" for every service
    # at once, and needs nothing from the services themselves.
    #
    # Derived from whether the monitoring module is enabled rather than being
    # a second switch to forget. The consequence worth knowing: a deploy that
    # has just enabled monitoring must include the proxy tag as well, or
    # Traefik will not have been told to publish anything:
    #
    #     --tags proxy,monitoring
    #
    # The entrypoint is container-internal and published nowhere. Prometheus
    # reaches it over the shared proxy network; nothing outside can.
    # ------------------------------------------------------------------------
    metrics:
      enabled: "{{ 'monitoring' in (frey.modules.enabled | default([])) }}"
      port: 8082
      # Per-router labels are what make a dropped router visible in the
      # metrics as well as in the probes. The cardinality cost is bounded by
      # the number of routers, which is about thirty here.
      add_router_labels: true

    # Force EVERY request to HTTPS at the entrypoint, including services with
    # no authentication in front of them.
    #
    # OFF by default, deliberately, and this is the considered choice rather
    # than a loose end.
    #
    # Services that sit behind Authelia are HTTPS-only regardless of this
    # setting - they have to be, because Authelia's session cookie is Secure
    # and would never come back over HTTP - and their plain-HTTP routers
    # redirect. That is per-service and automatic.
    #
    # Turning this on additionally forces HTTPS for the services with no auth,
    # which in this van means Jellyfin, Audiobookshelf and Seerr. The problem
    # is who plays them: a smart TV or a games console generally CANNOT install
    # a private root certificate, and unlike a browser it gives you no way to
    # proceed anyway. Forcing HTTPS there does not show a warning, it just
    # stops working, and "the TV cannot see Jellyfin any more" is a bad evening
    # in a van.
    #
    # So: admin tools are protected and encrypted, and the things a television
    # talks to keep answering plain HTTP until you decide otherwise. Turn this
    # on once every device that matters trusts the Frey CA.
    redirect_http_to_https: false
