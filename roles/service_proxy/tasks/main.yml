---
- name: Validate service proxy configuration
  ansible.builtin.assert:
    that:
      - service_proxy.bind_address | length > 0
      - service_proxy.docker.data_root | length > 0
      - service_proxy.traefik.network | length > 0
      - service_proxy.traefik.dynamic_config_dir | length > 0
    fail_msg: "service_proxy requires bind_address, docker.data_root, traefik.network, and traefik.dynamic_config_dir."
  tags:
    - services
    - proxy
    - docker

- name: Install Docker runtime packages
  ansible.builtin.apt:
    name: "{{ service_proxy.packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - services
    - proxy
    - docker

- name: Ensure Frey service directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ frey.base_dir }}"
    - "{{ service_proxy.docker.data_root }}"
    - "{{ service_proxy.traefik.dynamic_config_dir }}"
  tags:
    - services
    - proxy
    - docker

- name: Configure Docker daemon for NVMe-backed service data
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker
  tags:
    - services
    - proxy
    - docker

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  tags:
    - services
    - proxy
    - docker

- name: Apply Docker daemon changes before creating containers
  ansible.builtin.meta: flush_handlers
  tags:
    - services
    - proxy
    - docker

- name: Add configured users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups:
      - docker
    append: true
  loop: "{{ service_proxy.docker.users }}"
  when: service_proxy.docker.users | length > 0
  tags:
    - services
    - proxy
    - docker

- name: Create shared proxy network
  community.docker.docker_network:
    name: "{{ service_proxy.traefik.network }}"
    state: present
  when: not ansible_check_mode
  tags:
    - services
    - proxy
    - docker

- name: Configure Traefik dynamic middleware
  ansible.builtin.template:
    src: traefik-dynamic.yml.j2
    dest: "{{ service_proxy.traefik.dynamic_config_dir }}/middlewares.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart traefik
  tags:
    - services
    - proxy
    - docker

# ------------------------------------------------------------------------------
# TRAEFIK COMMAND LINE
#
# Built as a list rather than written inline, because the HTTP-to-HTTPS
# redirect is conditional and an entrypoint redirection can only be set on the
# static command line, not in the watched dynamic directory.
#
# Entrypoint timeouts are static for the same reason, and they are the setting
# that decides whether a large upload survives - see service_proxy.traefik.timeouts
# in this role's defaults. Changing them restarts Traefik; that is unavoidable,
# since Traefik re-reads the dynamic directory but never its own command line.
# ------------------------------------------------------------------------------
- name: Build the Traefik command line
  ansible.builtin.set_fact:
    service_proxy_traefik_command: >-
      {{
        [
          '--global.checknewversion=false',
          '--global.sendanonymoususage=false',
          '--api.dashboard=' ~ (service_proxy.traefik.dashboard_enabled | ternary('true', 'false')),
          '--providers.docker=true',
          '--providers.docker.exposedbydefault=' ~ (service_proxy.traefik.exposed_by_default | ternary('true', 'false')),
          '--providers.docker.network=' ~ service_proxy.traefik.network,
          '--providers.file.directory=/etc/traefik/dynamic',
          '--providers.file.watch=true',
          '--entrypoints.web.address=:80',
          '--entrypoints.websecure.address=:443',
          '--entrypoints.web.transport.respondingTimeouts.readTimeout='
            ~ service_proxy.traefik.timeouts.read,
          '--entrypoints.web.transport.respondingTimeouts.writeTimeout='
            ~ service_proxy.traefik.timeouts.write,
          '--entrypoints.web.transport.respondingTimeouts.idleTimeout='
            ~ service_proxy.traefik.timeouts.idle,
          '--entrypoints.websecure.transport.respondingTimeouts.readTimeout='
            ~ service_proxy.traefik.timeouts.read,
          '--entrypoints.websecure.transport.respondingTimeouts.writeTimeout='
            ~ service_proxy.traefik.timeouts.write,
          '--entrypoints.websecure.transport.respondingTimeouts.idleTimeout='
            ~ service_proxy.traefik.timeouts.idle,
        ]
        + (
            [
              '--entrypoints.web.http.redirections.entrypoint.to=websecure',
              '--entrypoints.web.http.redirections.entrypoint.scheme=https',
            ]
            if service_proxy.traefik.redirect_http_to_https | bool
            else []
          )
        + (
            [
              '--entrypoints.metrics.address=:' ~ service_proxy.traefik.metrics.port,
              '--metrics.prometheus=true',
              '--metrics.prometheus.entryPoint=metrics',
              '--metrics.prometheus.addEntryPointsLabels=true',
              '--metrics.prometheus.addServicesLabels=true',
              '--metrics.prometheus.addRoutersLabels='
                ~ (service_proxy.traefik.metrics.add_router_labels | ternary('true', 'false')),
            ]
            if service_proxy.traefik.metrics.enabled | default(false) | bool
            else []
          )
        + ['--log.level=INFO']
      }}
  tags:
    - services
    - proxy
    - docker

- name: Run Traefik reverse proxy
  community.docker.docker_container:
    name: "{{ service_proxy.traefik.container_name }}"
    image: "{{ service_proxy.traefik.image }}"
    state: started
    restart_policy: unless-stopped
    pull: true
    networks:
      - name: "{{ service_proxy.traefik.network }}"
    networks_cli_compatible: true
    published_ports:
      - "{{ service_proxy.bind_address }}:{{ service_proxy.traefik.http_port }}:80"
      - "{{ service_proxy.bind_address }}:{{ service_proxy.traefik.https_port }}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "{{ service_proxy.traefik.dynamic_config_dir }}:/etc/traefik/dynamic:ro"
    command: "{{ service_proxy_traefik_command }}"
    labels:
      frey.module: service_proxy
    security_opts:
      - no-new-privileges:true
  when: not ansible_check_mode
  tags:
    - services
    - proxy
    - docker
