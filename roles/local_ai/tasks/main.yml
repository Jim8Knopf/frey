---
# Fail before touching anything if the access policy is not what this role
# expects. The identity key and the role name must be renamed together, which
# this assert enforces.
- name: Validate local AI access policy
  ansible.builtin.assert:
    that:
      - local_ai.host in identity_services.local_ai.hosts
      - identity_services.local_ai.auth == 'forward_auth'
      - identity_services.local_ai.groups | sort == ['frey_admins', 'notes'] | sort
      - local_ai.default_model in local_ai.models
    fail_msg: >-
      local_ai is not registered correctly in identity_services, or
      default_model names a model that is not in the registry.

# Every artifact must be pinned by checksum. A model file is executable input
# to a process: an unverified download is an unreviewed dependency.
- name: Validate model registry checksums
  ansible.builtin.assert:
    that:
      - item.value.sha256 is match('^[a-f0-9]{64}$')
      - item.value.mmproj_file is not defined or item.value.mmproj_sha256 is match('^[a-f0-9]{64}$')
    fail_msg: "model '{{ item.key }}' has a missing or malformed SHA-256"
    quiet: true
  loop: "{{ local_ai.models | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Create local AI directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ local_ai.stack_dir }}"
    - "{{ local_ai.stack_dir }}/models.d"
    - "{{ local_ai.model_dir }}"

# --- Observer identity and boundaries --------------------------------------

- name: Install ACL tooling for the observer's notes access
  ansible.builtin.apt:
    name: acl
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: local_ai.observer.enabled | bool

- name: Create the observer group
  ansible.builtin.group:
    name: "{{ local_ai.observer.user_name }}"
    gid: "{{ local_ai.observer.gid }}"
    system: true
  when: local_ai.observer.enabled | bool

# Its own identity, owning exactly one directory. Deliberately not
# SilverBullet's uid: sharing that would mean a future read-write mount
# silently granted the observer write access to the notes.
- name: Create the observer user
  ansible.builtin.user:
    name: "{{ local_ai.observer.user_name }}"
    uid: "{{ local_ai.observer.uid }}"
    group: "{{ local_ai.observer.user_name }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: "{{ local_ai.observer.drafts_dir }}"
  when: local_ai.observer.enabled | bool

- name: Create the observer drafts directory
  ansible.builtin.file:
    path: "{{ local_ai.observer.drafts_dir }}"
    state: directory
    owner: "{{ local_ai.observer.uid }}"
    group: "{{ local_ai.observer.gid }}"
    mode: "0750"
  when: local_ai.observer.enabled | bool

# --- Broker -----------------------------------------------------------------

- name: Create the broker directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ local_ai.broker.base_dir }}", owner: root, group: root, mode: "0755"}
    # Owned by root, group-writable by the agent. NOT owned by the agent:
    # the broker runs with CapabilityBoundingSet= empty, so its root has no
    # CAP_DAC_OVERRIDE and is subject to ordinary permission checks. Against
    # a 0750 directory owned by uid 10002 root falls in "other" and cannot
    # even traverse it - and Python's glob() swallows that PermissionError
    # and yields nothing, so the broker sat there finding no requests and
    # logging nothing at all. Group ownership fixes it without handing the
    # capability back.
    - {path: "{{ local_ai.broker.req_dir }}",
       owner: root,
       group: "{{ local_ai.observer.gid }}", mode: "0770"}
    # Responses are written by root and only read by the agent, which also
    # mounts this read-only - so the agent cannot forge an answer to its own
    # request.
    - {path: "{{ local_ai.broker.res_dir }}", owner: root, group: root, mode: "0755"}
    # Root only. The agent cannot write here, so it cannot approve its own
    # proposal, and it cannot read here either - it checks status through the
    # proposal_status verb instead of being handed the directory.
    - {path: "{{ local_ai.broker.proposals_dir }}", owner: root, group: root, mode: "0700"}
    - {path: "{{ local_ai.broker.approved_dir }}", owner: root, group: root, mode: "0700"}
    - {path: "{{ local_ai.broker.deadman_dir }}", owner: root, group: root, mode: "0700"}
  when: local_ai.broker.enabled | bool

- name: Create the broker program directory
  ansible.builtin.file:
    path: "{{ local_ai.broker.script_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: local_ai.broker.enabled | bool

- name: Install the broker program
  ansible.builtin.copy:
    src: broker.py
    dest: "{{ local_ai.broker.script_path }}"
    owner: root
    group: root
    mode: "0750"
  when: local_ai.broker.enabled | bool
  notify: Restart local AI broker

- name: Create the directory holding the broker kill switch
  ansible.builtin.file:
    path: "{{ local_ai.broker.kill_switch | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: local_ai.broker.enabled | bool

- name: Install the broker supervisor program
  # Separate because the broker has PrivateNetwork=yes and cannot reach ntfy,
  # and because the deadman must be enforced by something the broker cannot
  # suppress by crashing or hanging.
  ansible.builtin.copy:
    src: broker_supervisor.py
    dest: "{{ local_ai.broker.supervisor_script_path }}"
    owner: root
    group: root
    mode: "0750"
  when: local_ai.broker.enabled | bool

- name: Install the proposal approval command
  ansible.builtin.template:
    src: frey-broker-approve.sh.j2
    dest: "{{ local_ai.broker.approve_command }}"
    owner: root
    group: root
    mode: "0750"
    validate: "bash -n %s"
  when: local_ai.broker.enabled | bool

- name: Install the broker units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ local_ai.broker.service_name }}.service"
    - "{{ local_ai.broker.service_name }}-supervisor.service"
    - "{{ local_ai.broker.service_name }}-supervisor.timer"
  register: local_ai_broker_unit
  when: local_ai.broker.enabled | bool
  notify: Restart local AI broker

- name: Reload systemd after changing the broker unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - local_ai.broker.enabled | bool
    - local_ai_broker_unit.changed
    - not ansible_check_mode

- name: Enable and start the broker
  ansible.builtin.systemd_service:
    name: "{{ local_ai.broker.service_name }}.service"
    enabled: true
    state: started
  when:
    - local_ai.broker.enabled | bool
    - not ansible_check_mode

- name: Enable the broker supervisor timer
  ansible.builtin.systemd_service:
    name: "{{ local_ai.broker.service_name }}-supervisor.timer"
    enabled: true
    state: started
  when:
    - local_ai.broker.enabled | bool
    - not ansible_check_mode

# --- Observer read surface --------------------------------------------------
#
# Mount only the paths that actually exist. Docker creates a missing bind
# source as an empty directory, which would litter /opt/frey with stubs for
# services that are not deployed yet - Immich being the current example.
- name: Check which observer read paths exist
  ansible.builtin.stat:
    path: "{{ item.src }}"
  loop: "{{ local_ai.observer.read_paths }}"
  loop_control:
    label: "{{ item.src }}"
  register: local_ai_read_path_stat
  when: local_ai.observer.enabled | bool

- name: Keep only the read paths present on this host
  ansible.builtin.set_fact:
    local_ai_observer_read_paths: >-
      {{
        local_ai_read_path_stat.results
        | selectattr('stat.exists', 'defined')
        | selectattr('stat.exists')
        | map(attribute='item')
        | list
      }}
  when: local_ai.observer.enabled | bool

# Internal-only, so the observer can reach Prometheus, Loki, Alertmanager and
# the alert relay without gaining egress. monitoring_internal is NOT internal
# despite its name, which is why this network exists at all. local_ai runs
# before monitoring, so creating it here means monitoring can join it as an
# external network.
- name: Create the internal observation network
  community.docker.docker_network:
    name: "{{ frey.ai_observe_network }}"
    internal: true
    state: present
  when:
    - local_ai.observer.enabled | bool
    - not ansible_check_mode

# --- Retire the campaign_ai deployment -------------------------------------
#
# Renaming a template does not remove what a previous deploy installed. The
# old containers would otherwise keep running and claim the same Traefik
# router names as the new ones, and the old timer would keep firing a unit
# whose script no longer exists.

- name: Stop and remove the retired campaign assistant containers
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
  loop: "{{ local_ai.legacy_containers }}"
  when: not ansible_check_mode

- name: Remove the retired campaign assistant network
  community.docker.docker_network:
    name: "{{ local_ai.legacy_network }}"
    state: absent
  when: not ansible_check_mode

- name: Remove the retired campaign assistant stack directory
  ansible.builtin.file:
    path: "{{ local_ai.legacy_stack_dir }}"
    state: absent
  when: not ansible_check_mode

# The retired model file is deliberately left on disk. It is 1.2 GiB of
# working fallback that cost a slow uplink to fetch, and deleting it is a
# judgement call for an administrator, not a side effect of a rename.

- name: Disable the retired download timer
  ansible.builtin.systemd_service:
    name: frey-campaign-ai-download.timer
    enabled: false
    state: stopped
  failed_when: false
  when: not ansible_check_mode

- name: Remove the retired download units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: "{{ local_ai.legacy_units }}"
  register: local_ai_legacy_removed

# --- Install the local AI stack --------------------------------------------

- name: Check whether the local AI stack directory exists
  ansible.builtin.stat:
    path: "{{ local_ai.stack_dir }}"
  register: local_ai_stack_stat

- name: Pull pinned local AI images
  community.docker.docker_image_pull:
    name: "{{ item }}"
    pull: not_present
  loop:
    - "{{ local_ai.image }}"
    - "{{ local_ai.gateway_image }}"
  when: not ansible_check_mode

- name: Install and validate the local AI compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ local_ai.stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
    validate: "docker compose -f %s --profile model config --quiet"
  when: not ansible_check_mode or local_ai_stack_stat.stat.exists

- name: Install local AI configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ local_ai.stack_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: route.yml.j2, dest: route.yml, mode: "0644"}
    - {src: download-model.sh.j2, dest: download-model.sh, mode: "0755"}
  when: not ansible_check_mode or local_ai_stack_stat.stat.exists
  notify: Restart local AI gateway

- name: Install the observer program
  ansible.builtin.copy:
    src: observer.py
    dest: "{{ local_ai.stack_dir }}/observer.py"
    owner: root
    group: root
    mode: "0644"
  when:
    - local_ai.observer.enabled | bool
    - not ansible_check_mode or local_ai_stack_stat.stat.exists
  notify: Restart local AI observer

- name: Install the notes committer
  # On the host because the agent's image has no git binary and its rootfs is
  # read-only, so it cannot commit its own writes. This also captures edits
  # made by hand in SilverBullet.
  ansible.builtin.template:
    src: frey-notes-commit.sh.j2
    dest: /usr/local/bin/frey-notes-commit
    owner: root
    group: root
    mode: "0750"
    validate: "bash -n %s"
  when: local_ai.campaign.enabled | bool

- name: Install the notes committer units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - frey-notes-commit.service
    - frey-notes-commit.timer
  register: local_ai_commit_units
  when: local_ai.campaign.enabled | bool

- name: Reload systemd after changing the notes committer
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - local_ai.campaign.enabled | bool
    - local_ai_commit_units.changed
    - not ansible_check_mode

- name: Enable the notes committer timer
  ansible.builtin.systemd_service:
    name: frey-notes-commit.timer
    enabled: true
    state: started
  when:
    - local_ai.campaign.enabled | bool
    - not ansible_check_mode

- name: Install the campaign assistant program
  ansible.builtin.copy:
    src: campaign.py
    dest: "{{ local_ai.stack_dir }}/campaign.py"
    owner: root
    group: root
    mode: "0644"
  when:
    - local_ai.campaign.enabled | bool
    - not ansible_check_mode or local_ai_stack_stat.stat.exists
  notify: Restart campaign assistant

- name: Install the notes ACL helper
  ansible.builtin.template:
    src: grant-notes-acl.sh.j2
    dest: "{{ local_ai.stack_dir }}/grant-notes-acl.sh"
    owner: root
    group: root
    mode: "0755"
  when:
    - local_ai.observer.enabled | bool
    - not ansible_check_mode or local_ai_stack_stat.stat.exists

- name: Grant the observer read access to the notes space
  ansible.builtin.command:
    cmd: "{{ local_ai.stack_dir }}/grant-notes-acl.sh"
  register: local_ai_notes_acl
  changed_when: "'CHANGED' in local_ai_notes_acl.stdout"
  when:
    - local_ai.observer.enabled | bool
    - not ansible_check_mode

- name: Install a download manifest for every registered model
  ansible.builtin.template:
    src: model.manifest.j2
    dest: "{{ local_ai.stack_dir }}/models.d/{{ item.key }}.manifest"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ local_ai.models | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    key: "{{ item.key }}"
    m: "{{ item.value }}"
  when: not ansible_check_mode or local_ai_stack_stat.stat.exists

- name: Install the model download service and retry timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - frey-local-ai-download@.service
    - frey-local-ai-download@.timer
  register: local_ai_download_unit

- name: Reload systemd after changing download units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - local_ai_download_unit.changed or local_ai_legacy_removed.changed
    - not ansible_check_mode

- name: Start the authenticated local AI gateway
  community.docker.docker_compose_v2:
    project_src: "{{ local_ai.stack_dir }}"
    services: [gateway]
    state: present
    pull: never
  when: not ansible_check_mode

# Started regardless of whether the model has finished downloading. With no
# model it still gathers and records evidence; the assessment section simply
# says the model did not answer. A monitoring component that refuses to run
# until everything else is perfect is useless in exactly the situation it
# exists for.
- name: Start the campaign assistant
  # Needs the model to answer, but starting without it is harmless: the chat
  # page simply reports that the model could not be reached.
  community.docker.docker_compose_v2:
    project_src: "{{ local_ai.stack_dir }}"
    profiles: [campaign]
    services: [campaign]
    state: present
    pull: never
  when:
    - local_ai.campaign.enabled | bool
    - not ansible_check_mode

- name: Start the read-only observer
  community.docker.docker_compose_v2:
    project_src: "{{ local_ai.stack_dir }}"
    profiles: [observer]
    services: [observer]
    state: present
    pull: never
  when:
    - local_ai.observer.enabled | bool
    - not ansible_check_mode

# --- Models ----------------------------------------------------------------

- name: Check which registered models have completed downloading
  ansible.builtin.stat:
    path: "{{ local_ai.model_dir }}/.{{ item.key }}.complete"
  loop: "{{ local_ai.models | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: local_ai_model_markers

- name: Start the served model when it is available
  community.docker.docker_compose_v2:
    project_src: "{{ local_ai.stack_dir }}"
    profiles: [model]
    services: [model]
    state: present
    pull: never
  when:
    - not ansible_check_mode
    - (local_ai_model_markers.results
       | selectattr('item.key', 'equalto', local_ai.default_model)
       | map(attribute='stat.exists') | first | default(false))

# A template timer must be enabled per instance. Enabling it for every
# registered model is what makes adding a model a one-entry change.
- name: Enable download retries for every registered model
  ansible.builtin.systemd_service:
    name: "frey-local-ai-download@{{ item.key }}.timer"
    enabled: true
    state: started
  loop: "{{ local_ai.models | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not ansible_check_mode

- name: Begin downloads in the background for models not yet complete
  ansible.builtin.systemd_service:
    name: "frey-local-ai-download@{{ item.item.key }}.service"
    state: started
    no_block: true
  loop: "{{ local_ai_model_markers.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - not ansible_check_mode
    - not item.stat.exists
