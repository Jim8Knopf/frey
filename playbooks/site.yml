---
- name: Deploy Frey modular baseline
  hosts: frey_gateways
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate enabled modules are registered
      ansible.builtin.assert:
        that:
          - frey_module in frey.modules.available
        fail_msg: "Module '{{ frey_module }}' is enabled but not registered in frey.modules.available."
      loop: "{{ frey.modules.enabled }}"
      loop_control:
        loop_var: frey_module
      tags: always

  tasks:
    - name: Include enabled Frey modules
      ansible.builtin.include_role:
        name: "{{ frey.modules.available[frey_module].role }}"
        apply:
          tags: "{{ frey.modules.available[frey_module].tags | default([frey_module]) }}"
      loop: "{{ frey.modules.enabled }}"
      loop_control:
        # Named loop_var: roles have their own `item` loops, and the default
        # collides with them once this include nests.
        loop_var: frey_module
        label: "{{ frey_module }}"
      tags: always
