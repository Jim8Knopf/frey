[defaults]
hash_behaviour = merge
inventory = inventory/hosts.yml
host_key_checking = False
retry_files_enabled = False
# Secrets live in inventory/group_vars/all/secrets.yml, which is vault
# ciphertext, so EVERY run needs the password - a run without it dies on the
# first variable lookup with "Attempting to decrypt but no vault secrets
# found." Pointing at the file here means plain
# `ansible-playbook playbooks/site.yml` works, and so does
# `ansible-vault edit`, instead of each one needing a repeated
# --vault-password-file. The file itself is gitignored and chmod 600.
vault_password_file = .vault_pass
local_tmp = .ansible/tmp
stdout_callback = default
result_format = yaml
callbacks_enabled = timer, profile_tasks
forks = 2
timeout = 60
gather_facts = True
roles_path = roles:/home/jim/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
pipelining = True
retries = 3
