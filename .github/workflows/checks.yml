name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install 'ansible-core>=2.19,<2.22' PyYAML Jinja2
          ansible-galaxy collection install -r requirements.yml
      # Everything that does not need the Pi lives in one script, so that what
      # CI runs and what you can run locally before pushing are the same
      # thing by construction rather than by remembering to update both.
      # It globs playbooks, test directories and shell scripts rather than
      # listing them: every listing in this file had, at some point, silently
      # excluded something real.
      - name: Run the offline checks
        run: scripts/run-checks.sh
