name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install 'ansible-core>=2.19,<2.22' PyYAML Jinja2
          ansible-galaxy collection install -r requirements.yml
      - name: Validate playbook syntax
        run: |
          printf '%s\n' ci-placeholder > "$RUNNER_TEMP/vault-password"
          export ANSIBLE_VAULT_PASSWORD_FILE="$RUNNER_TEMP/vault-password"
          ansible-playbook playbooks/site.yml --syntax-check
          ansible-playbook playbooks/nvme_migrate.yml --syntax-check
      - name: Validate YAML, JSON, and shell scripts
        run: |
          python3 scripts/check-repository-files.py
          for file in scripts/*.sh git-hooks/pre-commit git-hooks/post-commit git-hooks/test-pre-commit.sh; do
            bash -n "$file"
          done
          shellcheck --severity=warning scripts/*.sh git-hooks/pre-commit git-hooks/post-commit git-hooks/test-pre-commit.sh
      - name: Run focused tests
        # Globbed, not listed. The four directories named here before this
        # silently excluded roles/silverbullet/tests and roles/wifi_portal/tests
        # - fourteen passing tests that had never run in CI, because adding a
        # role's tests and adding a line here are two separate acts and the
        # second is easy to forget. A new roles/<m>/tests is now picked up with
        # no change to this file.
        run: |
          for dir in tests roles/*/tests; do
            # A tests directory with no PYTHON tests is not a failure, and
            # saying so is now necessary: Python 3.12+ exits 5 from
            # `unittest discover` when nothing ran, and roles/media_library/tests
            # holds JavaScript. Globbing roles/*/tests is what makes a new
            # role's tests run with no edit here, so the guard belongs beside
            # the glob rather than in it.
            if compgen -G "$dir/test_*.py" > /dev/null; then
              python3 -m unittest discover -s "$dir" -p 'test_*.py'
            else
              echo "no Python tests in $dir - skipping"
            fi
          done
          # The Node tests, for exactly the reason the Python ones are
          # globbed: they were in the tree and ran nowhere. Plain `assert`,
          # no package.json, no install step - node is preinstalled on
          # ubuntu-latest.
          for file in roles/*/tests/test_*.js tests/test_*.js; do
            [ -e "$file" ] || continue
            echo "node $file"
            node "$file"
          done
          # Offline test scripts: these take no arguments and need no host.
          python3 scripts/test-portal-logic.py
          python3 scripts/test-media-dns-upstream.py
          git-hooks/test-pre-commit.sh
